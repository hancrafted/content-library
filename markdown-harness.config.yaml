frontmatter:
  rules:
    - ruleId: agent-guide
      folders: [docs/agents/]
      intent: 'docs/agents/ holds method and procedure only, so every file declares itself an agent guide and product reference is caught here'
      fields:
        type:
          presence: required
          allowed:
            - { value: agent-guide, intent: Method and procedure that does not depend on the product. }
