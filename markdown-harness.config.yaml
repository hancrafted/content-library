frontmatter:
  rules:
    - ruleId: feature-guide
      folders: [docs/features/, docs/design/]
      intent: 'docs/features/ and docs/design/ hold product reference that drifts from the code, so every guide declares itself a feature guide and carries a review date'
      assess:
        stale: 'Check this against src/ and the ADRs before relying on it, then move stale_after.'
      fields:
        type:
          presence: required
          allowed:
            - { value: feature-guide, intent: Product reference that must be re-checked against the code. }
        title: &title
          presence: required
          intent: "The file name for a reader, equal to the file's h1 so retrieval can list the file by it; the title-matches-h1 check compares them."
        stale_after: { presence: required, format: datetime }
    - ruleId: product-vision
      folders: [docs/steering/]
      intent: 'docs/steering/ holds the product strategy every agent reads before a decision, so each file declares itself a steering document and its status says whether Han has reviewed it'
      fields:
        type:
          presence: required
          allowed:
            - {
                value: product-vision,
                intent: 'North star, horizons, ranked trade-off rules, escalation and non-goals: steers decisions without carrying the model.',
              }
        title: *title
        status:
          presence: required
          allowed:
            - { value: draft, intent: 'Written by an agent; Han has not reviewed the text yet.' }
            - { value: accepted, intent: 'Han reviewed the text and accepts it as the steering document.' }
    - ruleId: agent-guide
      folders: [docs/agents/]
      intent: 'docs/agents/ holds method and procedure only, so every file declares itself an agent guide and product reference is caught here'
      fields:
        type:
          presence: required
          allowed:
            - { value: agent-guide, intent: Method and procedure that does not depend on the product. }
        title: *title
    - ruleId: writing-guide
      folders: [docs/profile/]
      intent: "docs/profile/ holds Han's voice and mental models that steer episode writing, so every guide declares itself a writing guide and carries a review date"
      assess:
        stale: 'Check this against recent episode voice scripts and feedback before relying on it, then move stale_after.'
      fields:
        type:
          presence: required
          allowed:
            - { value: writing-guide, intent: "Reference describing Han's teaching style, mental models, or tone." }
        title: *title
        stale_after: { presence: required, format: datetime }
    - ruleId: glossary
      fileNames: [GLOSSARY.md]
      intent: 'The glossary holds the words spoken in voice sessions, so it carries a review date and an agent past it re-checks the terms'
      assess:
        stale: Check each term against the code and ADRs before relying on it, then move stale_after.
      fields:
        type:
          presence: required
          allowed:
            - { value: glossary, intent: 'The words spoken in voice sessions, each with the one meaning it has here.' }
        title: *title
        stale_after: { presence: required, format: datetime }
    # OKF §8: an index file carries no frontmatter except `okf_version`, which declares the folder an OKF
    # bundle (design-ADR 0005). Not governed by a `type` or a `title`, so it is its own rule.
    - ruleId: llm-wiki-index
      folders: [docs/llm-wiki/]
      fileNames: [index.md]
      intent: 'docs/llm-wiki/ is a declared OKF v0.2 bundle, and OKF §8 allows its index.md no frontmatter except the version that declares it'
      unknownKeys: forbidden
      fields:
        okf_version:
          presence: required
          allowed:
            - {
                value: '0.2',
                intent: 'The OKF revision every file in docs/llm-wiki/ follows, pinned by design-ADR 0005.',
              }
    - ruleId: staging-brief
      fileNames: [brief.md]
      intent: 'A Brief is written before any research and is the yardstick every later artifact is judged against, so each goal is concrete enough to judge a Dossier by. Its Slides are the spine write-dossier keeps. Fail if a goal is too vague to judge a Dossier against.'
      unknownKeys: forbidden
      fields:
        type:
          presence: required
          allowed:
            - { value: brief, intent: 'Goals: what the Episode must achieve, stated before it is written.' }
        title: *title
        # A Brief outlives Staging: Promotion moves it beside its Episode and removes the status line (design-ADR 0004).
        status:
          presence: optional
          allowed:
            - {
                value: draft,
                intent: 'A Brief in Staging is draft; Promotion removes the line when it moves the Brief to src/components/episodes/<slug>/.',
              }
        generated.by: &generated-by
          presence: required
          format: actor
          intent: 'Who wrote or last rewrote the file, as an OKF actor: `<producer>/<version>` for an agent (`claude-code/opus-5.5`), `human:<id>` for a person (`human:han`). Fail if an agent-written file names a person, or a file Han edited names an agent.'
        generated.at: &generated-at
          presence: required
          format: datetime
          intent: 'When the file last changed in substance, with an explicit UTC offset. A `verified` entry counts only while its `at` is at or after this, so an edit re-opens the gate.'
        verified: &verified
          intent: 'OKF §5.2 trust: who confirmed the file and when, as a list of `{ by, at }` or one bare mapping (OKF reads a bare mapping as a one-element list). `process:markdown-harness` once the checks pass, `human:han` once Han approves at the gate; an entry counts only while its `at` is at or after generated.at. The shape, actor and datetime are checked in tests/docs/episode-staging.test.ts, because one address cannot govern both the list and the bare mapping.'

    - ruleId: staging-dossier
      fileNames: [dossier.md]
      intent: "The Dossier is the Episode's one staging file: the spine, and per Slide what is shown, what is cited and what is said, written backwards from its Brief so that every actionable is spoken. The implementation is built from it without inventing material. Fail if an actionable of the Brief is never spoken, a page slide's material would leave an implementer guessing, or the file specifies styling or code."
      unknownKeys: forbidden
      fields:
        type:
          presence: required
          allowed:
            - {
                value: dossier,
                intent: 'The Episode in one file: what the viewer sees, the cited talking points, and what the speaker says, per Slide.',
              }
        title: *title
        status: &staging-status
          presence: required
          allowed:
            - {
                value: draft,
                intent: 'OKF lifecycle: a staging file stays draft until Promotion removes the line. The gate is not read from status but from `verified` (a machine entry once the checks pass, the entry of Han once he approves).',
              }
        generated.by: *generated-by
        generated.at: *generated-at
        verified: *verified
        locale: &staging-locale
          presence: required
          allowed:
            - {
                value: en,
                intent: 'English, the canonical text every translation starts from. Fail if authored text is in another language.',
              }
        brief: &staging-brief-link
          presence: required
          allowed:
            - {
                value: ./brief.md,
                intent: 'The Brief in the same folder, whose goals this file is written towards. Fail if slugged material serves no Learning goal, Actionable or Red thread step the Brief states.',
              }
    # A rule selects by literal file name, never by folder: folders do not recurse and every staging
    # folder is `docs/episodes/<slug>/`. So the identifier lives in a folder and the kind is the file
    # name: `research/<question-slug>/research.md` and `feedback/<NN>/feedback.md`. The same name
    # governs research after Promotion moves it to `docs/llm-wiki/research/<category>/<ID>__<question-slug>/`.
    - ruleId: research
      fileNames: [research.md]
      intent: 'A research file answers one question on its own, so any later Episode can cite it without the one that asked. Fail if understanding it needs the Brief or Episode that prompted it.'
      unknownKeys: forbidden
      assess:
        stale: 'Re-run the research question against current primary sources before citing this, then update the Findings and move stale_after.'
      fields:
        type:
          presence: required
          allowed:
            - { value: research, intent: 'Evidence: what the Sources show, reported for any reader.' }
        title: *title
        description:
          presence: required
          maxLength: 200
          intent: 'One sentence stating the Answer, which the retrieval job reads to decide whether this file answers a new question. Fail if it names the topic without stating the answer.'
        # design-ADR 0016, Citations rules 3 to 5. The writer proposes confidence and informs; Han confirms both at the
        # Promotion Gate with a `verified` entry by human:han, which counts only while its `at` is at or after
        # generated.at, so a re-run for staleness turns them back into a proposal. The content store checks that
        # every informs id is a Concept.
        confidence:
          presence: required
          allowed:
            - {
                value: settled,
                intent: 'When confidence is settled: the Answer rests on at least two independent primary Sources that agree, and no Source or Caveat contradicts it. Fail if it rests on one Source, or the Caveats name a contradiction.',
              }
            - {
                value: contested,
                intent: 'When confidence is contested: credible primary Sources disagree, or the effect is real but depends on context the Answer names. Fail if the Answer does not name the disagreement or the context.',
              }
            - {
                value: open,
                intent: 'When confidence is open: anything less, one Source, only weak Sources, or a mechanism still debated.',
              }
          intent: "How settled the evidence for the Answer is, never the writer's certainty. The writer proposes it by the three definitions; Han confirms it. Fail if the value is not earned by its definition."
        confidence_reason:
          presence: required
          intent: "The writer's one line on which Sources earn the confidence, by their numbers or kind, which Han reads when he confirms it at the Promotion Gate. Fail if it states the writer's certainty instead of what the Sources show, or names no Source or kind of Source."
        informs:
          presence: required
          intent: 'The Concept ids the question informs, the first its main one, so each Concept page lists its Research questions. Fail if the main Concept is not the subject the h1 asks about.'
        # design-ADR 0016, Pipeline and evidence rule 10. Written only by `npm run episode:merge-research`; the content
        # store refuses a research file under an id any supersedes line names.
        supersedes:
          intent: 'The Research question ids Han merged into this one at the Promotion Gate, each retired for good: never reused, every citation re-pointed here. Fail if the Answer does not carry the findings of a question it supersedes.'
        verified: *verified
        generated.by:
          presence: required
          format: actor
          intent: 'Who wrote the research, as an OKF actor: `<producer>/<version>` for an agent (`claude-code/opus-5.5`), `human:<id>` for a person (`human:han`). Fail if an agent-written file names a person, or a file Han edited names an agent.'
        generated.at:
          presence: required
          format: datetime
          intent: 'When the Sources were read and the Findings last changed in substance, with an explicit UTC offset, so a reader can weigh their age.'
        sources:
          minItems: 1
          intent: 'The primary sources the Findings rest on, as OKF §5.1 `sources`, each cited in the body as a `[n]` link, whose definition `[n]: <url> "title"` closes the file. Fail if a source reports on a work instead of being it, unless it is an earlier research file this one extends.'
        sources[].id:
          presence: required
          intent: 'The number a Finding cites the source by, `[n]`: the integers 1..n in order, each once. The staging test checks it against the body.'
        sources[].resource:
          presence: required
          format: uri
          intent: 'The URL or repo path of the source itself, the work and not a page about it.'
        sources[].title:
          presence: required
          intent: 'The source as a reader would name it: `<author>, <title>`.'
        stale_after:
          presence: required
          format: datetime
          intent: 'When the Findings stop being trustworthy: a year after generated.at, or six months when they concern a named product or version, or a price. Fail if it is later than that.'
    # A Concept is one flat folder per Concept, `docs/llm-wiki/concepts/<id>/concept.md`, its id the folder name
    # (design-ADR 0016, The Concept record). The Zod Concept schema in the content store checks what this cannot:
    # that every id in broader and related is a Concept, that broader has no cycle, and that only a top Concept
    # carries a theme. narrower is derived by the store, so it is not a field here and unknownKeys refuses it.
    - ruleId: concept
      fileNames: [concept.md]
      intent: 'A Concept is one subject, scoped by one sentence against its neighbours, so a Research question can name the Concepts it informs and an Episode card its theme. Fail if the definition overlaps a neighbouring Concept without saying where the line runs.'
      unknownKeys: forbidden
      fields:
        type:
          presence: required
          allowed:
            - { value: concept, intent: 'Evidence vocabulary: one subject the site groups proof and Episodes under.' }
        title: *title
        description:
          presence: required
          maxLength: 200
          intent: 'The one-sentence scoping definition against the neighbouring Concepts, ending with what it is not. Fail if it names the subject without saying where it stops.'
        aliases:
          presence: optional
          intent: 'Other names for the Concept. A Concept is never renamed: a better name becomes an alias and the id stays.'
        # markdown-harness reads an empty list as an absent field, so `broader: []` cannot be `required` here; the Zod
        # Concept schema in the content store requires the key.
        broader:
          presence: optional
          intent: 'Required by the content store. SKOS broader: the parent Concept ids, `[]` for a top Concept. Only a top Concept carries a theme, and a new top Concept is a design decision, not a content edit.'
        related:
          presence: optional
          intent: 'SKOS related: associative Concept ids, written on one side only; the content store mirrors them onto the other.'
        generated.by: *generated-by
        generated.at: *generated-at
        stale_after:
          presence: optional
          format: datetime
          intent: 'When the definition needs a re-check against the Research questions that inform it.'
        verified: *verified
    - ruleId: feedback
      fileNames: [feedback.md]
      intent: "One round of Han's feedback, kept so every item reaches the file it changes and the style harvest can learn from every round."
      unknownKeys: forbidden
      fields:
        type:
          presence: required
          allowed:
            - { value: feedback, intent: "Han's feedback for one round, each change as he asked for it." }
        title: *title
        generated.by: *generated-by
        generated.at: *generated-at
        round:
          presence: required
          intent: 'Which pass of the feedback loop this is, counting from 1, one file per round.'
        via:
          presence: required
          allowed:
            - { value: app, intent: 'When via is app: typed or dictated while reviewing the served Episode.' }
            - {
                value: voice,
                intent: "When via is voice: distilled from a Claude Desktop voice session's handoff, keeping each change without the conversation around it. Fail if an item keeps that conversation.",
              }
            - { value: practice, intent: 'When via is practice: changes Han found while rehearsing the recording.' }
            - {
                value: spec,
                intent: 'When via is spec: saved from the served Spec by `npm run episode:spec`, one item for the Title slide (`top`, whose Options carry the section slides) and one per page Slide, each naming its picks (`picked: 3b`, `picked: 4a, 4c` or `picked: none`) and the note, then the Visual language note.',
              }

    - ruleId: episode-design-reference
      fileNames: [design-reference.md]
      intent: 'A file (pdf, word) brought in as a model for the Episode (a deck, a sketch, miro slides export), converted using marker by `npm run convert-reference` so every job can read its words and see its pages. The script writes it; a job that changes a word breaks the copy.'
      unknownKeys: forbidden
      fields:
        type:
          presence: required
          allowed: [{ value: episode-design-reference }]
        title: *title
        generated.by:
          presence: required
          format: actor
          intent: 'The converter, as an OKF actor `marker/<version>`. Fail if it names an agent: an agent never writes this file.'
        generated.at:
          presence: required
          format: datetime
          intent: 'When the conversion ran, with an explicit UTC offset.'
        sources:
          minItems: 1
          maxItems: 1
          intent: 'The one file this design reference was converted from, as OKF §5.1 `sources`.'
        sources[].id:
          presence: required
          intent: 'Always 1: a design reference has one source.'
        sources[].resource:
          presence: required
          format: uri
          intent: 'The path of the original design-reference file, `.scratch/<slug>/<file-slug>.<file-extension>`.'
        sources[].title:
          presence: required
          intent: 'By default the same name as the file.'
        verified: *verified

body-structure:
  rules:
    - ruleId: staging-brief-body
      fileNames: [brief.md]
      intent: 'The sections a Brief must settle, in reading order, so the grill knows what is left and research starts from settled questions. Fail if a section holds what belongs in a different one.'
      undefinedHeadings: forbid
      headings:
        - {
            purpose: heading,
            level: 1,
            intent: 'The working title of the Episode, naming its subject. Fail if it names the Format or a process instead of the subject.',
          }
        - {
            purpose: heading,
            level: 2,
            allowed:
              [
                {
                  title: Format,
                  intent: 'Foundations, Teardown or Short, and the planned duration; together they set the scale of everything below. Fail if either is missing.',
                },
              ],
            mayHold: [prose],
          }
        - {
            purpose: heading,
            level: 2,
            allowed:
              [
                {
                  title: Audience,
                  intent: 'Who watches, what they already know and what they want, so every later choice can be judged against them. Fail if it names a group without saying what they know or want.',
                },
              ],
            mayHold: [prose],
          }
        - {
            purpose: heading,
            level: 2,
            allowed:
              [
                {
                  title: Style,
                  intent: 'One line naming a style from docs/design/design-guide.md and the audience reason for it; the designers keep that style for the whole Episode. Fail if it names no style, names none the design guide lists, or gives no audience reason.',
                },
              ],
            mayHold: [prose],
          }
        - {
            purpose: heading,
            level: 2,
            allowed:
              [
                {
                  title: Learning goal,
                  intent: 'What the viewer can do or explain afterwards, in one or two sentences, the end every Section moves towards. Fail if it names a topic to cover instead of a change in the viewer.',
                },
              ],
            mayHold: [prose],
          }
        - {
            purpose: heading,
            level: 2,
            allowed:
              [
                {
                  title: Actionables,
                  intent: 'Concrete steps a viewer takes after watching, one per item; each is later backed by at least one Slide. Fail if an item is a belief or a topic instead of a step a viewer could take.',
                },
              ],
            mayHold: [ordered-list],
          }
        - {
            purpose: heading,
            level: 2,
            allowed:
              [
                {
                  title: Hook,
                  intent: 'The opening that earns the first thirty seconds. Fail if it only announces the topic instead of giving the viewer a reason to stay.',
                },
              ],
            mayHold: [prose],
          }
        - {
            purpose: heading,
            level: 2,
            allowed:
              [
                {
                  title: Red thread,
                  intent: 'The single line of argument from the hook to the learning goal, which every Section advances. Fail if it lists topics instead of making one argument, or does not end at the learning goal.',
                },
              ],
            mayHold: [prose],
          }
        - purpose: heading
          level: 2
          presence: optional
          allowed:
            [
              {
                title: Threads,
                intent: 'Two Threads told in turns so the audience never follows one too long, chosen in the grill by planned duration in any Format.',
              },
            ]
          headings:
            - {
                purpose: heading,
                level: 3,
                allowed:
                  [
                    {
                      title: A thread,
                      intent: 'The first Thread, usually the mechanism or argument. Fail if it does not carry the Red thread.',
                    },
                  ],
                mayHold: [prose],
              }
            - {
                purpose: heading,
                level: 3,
                allowed:
                  [
                    {
                      title: B thread,
                      intent: 'The second Thread, told in turns with the A thread and strengthening it. Fail if cutting it would not weaken the A thread.',
                    },
                  ],
                mayHold: [prose],
              }
        - {
            purpose: heading,
            level: 2,
            allowed:
              [
                {
                  title: Analogy,
                  intent: 'One everyday picture the Episode returns to, giving the abstract idea a handle; a list keeps the parts of the picture as Han said them. Fail if picturing it takes expertise, or it offers several pictures.',
                },
              ],
            mayHold: [prose, unordered-list],
          }
        - {
            purpose: heading,
            level: 2,
            presence: optional,
            allowed:
              [
                {
                  title: Constraints,
                  intent: "Story rules every Slide obeys, one per item, so a writing job and its reviewer check each Slide against them. Fail if an item governs a single Slide, which belongs in that Slide's purpose.",
                },
              ],
            mayHold: [unordered-list],
          }
        - purpose: heading
          level: 2
          allowed:
            [
              {
                title: Slides,
                intent: 'The spine Han settled: one h3 per Section, each an ordered list of its page Slides, numbered on across Sections. Each item is `**<title>** — <purpose>. _Visual:_ <idea>`, with an optional `_Research:_ <n, m>` naming the research questions it rests on, and a leading `(A)` or `(B)` when the Brief has Threads; the staging test checks that shape. write-dossier keeps this spine. Fail if a purpose advances no step of the Red thread, the Slides take its steps out of argument order, the first Slide does not carry the Hook, or the last Section does not land the Learning goal.',
              },
            ]
          headings:
            - {
                purpose: enumeration,
                level: 3,
                minCount: 1,
                pattern: '^.{1,60}$',
                intent: 'A Section, titled as the table of contents names it, holding the page Slides that make one step of the Red thread. Fail if its Slides serve more than one step.',
                mayHold: [ordered-list],
              }
        - {
            purpose: heading,
            level: 2,
            allowed:
              [
                {
                  title: Research questions,
                  intent: "The questions the Episode's claims depend on, one per item, each researched on its own: a why question scoped to a subject matter. Fail if a question names the Episode, bundles two questions or asks what no claim needs, or a claim elsewhere in the Brief needs a question that is missing.",
                },
              ],
            mayHold: [ordered-list],
          }
        - {
            purpose: heading,
            level: 2,
            presence: optional,
            allowed:
              [
                {
                  title: Episode Design Reference,
                  intent: 'Files (pdf, word) brought in as a model for the Episode (a deck, a sketch, miro slides export), one per item, `[<title>](reference/<file-slug>/design-reference.md)`: the file the convert-references job writes from the copy at `.scratch/<slug>/<file-slug>.<file-extension>`. Fail if an item names a file the prompt or handoff did not bring.',
                },
              ],
            mayHold: [unordered-list],
          }
        - {
            purpose: heading,
            level: 2,
            presence: optional,
            allowed:
              [
                {
                  title: Open ideas,
                  intent: 'Ideas the grill did not settle, kept for the feedback loop; nothing here binds the run. Fail if an item restates or overrides a settled section.',
                },
              ],
          }
    - ruleId: staging-dossier-body
      fileNames: [dossier.md]
      intent: "Headings are the Episode's Slides, their titles copied verbatim into the Episode and their slugs keeping them addressable when a title changes; a heading without a slug adds material and may sit anywhere. Fail if any material contradicts the Voice script it sits beside."
      headings:
        - purpose: heading
          level: 1
          pattern: '^.{1,60} \{#[a-z0-9]+(?:-[a-z0-9]+)*\}$'
          intent: "The Title slide: a catchy, short title. Fail if the title is generic. No prose and no Visual sit under it: the Title slide uses the kit's title layout with motion none. Only the optional `#### Speaker notes` and `#### Voice script` blocks may, which the writing jobs leave out and a feedback round adds (the staging test checks them, as it does each Slide's). Fail if a Speaker note's claim is already spoken in the Voice script beside it, or an item would not stand as one spoken passage."
        - purpose: enumeration
          level: 2
          minCount: 1
          pattern: '^.{1,60} \{#[a-z0-9]+(?:-[a-z0-9]+)*\}$'
          intent: "A section slide naming one Section, one step of the Red thread, under a short title that names the step. It carries no Visual: it uses the kit's section layout with motion none. Its own `#### Voice script` block, directly under the heading, holds what the speaker says on the section slide, one `**<beat>** — <text>` item per spoken paragraph, as a page slide's does. Fail if the Section does not advance the Red thread, material here serves only one of its Slides, or a Voice script item would not stand as one spoken passage."
          headings:
            - purpose: enumeration
              level: 3
              minCount: 1
              pattern: '^.{1,60} \{#[a-z0-9]+(?:-[a-z0-9]+)*\}$'
              intent: 'A page slide: one point the speaker makes, under a catchy, short title that previews it. Fail if it makes more than one point, or its title does not preview that point.'
              headings:
                - purpose: heading
                  level: 4
                  allowed:
                    [
                      {
                        title: Visual,
                        intent: "The master slide and motion (`none` for no motion) that show this Slide's point, an optional `title:` line naming a different on-screen title than the heading, then prose on what the viewer sees, required when the master alone does not say it. Fail if the choice does not show the prose's point, or the master alone leaves that unsaid and no prose follows.",
                      },
                    ]
                  mayHold: [prose]
                - purpose: heading
                  level: 4
                  allowed:
                    [
                      {
                        title: Speaker notes,
                        intent: "Talking points a viewer opens beside the Slide, each adding a fact the speaker leaves out, with its source. Fail if a note's claim is already spoken in the prose beside it, or its source does not support it.",
                      },
                    ]
                  mayHold: [ordered-list]
                - purpose: heading
                  level: 4
                  allowed:
                    [
                      {
                        title: Voice script,
                        intent: 'One item per spoken paragraph, `**<beat>** — <text>`: first the beat and its keywords, which the speaker recalls at a glance, then the spoken paragraph in the same item, in order. Fail if an item would not stand as one spoken passage, or the text only makes sense while seeing a Slide.',
                      },
                    ]
                  mayHold: [ordered-list]
    - ruleId: research-body
      fileNames: [research.md]
      intent: 'Question, reason, answer, evidence and its limits, in that order, so a reader trusts the Answer as far as the Findings and Caveats carry it.'
      undefinedHeadings: forbid
      headings:
        - purpose: heading
          level: 1
          pattern: '^Why .+\?$'
          intent: 'The academic research question, scoped to one subject matter. Fail if it is so broad that no set of primary sources could answer it.'
        - {
            purpose: heading,
            level: 2,
            allowed:
              [
                {
                  title: Context,
                  intent: 'Why the question was asked, stated as the kind of claim it supports rather than the Episode that asked.',
                },
              ],
            mayHold: [prose],
          }
        - {
            purpose: heading,
            level: 2,
            allowed:
              [
                {
                  title: Answer,
                  intent: 'The answer to the h1 in 2–5 quotable sentences. Fail if it hedges without saying what is known, or states something no Finding supports and the Caveats do not flag as inference.',
                },
              ],
            mayHold: [prose],
          }
        - {
            purpose: heading,
            level: 2,
            allowed:
              [
                {
                  title: Findings,
                  intent: 'The evidence behind the Answer, one finding per item, each citing its source as `[n]`, the `id` of a frontmatter `sources` entry, whose link definitions close the file. Fail if a finding cites no source, or gives an opinion instead of what a source shows.',
                },
              ],
            mayHold: [ordered-list],
          }
        - {
            purpose: heading,
            level: 2,
            presence: optional,
            allowed:
              [
                {
                  title: Caveats,
                  intent: 'Limits of the Findings: what the Sources do not show, and any inference the Answer makes beyond them.',
                },
              ],
          }
    - ruleId: concept-body
      fileNames: [concept.md]
      intent: 'The definition first, then the longer explanation, so the Concept page and a reader skimming the file meet the definition before anything else.'
      undefinedHeadings: forbid
      headings:
        - purpose: heading
          level: 1
          intent: 'The Concept name, equal to the title.'
          mayHold: [prose]
    - ruleId: feedback-body
      fileNames: [feedback.md]
      headings:
        - {
            purpose: heading,
            level: 1,
            pattern: '^Feedback round \d+$',
            intent: "Names the round, `Feedback round <n>`, the number the file's `round` holds.",
          }
      intent: 'One list of items, each a single change keyed to its Slide (`top` the Title slide, a Section slug its section slide, `<section>--<slide>` a page Slide) and tagged with where it lands: `content`, any change to what a Slide says or cites, its title, Voice script or Speaker notes, routes to the Spec first and then the implementation; `implementation` to the code alone; `design`, a change to how a Slide looks that its picked Option does not give, routes to the Spec first and then the implementation; `practice` to the recording; a Spec review tags each item `design` and names its picks, so it routes to the Spec. Fail if an item holds more than one change, its tag sends it to the wrong place (a Voice script change tagged anything but `content`), or it cannot be acted on without asking Han.'
      undefinedHeadings: forbid
    - ruleId: episode-design-reference-body
      fileNames: [design-reference.md]
      intent: "One h2 per page of the PDF, in its order, each opening with the whole page as an image, then the page's text as OCR read it, its own headings moved two levels down, and the cut-outs worth reading. A Slide that copies a page cites `design-reference.md#page-<n>`."
      headings:
        - { purpose: heading, level: 1, intent: 'The design reference title, equal to the frontmatter title.' }
        - {
            purpose: enumeration,
            level: 2,
            minCount: 1,
            pattern: '^Page \d+$',
            intent: 'One page of the PDF, `Page <n>` counted from 1, its anchor `#page-<n>`.',
          }
    - ruleId: research-plan-body
      fileNames: [research-plan.md]
      intent: "Retrieval's decision per research question, across the Research questions of the wiki and of every Staging, so the pipeline's write-research jobs and the Dossier read one file instead of prose in a log. Fail if a question the Brief lists is missing from both sections, appears in both, or is planned new while a fresh question that fits is listed by `npm run episode:research -- list`. The staging test checks each item's references: an informs id that is no Concept, a reused id that does not exist, a refresh under another id."
      undefinedHeadings: forbid
      headings:
        - {
            purpose: heading,
            level: 1,
            allowed:
              [
                {
                  title: Research plan,
                  intent: "One Episode's research plan. Fail if it plans research for another Episode.",
                },
              ],
          }
        - {
            purpose: heading,
            level: 2,
            allowed:
              [
                {
                  title: Research jobs,
                  intent: "One item per job, in the Brief's order: `new: <research folder>, question <n>, informs <concept-id>, …` (the main Concept first), `refresh: <research folder>, question <n>, refreshes <the stale id>` (the folder keeps the stale id) or `migrate: <research folder>, <slide-slug>, informs <concept-id>, …` (a question that weighs a touched note's baseline sources). No item when every question is reused: the Research Stage then holds no job. customize-pipeline writes one write-research job per item and the foreach reads this heading. Fail if a question decided reuse is listed, or a new or migrate item names no Concept it informs.",
                },
              ],
            mayHold: [unordered-list],
          }
        - {
            purpose: heading,
            level: 2,
            presence: optional,
            allowed:
              [
                {
                  title: Reuse,
                  intent: 'One item per question an existing Research question of the wiki or another Staging already answers, fresh, `Question <n>: reuse <id>, confidence <value>, fresh until <date>`, the confidence and date copied from its frontmatter so the Dossier carries an open or contested caveat. Fail if an item names a question that does not fit the claim, or one past its stale_after.',
                },
              ],
            mayHold: [unordered-list],
          }
