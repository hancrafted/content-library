# The new-episode pipeline template. After Han approves the Brief, the
# orchestrator copies this file to docs/episodes/<slug>/pipeline.yml, tailors
# it for that Episode, and Han approves it by setting `status: approved`.
#
# Schema (checked by src/lib/episode-pipeline.pure.ts in `npm run verify`):
#   status    draft | approved
#   jobs      run once every job in `needs` is done; independent jobs may run in parallel
#     intent    optional; the job's task as a prompt, for a job no reference describes
#     needs     job ids this job waits for
#     foreach   optional; `<file>#<heading>` fans the job out once per list item
#     outputs   staging paths the job writes; a job reading one must need its writer;
#               a rule must govern every .md one, whose intents the implementor queries
#     checks    cheapest first; names and commands in SKILL.md's job-loop check table
#     retries   reviewer failures sent back before this branch of the pipeline stops
#     gate      optional; `human` stops the run until Han approves the output
#     agents    run in order; a reviewer is fresh: it did not write the output
#       type        implementor | reviewer
#       skills      skill names under .agents/skills/
#       references  files the agent reads: `references/` and `assets/` sit in this
#                   skill's folder, a job output in the staging folder, anything
#                   else at the repo root
#       rubric      reviewers only: `<file>#<heading>` holding the pass/fail lines
#       agent       optional; the Claude Code agent type to spawn, general-purpose when omitted
#       model       the model it runs on, or inherit; SKILL.md's job loop says where it applies
#       session     optional; subagent (default) or orchestrator, by SKILL.md's job loop
status: draft
jobs:
  - id: brief-grill
    needs: []
    outputs: [brief.md]
    checks: [mh, vitest]
    retries: 0
    gate: human
    agents:
      - type: implementor
        skills: [brief-grill, grilling, handoff]
        references: [references/brief-grill.md]
        model: inherit
        session: orchestrator

  - id: customize-pipeline
    needs: [brief-grill]
    outputs: [pipeline.yml]
    checks: [vitest]
    retries: 0
    gate: human
    agents:
      - type: implementor
        skills: []
        references: [references/customize-pipeline.md, assets/pipeline.yml, brief.md]
        model: inherit
        session: orchestrator

  # Matches each research question against the llm-wiki index and records in
  # the run log which questions remain unanswered.
  - id: retrieval
    needs: [customize-pipeline]
    outputs: [run-log.md]
    checks: [mh]
    retries: 0
    agents:
      - type: implementor
        skills: []
        references: [references/retrieval.md, brief.md, docs/llm-wiki/index.md]
        model: inherit

  - id: write-research
    needs: [retrieval]
    foreach: brief.md#research-questions
    outputs: [research/*/research.md]
    checks: [mh, vitest]
    retries: 2
    agents:
      - type: implementor
        skills: [research]
        references: [references/write-research.md, brief.md, run-log.md]
        model: sonnet
      - type: reviewer
        skills: []
        references: [references/write-research.md]
        rubric: references/write-research.md#rubric
        model: opus

  - id: write-dossier
    needs: [write-research]
    outputs: [dossier.md]
    checks: [mh, vitest]
    retries: 2
    agents:
      - type: implementor
        skills: []
        references:
          - references/write-dossier.md
          - brief.md
          - research/*/research.md
          - docs/profile/han/storytelling-guide.md
          - docs/profile/han/tone-guide.md
          - docs/profile/han/mental-model-guide.md
        model: inherit
      - type: reviewer
        skills: []
        references: [references/write-dossier.md, brief.md]
        rubric: references/write-dossier.md#rubric
        model: opus

  - id: write-manuscript
    needs: [write-dossier]
    outputs: [manuscript.md]
    checks: [mh, vitest]
    retries: 2
    agents:
      - type: implementor
        skills: []
        references:
          - references/write-manuscript.md
          - brief.md
          - dossier.md
          - docs/profile/han/storytelling-guide.md
          - docs/profile/han/tone-guide.md
          - docs/profile/han/mental-model-guide.md
        model: inherit
      - type: reviewer
        skills: []
        references: [references/write-manuscript.md, brief.md, docs/profile/han/tone-guide.md]
        rubric: references/write-manuscript.md#rubric
        model: opus

  # Writes no staging file: its output is a spec issue with one sub-issue per Section.
  - id: write-spec
    needs: [write-manuscript]
    outputs: []
    checks: []
    retries: 2
    agents:
      - type: implementor
        skills: [to-spec, to-tickets]
        references: [references/write-spec.md, brief.md, dossier.md, manuscript.md]
        model: inherit
      - type: reviewer
        skills: []
        references: [references/write-spec.md, dossier.md, manuscript.md]
        rubric: references/write-spec.md#rubric
        model: opus

  # Writes the Episode under src/, outside the staging folder.
  - id: implement-episode
    needs: [write-spec]
    outputs: []
    checks: [verify, build, test:build, visual-check]
    retries: 2
    agents:
      - type: implementor
        skills: [implement-spec, visual-check]
        references: [references/implement-episode.md, dossier.md, manuscript.md]
        model: opus
        session: orchestrator
      - type: reviewer
        skills: [code-review, visual-check]
        references: [references/implement-episode.md, dossier.md, manuscript.md]
        rubric: references/implement-episode.md#rubric
        model: opus
        session: orchestrator

  - id: open-pr
    needs: [implement-episode]
    outputs: []
    checks: []
    retries: 0
    agents:
      - type: implementor
        skills: [pr]
        references: [references/open-pr.md, run-log.md]
        model: sonnet
