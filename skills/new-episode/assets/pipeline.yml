# The new-episode pipeline template. `begin-run` copies this file to
# docs/episodes/<slug>/pipeline.yml as a draft the moment the Run begins,
# customize-pipeline tailors it for that Episode once the Setup jobs
# have collected what it needs, and finalizes it by setting
# `status: approved` (design-ADR-0008).
#
# Schema (checked by src/lib/episode-pipeline.pure.ts in `npm run verify`):
#   status    draft | approved
#   dev_port  per-run only, written by begin-run: the dashboard dev server's port, the
#             first free one from 4000; implement-episode-init serves the Episode there
#   spec_port per-run only, written by begin-run: the Spec server's port, dev_port + 1;
#             the dashboard links it
#   template  per-run only: the main commit the pipeline was tailored
#             from; the template is not merged into the Episode branch again until
#             open-pr is done
#   stages    the ordered stage ids; every job belongs to one, and a stage may hold none
#   jobs      run once every job in `needs` is done; independent jobs may run in parallel
#     stage     the stage the job belongs to, one of `stages`; a job needs or wants
#               only jobs of its own or an earlier stage
#     intent    optional; the job's task as a prompt, for a job no reference describes
#     needs     job ids this job waits for; a blocked one blocks this job too
#     wants     optional; job ids this job waits for, passed or blocked: a blocked
#               one does not block it, and its implementor learns which blocked
#     isolation optional; `worktree`: the job's agents and checks work in their own
#               worktree on episode/<slug>--<job id>, merged back only on a pass.
#               Required on a job that may run beside another or has foreach,
#               unless all its agents run in the orchestrator session
#     foreach   template and draft only; `<file>#<heading>`: customize-pipeline
#               writes one job per list item under the heading, or per h3 when it holds h3s.
#               An approved per-run pipeline has none, and no glob output
#     before    what runs before the implementor writes: `mh-query`, required when a job
#               writes markdown, has the implementor run `npx mh query <path>` on every
#               .md output and follow its intents; the reviewer runs it as its baseline
#     outputs   full repo paths in the staging folder docs/episodes/<slug>/; a job reading
#               one must need or want its writer; a rule must govern every .md one
#     checks    cheapest first; names and commands in SKILL.md's job-loop check table
#     retries   reviewer failures sent back before this branch of the pipeline stops
#     gate      optional; `human` stops the run until the user approves the output
#     port      per-run build jobs only, 1024–65535: the port the job's agent serves its
#               worktree on with `npx next dev -p <port>`, linked by the dashboard.
#               customize-pipeline assigns each build job its own; never 4382, the
#               dashboard's port. An approved per-run pipeline gives every build job one, except
#               implement-episode-init, which serves on dev_port
#     agents    run in order; a reviewer is fresh: it did not write the output
#       type        implementor | reviewer
#       skills      skill names under .agents/skills/, or plugin:skill; refused when the
#                   skill's SKILL.md sets disable-model-invocation: true (the Skill tool
#                   refuses it for every agent)
#       references  files the agent reads: `references/` and `assets/` sit in this
#                   skill's folder, anything else is a repo path
#       rubric      reviewers only: `<file>#<heading>` holding the pass/fail lines
#       agent       optional; the Claude Code agent type to spawn, general-purpose when omitted
#       model       the model it runs on, or inherit; SKILL.md's job loop says where it applies
#       session     optional; subagent (default) or orchestrator, by SKILL.md's job loop
status: draft
stages: [brief, setup, research, dossier, specification, build, pr]
jobs:
  - id: brief-grill
    stage: brief
    needs: []
    before: [mh-query]
    outputs: [docs/episodes/<slug>/brief.md]
    checks: [mh, vitest]
    retries: 2
    gate: human
    agents:
      - type: implementor
        skills: [brief-grill, grilling]
        references: [references/brief-grill.md]
        model: inherit
        session: orchestrator
      - type: reviewer
        skills: [writing-for-agents]
        references: [references/brief-grill.md]
        rubric: references/brief-grill.md#rubric
        model: opus

  # An information architect's call, before the pipeline names any research file.
  - id: categorize-research
    stage: setup
    intent: >-
      For each research question of the Brief, in its order, return its
      research folder and the Concepts it informs. When `npm run
      episode:research -- list` shows a Research question of the wiki or a
      Staging that answers it, name that question's folder. Otherwise name
      `<prefix>-<####>__<question-slug>`: the nearest existing prefix of
      GLOSSARY.md's Research categories, numbered by `npm run
      episode:research -- next <prefix>`, and the question's subject, not the
      Episode, in 20-40 characters of kebab case. The Concepts are ids from
      docs/llm-wiki/concepts/, the main one first. A question that fits no
      Concept gets a `concept-gap` note, `question <n> — <the subject no
      Concept covers>`, in place of a Concept you invent. Return the names,
      each beside its question and its Concepts.
    needs: [brief-grill]
    isolation: worktree
    outputs: []
    checks: [mh]
    retries: 1
    agents:
      - type: implementor
        skills: [domain-modeling]
        references: [GLOSSARY.md, docs/episodes/<slug>/brief.md]
        model: opus

  # Decides per research question, across the wiki and every open Staging:
  # reuse, refresh or new. Lists the questions needing a job under
  # `## Research jobs` in its research plan, which the write-research foreach
  # reads; with every question reused, the Research Stage holds no job.
  - id: retrieval
    stage: setup
    needs: [categorize-research]
    isolation: worktree
    before: [mh-query]
    outputs: [docs/episodes/<slug>/research-plan.md]
    checks: [mh]
    retries: 0
    agents:
      - type: implementor
        skills: []
        references: [references/retrieval.md, docs/episodes/<slug>/brief.md]
        model: inherit

  # Runs `npm run convert-reference` once per file the Brief lists under
  # References: a script, so no reviewer. A run with no References drops it.
  - id: convert-references
    stage: setup
    needs: [brief-grill]
    before: [mh-query]
    outputs: [docs/episodes/<slug>/reference/*/design-reference.md]
    checks: [mh, vitest]
    retries: 1
    agents:
      - type: implementor
        skills: []
        references: [references/convert-references.md, docs/episodes/<slug>/brief.md]
        model: inherit
        session: orchestrator

  # Wants convert-references rather than needing it: a missing conversion tool
  # leaves the design references out instead of blocking the Episode.
  - id: customize-pipeline
    stage: setup
    needs: [retrieval]
    wants: [convert-references]
    outputs: [docs/episodes/<slug>/pipeline.yml]
    checks: [vitest]
    retries: 0
    agents:
      - type: implementor
        skills: [writing-for-agents]
        references:
          - references/customize-pipeline.md
          - assets/pipeline.yml
          - docs/episodes/<slug>/brief.md
          - docs/episodes/<slug>/research-plan.md
        model: inherit
        session: orchestrator

  # One job per item retrieval lists under Research jobs, new, refresh or
  # migrate; a reused question has none.
  - id: write-research
    stage: research
    needs: [customize-pipeline]
    isolation: worktree
    foreach: docs/episodes/<slug>/research-plan.md#research-jobs
    before: [mh-query]
    outputs: [docs/episodes/<slug>/research/*/research.md]
    checks: [mh, vitest, sources]
    retries: 2
    agents:
      - type: implementor
        skills: [research, writing-for-agents]
        references: [references/write-research.md, docs/episodes/<slug>/brief.md, docs/episodes/<slug>/research-plan.md]
        model: sonnet
      - type: reviewer
        skills: []
        references: [references/write-research.md]
        rubric: references/write-research.md#rubric
        model: opus

  # Wants the research rather than needing it: a blocked question leaves a
  # gap the Dossier works around, instead of blocking the Episode.
  - id: write-dossier
    stage: dossier
    needs: [customize-pipeline]
    wants: [write-research]
    before: [mh-query]
    outputs: [docs/episodes/<slug>/dossier.md]
    checks: [mh, vitest]
    retries: 2
    agents:
      - type: implementor
        skills: []
        references:
          - references/write-dossier.md
          - docs/episodes/<slug>/brief.md
          - docs/episodes/<slug>/research-plan.md
          - docs/episodes/<slug>/research/*/research.md
          - docs/episodes/<slug>/reference/*/design-reference.md
          - docs/profile/storytelling-guide.md
          - docs/profile/tone-guide.md
          - docs/profile/mental-model-guide.md
        model: inherit
      - type: reviewer
        skills: []
        references: [references/write-dossier.md, docs/episodes/<slug>/brief.md]
        rubric: references/write-dossier.md#rubric
        model: opus

  # Rewrites the Voice script lines of dossier.md and nothing else; the staging
  # test checks that against write-dossier's commit, so no schema key says it.
  # No gate: the designers read the spoken argument, and the user reviews the Voice
  # script with the Spec and reworks it against the built Slides.
  - id: write-voice-script
    stage: dossier
    needs: [write-dossier]
    before: [mh-query]
    outputs: [docs/episodes/<slug>/dossier.md]
    checks: [mh, vitest]
    retries: 2
    agents:
      - type: implementor
        skills: []
        references:
          - references/write-voice-script.md
          - docs/episodes/<slug>/brief.md
          - docs/episodes/<slug>/dossier.md
          - docs/profile/storytelling-guide.md
          - docs/profile/tone-guide.md
          - docs/profile/mental-model-guide.md
        model: inherit
      - type: reviewer
        skills: []
        references:
          - references/write-voice-script.md
          - docs/episodes/<slug>/brief.md
          - docs/profile/storytelling-guide.md
          - docs/profile/tone-guide.md
        rubric: references/write-voice-script.md#rubric
        model: opus

  # The Spec: one static HTML page with two or three Options per Slide beside
  # its words (design-ADR-0011). The implementor runs in the orchestrator's
  # session, because it spawns one designer per Section and writes the page
  # alone. The user picks an Option per Slide through `npm run episode:spec`; every
  # review round is a new Attempt, and the user approves the Spec at the gate.
  - id: write-spec
    stage: specification
    needs: [write-voice-script]
    outputs: [docs/episodes/<slug>/spec/spec.html]
    checks: [vitest]
    retries: 2
    gate: human
    agents:
      - type: implementor
        skills: [ui-ux-pro-max:slides]
        references:
          - references/write-spec.md
          - references/spec-designer.md
          - assets/spec-frame.html
          - assets/spec-review.html
          - assets/sample-episode/spec/spec.html
          - GLOSSARY.md
          - docs/episodes/<slug>/brief.md
          - docs/episodes/<slug>/dossier.md
          - docs/design/slide-library.md
          - docs/design/design-guide.md
          - docs/design/design-system.md
          - docs/episodes/<slug>/reference/*/design-reference.md
        model: opus
        session: orchestrator
      - type: reviewer
        skills: [ui-ux-pro-max:ui-ux-pro-max]
        references:
          - references/write-spec.md
          - references/spec-designer.md
          - GLOSSARY.md
          - docs/episodes/<slug>/brief.md
          - docs/episodes/<slug>/dossier.md
          - docs/design/slide-library.md
          - docs/design/design-guide.md
          - docs/episodes/<slug>/reference/*/design-reference.md
        rubric: references/write-spec.md#rubric
        model: opus

  # Writes the Episode's page under src/, outside the staging folder: its
  # wiring, metadata, Title slide and one placement marker per Section.
  # From here on every job reads the Spec alone: the Spec Gate deleted
  # dossier.md, and the schema check refuses a later job that reads it.
  - id: implement-episode-init
    stage: build
    needs: [write-spec]
    outputs: []
    checks: [verify, build]
    retries: 2
    agents:
      - type: implementor
        skills: [tdd, vercel-react-best-practices, commit]
        agent: archgate:developer
        references:
          - references/implement-episode-init.md
          - references/skill-overrides.md
          - docs/episodes/<slug>/brief.md
          - docs/episodes/<slug>/spec/spec.html
        model: opus
      - type: reviewer
        skills: [code-review, vercel-react-best-practices]
        references:
          - references/implement-episode-init.md
          - references/skill-overrides.md
          - docs/episodes/<slug>/spec/spec.html
        rubric: references/implement-episode-init.md#rubric
        model: opus
        session: orchestrator

  # One job per Section, the h3s under the Brief's Slides, in parallel: each
  # builds its Slides at its own placement marker.
  - id: implement-section
    stage: build
    needs: [implement-episode-init]
    isolation: worktree
    foreach: docs/episodes/<slug>/brief.md#slides
    outputs: []
    checks: [verify, build, test:build, impeccable, visual-check]
    retries: 2
    agents:
      - type: implementor
        skills: [tdd, visual-check, vercel-react-best-practices, web-design-guidelines, commit]
        agent: archgate:developer
        references:
          - references/implement-section.md
          - references/skill-overrides.md
          - docs/episodes/<slug>/spec/spec.html
          - docs/episodes/<slug>/reference/*/design-reference.md
        model: opus
      # code-review spawns its own subagents, so the reviewer runs in the
      # orchestrator's session; its subagents give the fresh eyes.
      - type: reviewer
        skills:
          - code-review
          - visual-check
          - ui-ux-pro-max:ui-ux-pro-max
          - vercel-react-best-practices
          - web-design-guidelines
          - performance-optimization
        references:
          - references/implement-section.md
          - references/skill-overrides.md
          - docs/episodes/<slug>/spec/spec.html
          - docs/episodes/<slug>/reference/*/design-reference.md
        rubric: references/implement-section.md#rubric
        model: opus
        session: orchestrator

  - id: open-pr
    stage: pr
    needs: [implement-section]
    outputs: []
    checks: []
    retries: 0
    agents:
      - type: implementor
        skills: [pr]
        references: [references/open-pr.md]
        model: sonnet
