<!doctype html>
<html lang="en" data-mode="decide" data-page-id="spec" data-revision="1">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="spec-template-source-hash" content="aa5fe5a867499d71212723cfd352bc57fd1956dd31e40008596024b2e95e6d99" />
    <title data-slot="page-title">Spec · Episode title</title>
    <!--
      The Spec template (design-ADR 0011): the page frame, the review form and two <template>s, an item (a Slide, or
      the Title slide with its echoes) and an Option. `npm run episode:spec-assemble` clones the templates, fills the
      data-slot elements and sets data-item, data-fidelity, data-option, data-recommended and data-revision; the
      slot and template names are in references/spec-calibration.md. It is regenerated by to-decision-html from that
      calibration, never edited per Episode.
    -->
    <style>
      /*
       * The Spec's page frame. design.css (compiled from the site's globals.css, inlined by `npm run episode:spec-assemble`) supplies
       * the tokens and every utility the mocks use; this block only lays out the review page around them. The
       * fallback layer ranks below Tailwind, so the page still reads in system colours when opened without it. The assembled page links nothing: css and script are inline.
       */
      @layer fallback;

      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        font-family: var(--font-sans, system-ui, sans-serif);
        line-height: 1.55;
        color: var(--foreground, CanvasText);
        background: color-mix(in oklch, var(--muted, Canvas) 55%, var(--background, Canvas));
      }
      code {
        font-family: var(--font-mono, ui-monospace, monospace);
        font-size: 0.85em;
      }

      /* Layout: a sticky outline beside one wide column. */
      .spec-shell {
        display: grid;
        grid-template-columns: 15rem minmax(0, 1fr);
        gap: 2.5rem;
        max-width: 96rem;
        margin: 0 auto;
        padding: 0 2rem 8rem;
      }
      .spec-outline {
        position: sticky;
        top: 4rem;
        align-self: start;
        max-height: calc(100vh - 4rem);
        overflow-y: auto;
        padding: 2rem 0;
        font-size: 0.8125rem;
      }
      .spec-outline ol {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .spec-outline > ol > li {
        margin-bottom: 1rem;
      }
      .spec-outline .spec-outline-section {
        display: block;
        font-weight: 600;
        color: var(--muted-foreground, GrayText);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-size: 0.6875rem;
        margin-bottom: 0.25rem;
      }
      .spec-outline a {
        display: flex;
        gap: 0.5rem;
        align-items: baseline;
        padding: 0.2rem 0.5rem;
        border-radius: 0.375rem;
        color: inherit;
        text-decoration: none;
      }
      .spec-outline a:hover {
        background: var(--card, Canvas);
      }
      .spec-outline a::before {
        content: '';
        flex: none;
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 999px;
        border: 1.5px solid var(--muted-foreground, GrayText);
        transform: translateY(-0.05rem);
      }
      .spec-outline a[data-state='picked']::before {
        background: var(--success, Highlight);
        border-color: var(--success, Highlight);
      }
      .spec-outline a[data-state='open']::before {
        border-color: var(--primary, Highlight);
      }

      .spec-page {
        min-width: 0;
        padding-top: 2rem;
      }
      .spec-masthead {
        padding: 3rem 0 2rem;
      }
      .spec-kicker {
        font-family: var(--font-mono, monospace);
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--primary, Highlight);
        margin: 0 0 0.75rem;
      }
      .spec-masthead h1 {
        font-size: var(--size-hero, 3rem);
        line-height: 1.05;
        letter-spacing: -0.02em;
        margin: 0 0 1rem;
      }
      .spec-masthead p {
        max-width: 48rem;
        color: var(--muted-foreground, GrayText);
        font-size: 1.125rem;
        margin: 0;
      }

      /* Cards: Style, Visual language, Episode page and each Slide's words. */
      .spec-card {
        background: var(--card, Canvas);
        border: 1px solid var(--border, GrayText);
        border-radius: 1rem;
        padding: 1.5rem 1.75rem;
      }
      .spec-intro {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(22rem, 1fr));
        gap: 1.25rem;
        margin-bottom: 4rem;
      }
      .spec-intro h2,
      .spec-card h4 {
        font-family: var(--font-mono, monospace);
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted-foreground, GrayText);
        margin: 0 0 0.75rem;
        border: 0;
      }
      .spec-intro ul {
        margin: 0;
        padding-left: 1.1rem;
      }
      .spec-intro li + li {
        margin-top: 0.4rem;
      }

      /* A Section opens with a band; its section slide's Voice script sits in it. */
      [data-spec='section'] {
        margin-top: 5rem;
      }
      .spec-section-band {
        border-radius: 1.25rem;
        padding: 2.5rem 2.75rem;
        background: var(--foreground, CanvasText);
        color: var(--background, Canvas);
      }
      .spec-section-band h2 {
        font-size: var(--size-heading, 2.5rem);
        line-height: 1.1;
        letter-spacing: -0.015em;
        margin: 0 0 0.25rem;
        border: 0;
      }
      .spec-section-band .spec-kicker {
        color: inherit;
        opacity: 0.6;
      }
      .spec-section-band [data-spec='voice-script'] {
        max-width: 52rem;
        margin-top: 1.5rem;
        opacity: 0.85;
      }

      /* A Slide: header, its words as tabs, the Option stage, then its note. */
      [data-spec='slide'] {
        margin-top: 4rem;
        scroll-margin-top: 5rem;
      }
      .spec-slide-head {
        display: flex;
        align-items: baseline;
        gap: 1rem;
        margin-bottom: 1.25rem;
      }
      .spec-slide-head h3 {
        font-size: var(--size-subheading, 2rem);
        line-height: 1.15;
        letter-spacing: -0.01em;
        margin: 0;
      }
      .spec-slide-head .spec-number {
        font-family: var(--font-mono, monospace);
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--primary, Highlight);
        border: 1.5px solid currentColor;
        border-radius: 999px;
        padding: 0.1rem 0.6rem;
        transform: translateY(-0.3rem);
      }

      /* Option tabs: built by the script below from the figures; without it the Options stack. */
      .spec-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 0.75rem;
      }
      .spec-tabs button {
        font: inherit;
        font-size: 0.875rem;
        font-weight: 600;
        display: inline-flex;
        gap: 0.5rem;
        align-items: center;
        padding: 0.45rem 0.9rem;
        border-radius: 999px;
        border: 1px solid var(--border, GrayText);
        background: var(--card, Canvas);
        color: inherit;
        cursor: pointer;
      }
      .spec-tabs button[aria-selected='true'] {
        background: var(--foreground, CanvasText);
        color: var(--background, Canvas);
        border-color: transparent;
      }
      .spec-tabs .spec-badge {
        font-size: 0.6875rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        padding: 0.05rem 0.45rem;
        border-radius: 999px;
        background: var(--primary, Highlight);
        color: var(--primary-foreground, HighlightText);
      }
      .spec-tabs .spec-picked {
        color: var(--success, Highlight);
      }
      .spec-options.is-tabbed > [data-spec='option'] {
        display: none;
      }
      .spec-options.is-tabbed > [data-spec='option'][data-active] {
        display: block;
      }
      [data-spec='option'] {
        margin: 0 0 2rem;
      }
      /* The mock is a slide at desktop width: full column, at least 16:9, never clipped. */
      [data-spec='mock'] {
        position: relative;
        min-height: min(40rem, 56.25vw);
        border-radius: 1rem;
        border: 1px solid var(--border, GrayText);
        box-shadow:
          0 1px 2px color-mix(in oklch, var(--foreground, CanvasText) 6%, transparent),
          0 24px 48px -24px color-mix(in oklch, var(--foreground, CanvasText) 22%, transparent);
        background: var(--background, Canvas);
        overflow: visible;
      }
      /*
       * A Title-slide Option is a set: the Title slide's mock, then a strip of the section slides that echo its
       * Hero motif, one per Section, so the motif reads across the Episode at a glance.
       */
      .spec-echoes {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(18rem, 1fr));
        gap: 1rem;
        list-style: none;
        margin: 1rem 0 0;
        padding: 0;
      }
      .spec-echoes > li > p {
        font-size: 0.8125rem;
        font-weight: 600;
        color: var(--muted-foreground, GrayText);
        margin: 0 0 0.4rem;
      }
      .spec-echoes [data-spec='mock'] {
        min-height: 14rem;
      }
      [data-spec='option'] figcaption {
        font-size: 1rem;
        max-width: 60rem;
        margin: 1rem 0 0;
      }
      .spec-build {
        margin-top: 0.75rem;
        max-width: 60rem;
      }
      .spec-build > summary {
        cursor: pointer;
        font-size: 0.8125rem;
        font-weight: 600;
        color: var(--muted-foreground, GrayText);
      }
      [data-spec='build-notes'] {
        font-size: 0.8125rem;
        color: var(--muted-foreground, GrayText);
        margin-top: 0.5rem;
      }
      .spec-pick {
        display: inline-flex;
        gap: 0.5rem;
        align-items: center;
        margin-top: 1rem;
        padding: 0.55rem 1rem;
        border-radius: 0.6rem;
        border: 1.5px solid var(--primary, Highlight);
        color: var(--primary, Highlight);
        font-weight: 600;
        cursor: pointer;
      }
      .spec-pick:has(input:checked) {
        background: var(--primary, Highlight);
        color: var(--primary-foreground, HighlightText);
      }

      /*
       * A Slide's words as tabs: Visual idea, Voice script, Speaker notes, one panel open. Radio inputs in no form
       * switch them without script; print shows every panel.
       */
      .spec-words {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 1.5rem;
      }
      .spec-words > input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
      .spec-words > label {
        font-size: 0.875rem;
        font-weight: 600;
        padding: 0.45rem 0.9rem;
        border-radius: 999px;
        border: 1px solid var(--border, GrayText);
        background: var(--card, Canvas);
        cursor: pointer;
      }
      .spec-words > input:checked + label {
        background: var(--foreground, CanvasText);
        color: var(--background, Canvas);
        border-color: transparent;
      }
      .spec-words > input:focus-visible + label {
        outline: 2px solid var(--ring, Highlight);
        outline-offset: 2px;
      }
      .spec-panel {
        display: none;
        flex-basis: 100%;
        max-width: 60rem;
        box-sizing: border-box;
      }
      .spec-words:has(> input[value='visual-idea']:checked) > [data-panel='visual-idea'],
      .spec-words:has(> input[value='voice-script']:checked) > [data-panel='voice-script'],
      .spec-words:has(> input[value='speaker-notes']:checked) > [data-panel='speaker-notes'] {
        display: block;
      }
      .spec-panel > h4 {
        display: none;
      }
      .spec-words ol {
        margin: 0;
        padding-left: 1.25rem;
      }
      [data-spec='voice-script'] > li {
        margin-bottom: 0.75rem;
        font-size: 1.0625rem;
        line-height: 1.6;
      }
      [data-spec='speaker-notes'] > li {
        margin-bottom: 0.9rem;
        font-size: 0.9375rem;
      }
      [data-spec='speaker-notes'] ul {
        list-style: none;
        padding: 0;
        margin: 0.3rem 0 0;
        font-size: 0.8125rem;
        color: var(--muted-foreground, GrayText);
      }
      [data-spec='speaker-notes'] a {
        color: inherit;
        word-break: break-all;
      }
      .spec-note {
        display: block;
        box-sizing: border-box;
        width: 100%;
        min-height: 4.5rem;
        margin-top: 1.25rem;
        padding: 0.75rem 1rem;
        font: inherit;
        border-radius: 0.75rem;
        border: 1px dashed var(--border, GrayText);
        background: var(--card, Canvas);
        color: inherit;
      }
      .spec-pick {
        min-height: 2.75rem;
        box-sizing: border-box;
      }

      /* The device toolbar: every mock re-rendered at a preset's width; "Fit" is the full column. */
      .spec-toolbar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
        padding: 0.6rem 2rem;
        background: color-mix(in oklch, var(--card, Canvas) 92%, transparent);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--border, GrayText);
      }
      .spec-toolbar > span {
        font-size: 0.8125rem;
        font-weight: 600;
        color: var(--muted-foreground, GrayText);
      }
      .spec-toolbar button,
      .spec-scroll button {
        font: inherit;
        font-size: 0.875rem;
        font-weight: 600;
        min-height: 2.75rem;
        padding: 0.4rem 0.9rem;
        border-radius: 999px;
        border: 1px solid var(--border, GrayText);
        background: var(--card, Canvas);
        color: inherit;
        cursor: pointer;
      }
      .spec-toolbar button[aria-pressed='true'] {
        background: var(--foreground, CanvasText);
        color: var(--background, Canvas);
        border-color: transparent;
      }
      :root[data-preset] [data-spec='mock'] {
        width: min(100%, var(--preview-width));
      }
      :root[data-preset='shorts'] [data-spec='mock'] {
        aspect-ratio: 9 / 16;
      }
      :root[data-preset] .spec-echoes [data-spec='mock'] {
        width: auto;
      }
      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--ring, Highlight);
        outline-offset: 2px;
      }

      /* One circle at the bottom right: its upper half scrolls to the top, its lower half to the bottom. */
      .spec-scroll {
        position: fixed;
        right: 1rem;
        bottom: 1rem;
        z-index: 10;
        display: flex;
        flex-direction: column;
        border-radius: 1.75rem;
        overflow: hidden;
        border: 1px solid var(--border, GrayText);
        background: var(--card, Canvas);
      }
      .spec-scroll button {
        border: 0;
        border-radius: 0;
        min-width: 3.5rem;
      }

      /* The review: the Spec's general comment, the Next action and Save, at the end of the page. */
      .spec-review {
        display: grid;
        gap: 1rem;
        max-width: 60rem;
        margin: 5rem 0 0;
        padding: 1.5rem 1.75rem;
        background: var(--card, Canvas);
        border: 1px solid var(--border, GrayText);
        border-radius: 1rem;
      }
      .spec-review h2 {
        margin: 0;
        font-size: 1.25rem;
      }
      .spec-review textarea {
        display: block;
        box-sizing: border-box;
        width: 100%;
        margin-top: 0.4rem;
        padding: 0.75rem 1rem;
        font: inherit;
        border-radius: 0.75rem;
        border: 1px dashed var(--border, GrayText);
        background: var(--background, Canvas);
        color: inherit;
      }
      .spec-review fieldset {
        display: flex;
        gap: 1.5rem;
        border: 1px solid var(--border, GrayText);
        border-radius: 0.75rem;
      }
      .spec-review button[type='submit'] {
        justify-self: start;
        font: inherit;
        font-weight: 600;
        min-height: 2.75rem;
        padding: 0.5rem 1.25rem;
        border-radius: 0.6rem;
        border: 0;
        background: var(--primary, Highlight);
        color: var(--primary-foreground, HighlightText);
        cursor: pointer;
      }

      @media (max-width: 70rem) {
        .spec-shell {
          grid-template-columns: minmax(0, 1fr);
        }
        .spec-outline {
          display: none;
        }
      }

      @media print {
        .spec-words > input,
        .spec-words > label,
        .spec-tabs {
          display: none;
        }
        .spec-panel,
        .spec-panel > h4,
        .spec-options.is-tabbed > [data-spec='option'] {
          display: block;
        }
      }

      @layer fallback {
        [data-spec='mock'] {
          background: Canvas;
        }
      }
    </style>
    <link rel="stylesheet" href="design.css" />
    <script type="application/json" id="spec-meta" data-slot="meta">
      {}
    </script>
    <script>
      // Option tabs and the outline's pick state. Runs after the page parses; the review form's own script sits
      // at the end of the body. Without this script every Option shows, stacked.
      addEventListener('DOMContentLoaded', () => {
        const outline = document.querySelector('.spec-outline');
        const refresh = () => {
          for (const slide of document.querySelectorAll('[data-spec="slide"], [data-spec="title-slide"]')) {
            const picks = slide.querySelectorAll('.spec-pick input:checked').length;
            const link = outline?.querySelector(`a[href="#${slide.id}"]`);
            if (link) link.dataset.state = picks === 1 ? 'picked' : 'open';
            for (const button of slide.querySelectorAll('.spec-tabs button')) {
              const box = slide.querySelector(`.spec-pick input[value="${button.dataset.option}"]`);
              button.querySelector('.spec-picked').textContent = box?.checked ? '✓' : '';
            }
          }
        };
        for (const options of document.querySelectorAll('.spec-options')) {
          const figures = [...options.querySelectorAll(':scope > [data-spec="option"]')];
          const tabs = document.createElement('div');
          tabs.className = 'spec-tabs';
          tabs.setAttribute('role', 'tablist');
          const show = (figure) => {
            for (const other of figures) other.toggleAttribute('data-active', other === figure);
            for (const button of tabs.children)
              button.setAttribute('aria-selected', String(button.dataset.option === figure.dataset.option));
          };
          for (const figure of figures) {
            const button = document.createElement('button');
            button.type = 'button';
            button.setAttribute('role', 'tab');
            button.dataset.option = figure.dataset.option;
            button.innerHTML = `Option ${figure.dataset.option}<span class="spec-picked"></span>`;
            if (figure.hasAttribute('data-recommended')) {
              const badge = document.createElement('span');
              badge.className = 'spec-badge';
              badge.textContent = 'Recommended';
              button.append(badge);
            }
            button.addEventListener('click', () => show(figure));
            tabs.append(button);
          }
          options.before(tabs);
          options.classList.add('is-tabbed');
          show(
            figures.find((f) => f.querySelector('.spec-pick input:checked')) ??
              figures.find((f) => f.hasAttribute('data-recommended')) ??
              figures[0],
          );
        }
        document.addEventListener('change', refresh);
        refresh();
      });
    </script>
  </head>
  <body>
    <div class="spec-toolbar" role="toolbar" aria-label="Preview size">
      <span>Preview</span>
      <button type="button" data-preset="fit" aria-pressed="true">Fit</button>
      <button type="button" data-preset="desktop" data-width="1920" aria-pressed="false">Desktop 1920</button>
      <button type="button" data-preset="laptop" data-width="1440" aria-pressed="false">Laptop 1440</button>
      <button type="button" data-preset="tablet" data-width="1024" aria-pressed="false">Tablet 1024</button>
      <button type="button" data-preset="mobile" data-width="390" aria-pressed="false">Mobile 390</button>
      <button type="button" data-preset="shorts" data-width="1080" aria-pressed="false">Shorts 1080 × 1920</button>
    </div>
    <div class="spec-shell">
      <nav class="spec-outline" aria-label="Slides" data-slot="outline"></nav>
      <main class="spec-page">
        <header class="spec-masthead">
          <p class="spec-kicker" data-slot="kicker"></p>
          <h1 data-slot="heading"></h1>
          <p data-slot="lede"></p>
        </header>
        <div class="spec-intro" data-slot="intro"></div>
        <div data-slot="items"></div>
        <!-- The review form. Every pick checkbox and note joins it by form="spec-review"; npm run episode:spec serves the page and saves the review as the next feedback round. -->
        <form id="spec-review" class="spec-review" method="post">
          <h2>Review</h2>
          <p>
            Tick the Options you want under each Slide and dictate a note per Slide. A Slide with no tick needs a note.
          </p>
          <label>General comment <textarea name="note:page" rows="3"></textarea></label>
          <fieldset data-next-action>
            <legend>Next action</legend>
            <label><input type="radio" name="next" value="redesign" checked /> Redesign</label>
            <label><input type="radio" name="next" value="approve" /> Approve</label>
          </fieldset>
          <output name="status" aria-live="polite"></output>
          <button type="submit">Save review</button>
        </form>
      </main>
    </div>
    <div class="spec-scroll" role="group" aria-label="Scroll">
      <button type="button" data-scroll="top" aria-label="Scroll to the top">↑ Top</button>
      <button type="button" data-scroll="bottom" aria-label="Scroll to the bottom">↓ End</button>
    </div>

    <template data-template="item">
      <article data-spec="slide" data-fidelity="mock" data-depth="simple">
        <header class="spec-slide-head">
          <span class="spec-number" data-slot="number"></span>
          <h3 data-slot="title"></h3>
        </header>
        <p class="spec-purpose" data-slot="purpose"></p>
        <div data-slot="words"></div>
        <div class="spec-options" data-slot="options"></div>
        <textarea class="spec-note" form="spec-review" data-slot="note"></textarea>
      </article>
    </template>
    <template data-template="option">
      <figure data-spec="option" data-option data-recommended>
        <div data-slot="stage"></div>
        <figcaption data-slot="caption"></figcaption>
        <details class="spec-build">
          <summary>Build notes</summary>
          <div data-slot="build-notes"></div>
        </details>
        <label class="spec-pick"
          ><input type="checkbox" form="spec-review" data-slot="pick" /> Pick <b data-slot="id"></b
        ></label>
      </figure>
    </template>

    <script>
      (() => {
        // Preview presets: every mock takes the preset's width, "Fit" gives the full column back.
        const root = document.documentElement;
        for (const button of document.querySelectorAll('.spec-toolbar [data-preset]')) {
          button.addEventListener('click', () => {
            const { preset, width } = button.dataset;
            if (width) root.style.setProperty('--preview-width', width + 'px');
            else root.style.removeProperty('--preview-width');
            if (width) root.dataset.preset = preset;
            else delete root.dataset.preset;
            for (const other of document.querySelectorAll('.spec-toolbar [data-preset]'))
              other.setAttribute('aria-pressed', String(other === button));
          });
        }
        // Scroll to either end, without motion when the reader asks for none.
        for (const button of document.querySelectorAll('[data-scroll]')) {
          button.addEventListener('click', () => {
            const top = button.dataset.scroll === 'top' ? 0 : document.documentElement.scrollHeight;
            const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
            scrollTo({ top, behavior: calm ? 'auto' : 'smooth' });
          });
        }
      })();
    </script>
    <script>
      (() => {
        // A Slide with no tick needs a note, and Approve needs a tick on every Slide; both survive a reload until a save succeeds.
        const form = document.getElementById('spec-review');
        const meta = JSON.parse(document.getElementById('spec-meta')?.textContent || '{}');
        const key = 'spec-review:' + (meta.title || location.pathname);
        const fields = [...form.elements].filter((field) => /^(pick:|note:|next$)/.test(field.name));
        const isBox = (field) => field.type === 'checkbox' || field.type === 'radio';
        const id = (field) => (isBox(field) ? field.name + '=' + field.value : field.name);
        const ticked = (slug) => fields.some((field) => field.name === 'pick:' + slug && field.checked);
        const sync = () => {
          for (const note of fields.filter((field) => field.name.startsWith('note:'))) {
            const slug = note.name.slice('note:'.length);
            note.required = slug !== 'visual-language' && slug !== 'page' && !ticked(slug);
          }
        };
        const store = () => {
          const draft = fields.map((field) => [id(field), isBox(field) ? field.checked : field.value]);
          localStorage.setItem(key, JSON.stringify(Object.fromEntries(draft)));
        };
        const saved = new URLSearchParams(location.search).get('saved');
        if (saved) {
          localStorage.removeItem(key);
          form.elements.status.value = 'Saved as feedback/' + saved + '/feedback.md.';
          history.replaceState(null, '', location.pathname);
        } else {
          const draft = JSON.parse(localStorage.getItem(key) || '{}');
          for (const field of fields.filter((candidate) => id(candidate) in draft))
            if (isBox(field)) field.checked = draft[id(field)];
            else field.value = draft[id(field)];
        }
        // Approve is refused while a Slide has no tick; the server refuses it too.
        form.addEventListener('submit', (event) => {
          if (!fields.some((field) => field.name === 'next' && field.value === 'approve' && field.checked)) return;
          const slugs = [
            ...new Set(fields.filter((field) => field.name.startsWith('pick:')).map((field) => field.name.slice(5))),
          ];
          const open = slugs.filter((slug) => !ticked(slug));
          if (open.length === 0) return;
          event.preventDefault();
          form.elements.status.value = 'Approve needs a pick on every Slide: ' + open.join(', ') + '.';
        });
        sync();
        for (const field of fields)
          for (const type of ['input', 'change']) field.addEventListener(type, () => (sync(), store()));
      })();
    </script>
  </body>
</html>
