<!--
  The toolbar of a decision page: copy these three blocks into the page, never write your own.
    1. toolbar:head, inside <head>: the styles and the script that sets theme and navigation before first paint.
    2. toolbar:markup, first in <body>: the bar and its presets.
    3. toolbar:script, last in <body>: the behaviour.
  Supply the presets as JSON in the markup block; every other part stays as it is. The page gives its navigation
  `data-page-nav` and the id the Outline button names in `aria-controls`. The readout reports the width of the first
  shown element matching `data-measure` (default `[data-visual]`): name the box the presets resize. Add a tool inside
  `[data-toolbar-end]`, never a second row.
  The bar is one row at every width: below 1024 px it scrolls sideways inside itself and never wraps.
-->

<!-- toolbar:head -->
<style data-toolbar-style>
  :root {
    --toolbar-h: 3.75rem;
  }
  .dh-toolbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    flex-wrap: nowrap;
    align-items: center;
    gap: 0.5rem;
    box-sizing: border-box;
    min-height: 3.75rem;
    padding: 0.5rem var(--gutter, 2rem);
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: thin;
    background: color-mix(in oklch, var(--card, Canvas) 94%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border, GrayText);
  }
  .dh-toolbar > * {
    flex: none;
  }
  .dh-tool,
  .dh-seg button {
    font: inherit;
    font-size: 0.8125rem;
    font-weight: 600;
    min-height: 2.75rem;
    padding: 0.3rem 0.85rem;
    border-radius: 999px;
    border: 1px solid var(--border, GrayText);
    background: var(--card, Canvas);
    color: inherit;
    cursor: pointer;
    white-space: nowrap;
  }
  .dh-tool[aria-expanded='true'] {
    background: var(--foreground, CanvasText);
    color: var(--background, Canvas);
    border-color: transparent;
  }
  /* One segmented bar, one selection: the selected segment is filled. */
  .dh-seg {
    display: inline-flex;
    border: 1px solid var(--border, GrayText);
    border-radius: 999px;
    background: var(--card, Canvas);
  }
  .dh-seg button {
    border: 0;
    background: transparent;
  }
  .dh-seg button[aria-checked='true'] {
    background: var(--foreground, CanvasText);
    color: var(--background, Canvas);
  }
  .dh-size {
    font-size: 0.8125rem;
    color: var(--muted-foreground, GrayText);
    white-space: nowrap;
  }
  .dh-size[hidden] {
    display: none;
  }
  /* The slot for more tools, and the theme switch, sit at the end of the row. */
  .dh-toolbar-end {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-left: auto;
  }
  .dh-toolbar button:focus-visible {
    outline: 2px solid var(--ring, Highlight);
    outline-offset: 2px;
  }
  /* The navigation is a dropdown: hidden when closed, floating under the toolbar below 1800 px when open. */
  html[data-nav='closed'] [data-page-nav] {
    display: none;
  }
  @media (max-width: 112.49rem) {
    html[data-nav='open'] [data-page-nav] {
      display: block;
      position: fixed;
      z-index: 15;
      top: var(--toolbar-h);
      bottom: 0;
      left: 0;
      width: 17rem;
      max-height: none;
      overflow-y: auto;
      box-sizing: border-box;
      padding: 1rem;
      background: var(--card, Canvas);
      border-right: 1px solid var(--border, GrayText);
      box-shadow: 0 0 2rem color-mix(in oklch, var(--foreground, CanvasText) 25%, transparent);
    }
  }
  @media print {
    .dh-toolbar {
      display: none;
    }
  }
</style>
<script>
  // The theme and the navigation, applied before first paint. Storage may be blocked: every call is guarded.
  (() => {
    const root = document.documentElement;
    const read = (key) => {
      try {
        return localStorage.getItem(key);
      } catch {
        return null;
      }
    };
    const media = matchMedia('(prefers-color-scheme: dark)');
    const apply = () => {
      const choice = read('decision-page-theme') || 'auto';
      root.classList.toggle('dark', choice === 'dark' || (choice === 'auto' && media.matches));
      root.dataset.theme = choice;
    };
    apply();
    media.addEventListener('change', apply);
    // Open on a wide screen, collapsed below 1800 px, where the content wants every pixel.
    root.dataset.nav = innerWidth >= 1800 ? 'open' : 'closed';
  })();
</script>

<!-- toolbar:markup -->
<div class="dh-toolbar" role="toolbar" aria-label="Page tools" data-toolbar>
  <button type="button" class="dh-tool" data-nav-toggle aria-controls="page-nav" aria-expanded="false">Outline</button>
  <div class="dh-seg" role="radiogroup" aria-label="Preview size" data-presets></div>
  <output class="dh-size" data-preview-size data-measure="[data-visual]" aria-live="polite"></output>
  <div class="dh-toolbar-end" data-toolbar-end></div>
  <button type="button" class="dh-tool" data-theme-toggle>Theme: Auto</button>
</div>
<!-- A preset is a label, a width in px and, for a vertical one, a height; one without a width is the full column. -->
<script type="application/json" data-toolbar-presets>
  [
    { "id": "fit", "label": "Fit", "title": "Fit, the full column" },
    { "id": "desktop", "label": "Desktop", "width": 1920 },
    { "id": "laptop", "label": "Laptop", "width": 1440 },
    { "id": "tablet", "label": "Tablet", "width": 1024 },
    { "id": "mobile", "label": "Mobile", "width": 390 },
    { "id": "shorts", "label": "Shorts", "width": 1080, "height": 1920 }
  ]
</script>

<!-- toolbar:script -->
<script>
  (() => {
    const root = document.documentElement;
    const bar = document.querySelector('[data-toolbar]');
    const write = (key, value) => {
      try {
        localStorage.setItem(key, value);
      } catch {
        // Without storage the choice lasts until the page closes.
      }
    };
    const size = bar.querySelector('[data-preview-size]');

    // The size the previews take now, shown only while it fits on the row.
    const fit = () => {
      size.hidden = false;
      if (bar.scrollWidth > bar.clientWidth) size.hidden = true;
    };
    const report = () => {
      const target = [...document.querySelectorAll(size.dataset.measure || '[data-visual]')].find(
        (candidate) => candidate.offsetParent !== null,
      );
      size.value = target ? 'Showing ' + Math.round(target.getBoundingClientRect().width) + ' px wide' : '';
      fit();
    };

    // The sticky parts of the page sit below the toolbar, whose height is --toolbar-h.
    const measure = () => root.style.setProperty('--toolbar-h', bar.offsetHeight + 'px');
    if (typeof ResizeObserver === 'function') new ResizeObserver(measure).observe(bar);
    measure();
    addEventListener('resize', report);

    // The presets: one segmented bar, one selection. A preset with a width sets --preview-width and data-preset on <html>.
    const presets = JSON.parse(document.querySelector('script[data-toolbar-presets]')?.textContent || '[]');
    const sizeOf = ({ width, height }) => (height ? width + ' × ' + height + ' px' : width + ' px');
    const group = bar.querySelector('[data-presets]');
    const segments = presets.map((preset) => {
      const name = preset.title || preset.label + ', ' + sizeOf(preset);
      const segment = document.createElement('button');
      segment.type = 'button';
      segment.dataset.preset = preset.id;
      segment.setAttribute('role', 'radio');
      segment.setAttribute('aria-label', name);
      segment.title = name;
      segment.textContent = preset.label;
      group.append(segment);
      return segment;
    });
    const choose = (at, focus) => {
      const preset = presets[at];
      if (preset.width) {
        root.style.setProperty('--preview-width', preset.width + 'px');
        root.dataset.preset = preset.id;
      } else {
        root.style.removeProperty('--preview-width');
        delete root.dataset.preset;
      }
      segments.forEach((segment, other) => {
        segment.setAttribute('aria-checked', String(other === at));
        segment.tabIndex = other === at ? 0 : -1;
      });
      if (focus) segments[at].focus();
      report();
    };
    segments.forEach((segment, at) => {
      segment.addEventListener('click', () => choose(at, false));
      segment.addEventListener('keydown', (event) => {
        const step = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[event.key];
        const to = event.key === 'Home' ? 0 : event.key === 'End' ? segments.length - 1 : undefined;
        if (step === undefined && to === undefined) return;
        event.preventDefault();
        choose(to ?? (at + step + segments.length) % segments.length, true);
      });
    });
    const start = Math.max(
      0,
      presets.findIndex((preset) => !preset.width),
    );
    segments.forEach((segment, at) => {
      segment.setAttribute('aria-checked', String(at === start));
      segment.tabIndex = at === start ? 0 : -1;
    });

    // The navigation: open in the page's grid on a wide screen, a dropdown under the toolbar below 1800 px.
    const toggle = bar.querySelector('[data-nav-toggle]');
    const panel = document.getElementById(toggle.getAttribute('aria-controls'));
    const sync = () => toggle.setAttribute('aria-expanded', String(root.dataset.nav === 'open'));
    const close = () => {
      root.dataset.nav = 'closed';
      sync();
      report();
    };
    toggle.addEventListener('click', () => {
      root.dataset.nav = root.dataset.nav === 'open' ? 'closed' : 'open';
      sync();
      report();
    });
    panel?.addEventListener('click', (event) => {
      if (event.target.closest('a') && innerWidth < 1800) close();
    });
    addEventListener('keydown', (event) => {
      if (event.key !== 'Escape' || root.dataset.nav !== 'open' || innerWidth >= 1800) return;
      close();
      toggle.focus();
    });
    sync();

    // The theme: follow the system, or force light or dark.
    const theme = bar.querySelector('[data-theme-toggle]');
    const choices = ['auto', 'light', 'dark'];
    const label = () =>
      (theme.textContent = 'Theme: ' + (root.dataset.theme[0].toUpperCase() + root.dataset.theme.slice(1)));
    theme.addEventListener('click', () => {
      const next = choices[(choices.indexOf(root.dataset.theme) + 1) % choices.length];
      write('decision-page-theme', next);
      root.dataset.theme = next;
      root.classList.toggle(
        'dark',
        next === 'dark' || (next === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches),
      );
      label();
    });
    label();

    addEventListener('DOMContentLoaded', report);
    addEventListener('load', report);
  })();
</script>
