name: Deploy redirect stubs to GitHub Pages

# TEMPORARY. The site now lives on Cloudflare Pages (deploy-cloudflare.yml). GitHub Pages cannot send a 301, so the
# old https://hancrafted.github.io/content-library/ URLs publish only redirect stubs: one HTML per exported page with
# a meta refresh and a canonical to the same path on https://hancrafted.net. Remove this workflow, and switch Pages
# off in the repository settings, after a few months. See docs/features/hosting.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel one mid-flight, or Pages can be left half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      # Built only for its page list: the stubs mirror the exported paths, under the old project-site base path.
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: https://hancrafted.net
      - run: node scripts/redirect-stubs.ts out stubs https://hancrafted.net
      # The Pages artifact is served under the project-site base path, so the stubs sit at its root.
      - run: touch stubs/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./stubs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
