name: Deploy to Cloudflare Pages

# Production: every push to main publishes out/ to https://hancrafted.net. Pull-request previews are built and
# deployed by ci.yml. The build runs here, not in Cloudflare's Git build, so Cloudflare's build limits never apply. One-time setup (project, domain, www redirect): docs/features/hosting.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # FE-008: the production origin, for canonicals, hreflang and the sitemap. A place to change on a domain move:
  # docs/features/hosting.md.
  SITE_URL: https://hancrafted.net

# A production deploy is never cancelled mid-flight.
concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  build:
    name: build, post-build tests
    runs-on: ubuntu-latest
    env:
      # Served from the domain root: no base path.
      NEXT_PUBLIC_BASE_PATH: ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build static export
        run: npm run build
      # FE-005: refuse to publish an export missing a page the app derives.
      # FE-008: refuse one whose canonicals miss this URL or whose alternates are one-way.
      - name: Post-build tests
        run: npm run test:build
      - name: Upload export
        uses: actions/upload-artifact@v7.0.2
        with:
          name: out
          path: out/
          include-hidden-files: true
          retention-days: 1

  # A job of its own, so the run graph shows the deploy and the environment links to the deployed URL.
  deploy:
    name: deploy to Cloudflare Pages (production)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://hancrafted.net
    steps:
      - name: Download export
        uses: actions/download-artifact@v8.0.2
        with:
          name: out
          path: out/
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.151.3'
          command: pages deploy out --project-name=hancrafted --branch=main
