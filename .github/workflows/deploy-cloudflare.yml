name: Deploy to Cloudflare Pages

# Production: each CI run that succeeds on main publishes the `out/` that run built and tested to
# https://hancrafted.net, so nothing CI has not passed reaches production and nothing is built twice. This workflow
# only publishes: no checkout, no `npm ci`, no build. Previews are deployed by ci.yml. CI keeps main's `out/` for 30
# days, so redeploying an older run is the rollback (docs/features/ci.md). One-time setup (project, domain, www redirect):
# docs/features/hosting.md.
on:
  # GitHub runs this trigger from the workflow file on main, whatever branch CI ran on; the branch filter and the job
  # `if` below keep it to a successful CI run on main.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run-id:
        description: 'CI run on main whose export to publish; empty for the newest successful one (a rollback names an older run)'
        required: false
        type: string

permissions:
  contents: read
  # Reads the artifact of the CI run, which is another run of another workflow.
  actions: read

# A production deploy is never cancelled mid-flight.
concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  # A job of its own, so the run graph shows the deploy and the environment links to the deployed URL. Production
  # deploys only after a CI run that succeeded; a failed or cancelled one deploys nothing.
  deploy:
    name: deploy to Cloudflare Pages (production)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://hancrafted.net
    steps:
      # The run to publish: the CI run that triggered this, or the one a person named, or the newest successful CI run
      # on main. A named run must be a successful CI run on main, so a preview-shape export never reaches production.
      - name: Pick CI run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run-id }}
        run: |
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list --repo "$REPO" --workflow ci.yml --branch main --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          [ -n "$RUN_ID" ] || { echo "No successful CI run on main to publish." >&2; exit 1; }
          read -r name branch conclusion < <(gh run view "$RUN_ID" --repo "$REPO" --json workflowName,headBranch,conclusion --jq '[.workflowName, .headBranch, .conclusion] | @tsv')
          if [ "$name" != CI ] || [ "$branch" != main ] || [ "$conclusion" != success ]; then
            echo "Run $RUN_ID is $name on $branch ($conclusion), not a successful CI run on main." >&2
            exit 1
          fi
          echo "id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Download export
        uses: actions/download-artifact@v8.0.2
        with:
          name: out
          path: out/
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.151.3'
          command: pages deploy out --project-name=hancrafted --branch=main
