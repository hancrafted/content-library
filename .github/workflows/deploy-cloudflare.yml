name: Deploy to Cloudflare Pages

# Production: every push to main publishes out/ to https://hancrafted.net. Preview: every same-repo pull request
# gets its own *.hancrafted.pages.dev URL. The build runs here, not in Cloudflare's Git build, so Cloudflare's build
# limits never apply. One-time setup (project, domain, www redirect): docs/features/hosting.md.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # FE-008: the production origin, for canonicals, hreflang and the sitemap. A place to change on a domain move:
  # docs/features/hosting.md.
  SITE_URL: https://hancrafted.net

# A newer push to a pull request supersedes its preview; a production deploy is never cancelled mid-flight.
concurrency:
  group: cloudflare-pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build, post-build tests
    runs-on: ubuntu-latest
    # A fork's or Dependabot's pull request has no access to the Cloudflare secrets, so it gets CI but no preview.
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    env:
      # Served from the domain root: no base path.
      NEXT_PUBLIC_BASE_PATH: ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build static export
        run: npm run build
      # FE-005: refuse to publish an export missing a page the app derives.
      # FE-008: refuse one whose canonicals miss this URL or whose alternates are one-way.
      - name: Post-build tests
        run: npm run test:build
      - name: Upload export
        uses: actions/upload-artifact@v7.0.2
        with:
          name: out
          path: out/
          include-hidden-files: true
          retention-days: 1

  # A job of its own, so the run graph shows the deploy and the environment links to the deployed URL.
  deploy:
    name: deploy to Cloudflare Pages (${{ github.event_name == 'pull_request' && 'preview' || 'production' }})
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ github.event_name == 'pull_request' && steps.deploy.outputs.pages-deployment-alias-url || 'https://hancrafted.net' }}
    steps:
      - name: Download export
        uses: actions/download-artifact@v8.0.2
        with:
          name: out
          path: out/
      # Pull requests deploy to a preview branch named after the head ref; main is the production branch.
      - name: Pick Pages branch
        id: branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "name=$(printf '%s' "$HEAD_REF" | tr -c 'A-Za-z0-9-' '-')" >> "$GITHUB_OUTPUT"
          else
            echo "name=main" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.151.3'
          command: pages deploy out --project-name=hancrafted --branch=${{ steps.branch.outputs.name }}
