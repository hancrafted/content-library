name: CI

# Lint, typecheck, a full static build and the post-build export test on every pull request, so a change
# that would break the Pages deploy fails before it merges.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # FE-005: every page URL the app derives landed in out/. Needs the build above.
      - run: npm run test:build
