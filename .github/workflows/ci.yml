name: CI

# Lint, typecheck, the fast suite, a full static build and the post-build export test on every pull request, so a
# change that would break the Cloudflare Pages deploy fails before it merges. Independent jobs run in parallel: each pays
# for its own `npm ci`, and the run takes as long as the slowest lane instead of the sum of all steps. A pull request
# that changes an export input also gets a preview, deployed from the `export` build while `build-test` still runs.
on:
  pull_request:

permissions:
  contents: read

env:
  # The production origin (FE-008). One of the places to change on a domain move: docs/features/hosting.md.
  SITE_URL: https://hancrafted.net

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: preflight, archgate, lint, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: `archgate:full` diffs from the root commit.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The `archgate` npm package is a launcher: its first call downloads a ~67 MB binary into ~/.archgate/bin.
      # Keyed on the launcher's version, so a bump fetches the matching binary once.
      - uses: actions/cache@v6
        with:
          path: ~/.archgate/bin
          key: archgate-${{ runner.os }}-${{ hashFiles('node_modules/archgate/package.json') }}
      - run: npm run preflight
      - run: npm run archgate:full
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run knip
      # The new-episode sample sits under a dot-folder, which the default corpus never walks.
      - run: npm run check:docs

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: tests/docs/episode-staging.test.ts reads this repo's own `git log`.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  # The one build of a pull request's export, in the preview shape. `changed` says whether the pull request touched an
  # export input (EXPORT_PATHS in tools/verify/needs-build.pure.ts), which is what gates `preview`.
  export:
    name: build
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changed.outputs.changed }}
    env:
      # Build as the Cloudflare Pages deploy does, from the domain root, so a base-path bug fails here, not at deploy.
      NEXT_PUBLIC_BASE_PATH: ''
      # The preview lists and links Upcoming Episodes on /episodes, so a draft can be reviewed there; production never does.
      LIST_UPCOMING_EPISODES: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the merge-base with the PR base decides `changed`.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Detect export inputs
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base=$(git merge-base "origin/$BASE_REF" HEAD)
          if git diff --name-only "$base" HEAD | npm run -s verify:needs-build; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - run: npm run build
      - name: Upload export
        uses: actions/upload-artifact@v7.0.2
        with:
          name: out
          path: out/
          include-hidden-files: true
          retention-days: 1

  # The post-build suite (FE-005: every page URL the app derives landed in out/), on the `export` build, beside `preview`.
  # A failure turns the pull request red even though the preview deployed; a preview link goes to a client only once the
  # PR is green. It reads the same env the build used (base path, SITE_URL, upcoming listing).
  build-test:
    name: post-build tests
    needs: export
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: ''
      LIST_UPCOMING_EPISODES: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download export
        uses: actions/download-artifact@v8.0.2
        with:
          name: out
          path: out/
      - run: npm run test:build

  # A job of its own, so the run graph shows the deploy and the environment links to the deployed URL. A fork's or
  # Dependabot's pull request has no access to the Cloudflare secrets, so it gets the build and tests but no preview.
  preview:
    name: deploy to Cloudflare Pages (preview)
    needs: export
    if: needs.export.outputs.changed == 'true' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
    steps:
      - name: Download export
        uses: actions/download-artifact@v8.0.2
        with:
          name: out
          path: out/
      # The preview branch is named after the head ref.
      - name: Pick Pages branch
        id: branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: echo "name=$(printf '%s' "$HEAD_REF" | tr -c 'A-Za-z0-9-' '-')" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.151.3'
          command: pages deploy out --project-name=hancrafted --branch=${{ steps.branch.outputs.name }}
