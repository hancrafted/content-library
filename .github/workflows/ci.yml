name: CI

# Lint, typecheck, the fast suite, a full static build and the post-build export test on every pull request and every
# pushed branch, so a change that would break the Cloudflare Pages deploy fails before it merges, and a branch pushed
# without a PR is still checked. Three independent jobs run in parallel: each pays for its own `npm ci`, and the run
# takes as long as the slowest lane instead of the sum of all steps.
# A push to a branch with an open PR fires both push and pull_request; the concurrency group below keys on the branch
# name for both, so the later run cancels the earlier one and one run per branch survives.
on:
  pull_request:
  push:
    # Every branch, no tags: `push` with no filter also fires on tags.
    branches: ['**']

permissions:
  contents: read

env:
  # The production origin (FE-008). One of the places to change on a domain move: docs/features/hosting.md.
  SITE_URL: https://hancrafted.net

# A newer run on the same branch cancels the older one. `head_ref` is the PR's branch on pull_request and empty on
# push, where `ref_name` is the branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  static:
    name: preflight, archgate, lint, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: `archgate:full` diffs from the root commit.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The `archgate` npm package is a launcher: its first call downloads a ~67 MB binary into ~/.archgate/bin.
      # Keyed on the launcher's version, so a bump fetches the matching binary once.
      - uses: actions/cache@v6
        with:
          path: ~/.archgate/bin
          key: archgate-${{ runner.os }}-${{ hashFiles('node_modules/archgate/package.json') }}
      - run: npm run preflight
      - run: npm run archgate:full
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run knip
      # The new-episode sample sits under a dot-folder, which the default corpus never walks.
      - run: npm run check:docs

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: each Run's docs/episodes/<slug>/run-checks.test.ts reads this repo's own `git log`.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The JSON report feeds the budget below; naming reporters drops the config's local slow-test log.
      - run: npm test -- --reporter=default --reporter=json --outputFile.json=fast-suite.json
      # ARCH-003-testing §4.4: a fast-suite test over 3 s fails the job. The nightly 2 s budget warns first.
      - name: Fail on fast-suite tests over 3 s
        run: |
          over=$(node tools/test-budget/over-budget.ts fast-suite.json 3000)
          [ -z "$over" ] && exit 0
          printf 'Fast-suite tests over 3 s: make each faster or move it to *.slow.test.ts (ARCH-003-testing §4.4).\n%s\n' "$over"
          exit 1

  export:
    name: build, post-build tests
    runs-on: ubuntu-latest
    env:
      # Build as the Cloudflare Pages deploy does, from the domain root, so a base-path bug fails here, not at deploy.
      NEXT_PUBLIC_BASE_PATH: ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # FE-005: every page URL the app derives landed in out/. Needs the build above.
      - run: npm run test:build
