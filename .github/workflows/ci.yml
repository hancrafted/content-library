name: CI

# Lint, typecheck, the fast suite, a full static build and the post-build export test on every pushed branch, so a
# change that would break the Cloudflare Pages deploy fails before it merges. The lanes run in parallel: each pays for
# its own `npm ci`, and the run takes as long as the slowest lane instead of the sum of all steps. The build happens
# once per commit, here: a pushed branch that changes an export input gets a preview deployed from it while the
# post-build suite still runs, and a run on main uploads the production-shape `out/` that deploy-cloudflare.yml publishes.
# Push only: a PR shows the push run on its head commit as its checks. Adding pull_request would start a second run
# per push, and cancelling one of the pair leaves a cancelled run the PR counts as failed. No fork PRs here.
on:
  push:
    # Every branch, no tags: `push` with no filter also fires on tags.
    branches: ['**']

permissions:
  contents: read

env:
  # The production origin (FE-008). One of the places to change on a domain move: docs/features/hosting.md.
  SITE_URL: https://hancrafted.net

# A newer push to the same branch cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: preflight, archgate, lint, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: `archgate:full` diffs from the root commit.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The `archgate` npm package is a launcher: its first call downloads a ~67 MB binary into ~/.archgate/bin.
      # Keyed on the launcher's version, so a bump fetches the matching binary once.
      - uses: actions/cache@v6
        with:
          path: ~/.archgate/bin
          key: archgate-${{ runner.os }}-${{ hashFiles('node_modules/archgate/package.json') }}
      - run: npm run preflight
      - run: npm run archgate:full
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run knip
      # The new-episode sample sits under a dot-folder, which the default corpus never walks.
      - run: npm run check:docs

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: each Run's docs/episodes/<slug>/run-checks.test.ts reads this repo's own `git log`.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The JSON report feeds the budget below; naming reporters drops the config's local slow-test log.
      - run: npm test -- --reporter=default --reporter=json --outputFile.json=fast-suite.json
      # ARCH-003-testing §4.4: a fast-suite test over 3 s fails the job. The nightly 2 s budget warns first.
      - name: Fail on fast-suite tests over 3 s
        run: |
          over=$(node tools/test-budget/over-budget.ts fast-suite.json 3000)
          [ -z "$over" ] && exit 0
          printf 'Fast-suite tests over 3 s: make each faster or move it to *.slow.test.ts (ARCH-003-testing §4.4).\n%s\n' "$over"
          exit 1

  # The one build per commit, in the shape its ref ships: production on main (no Upcoming Episodes), preview everywhere
  # else. `changed` says whether the branch touched an export input against main (EXPORT_PATHS in
  # tools/verify/needs-build.pure.ts), which is what gates `preview`.
  export:
    name: build
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changed.outputs.changed }}
    env:
      # Build as the Cloudflare Pages deploy does, from the domain root, so a base-path bug fails here, not at deploy.
      NEXT_PUBLIC_BASE_PATH: ''
      # A preview lists and links Upcoming Episodes on /episodes, so a draft can be reviewed there; production never does.
      LIST_UPCOMING_EPISODES: ${{ github.ref == 'refs/heads/main' && '' || 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the merge-base with main decides `changed`.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Detect export inputs
        id: changed
        run: |
          base=$(git merge-base origin/main HEAD)
          if git diff --name-only "$base" HEAD | npm run -s verify:needs-build; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - run: npm run build
      # Main's export is what production publishes and what a rollback redeploys, so it is kept for 30 days.
      - name: Upload export
        uses: actions/upload-artifact@v7.0.2
        with:
          name: out
          path: out/
          include-hidden-files: true
          retention-days: ${{ github.ref == 'refs/heads/main' && 30 || 1 }}

  # The post-build suite (FE-005: every page URL the app derives landed in out/), on the `export` build, beside `preview`.
  # A failure turns the run red even though the preview deployed; a preview link goes to a client only once the
  # branch is green. It reads the same env the build used (base path, SITE_URL, upcoming listing).
  build-test:
    name: post-build tests
    needs: export
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: ''
      LIST_UPCOMING_EPISODES: ${{ github.ref == 'refs/heads/main' && '' || 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download export
        uses: actions/download-artifact@v8.0.2
        with:
          name: out
          path: out/
      - run: npm run test:build

  # The check main's ruleset requires, `build, post-build tests`. `always()` runs it after a failed or skipped need, and
  # it fails unless both succeeded, so a skipped job can never stand in for a pass.
  gate:
    name: build, post-build tests
    needs: [export, build-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require build and post-build tests to have succeeded
        env:
          BUILD: ${{ needs.export.result }}
          POST_BUILD: ${{ needs.build-test.result }}
        run: |
          echo "build: $BUILD, post-build tests: $POST_BUILD"
          [ "$BUILD" = success ] && [ "$POST_BUILD" = success ]

  # A job of its own, so the run graph shows the deploy and the environment links to the deployed URL. Main is never
  # previewed (deploy-cloudflare.yml publishes it). A fork's or Dependabot's push has no access to the Cloudflare
  # secrets, so it gets the build and tests but no preview.
  preview:
    name: deploy to Cloudflare Pages (preview)
    needs: export
    if: needs.export.outputs.changed == 'true' && github.ref != 'refs/heads/main' && (github.event.pull_request.head.repo.full_name || github.repository) == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
    steps:
      - name: Download export
        uses: actions/download-artifact@v8.0.2
        with:
          name: out
          path: out/
      # The preview branch is named after the pushed branch.
      - name: Pick Pages branch
        id: branch
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: echo "name=$(printf '%s' "$BRANCH" | tr -c 'A-Za-z0-9-' '-')" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.151.3'
          command: pages deploy out --project-name=hancrafted --branch=${{ steps.branch.outputs.name }}
