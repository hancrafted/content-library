name: CI

# Lint, typecheck, a full static build and the post-build export test on every pull request, so a change
# that would break the Pages deploy fails before it merges.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: `archgate:full` diffs from the root commit.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run preflight
      - run: npm run archgate:full
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run knip
      - run: npx mh check
      # Build as the Pages deploy does, under its project-site base path, so a base-path bug fails here, not at deploy.
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /content-library
          SITE_URL: https://hancrafted.github.io/content-library
      # FE-005: every page URL the app derives landed in out/. Needs the build above.
      - run: npm run test:build
        env:
          NEXT_PUBLIC_BASE_PATH: /content-library
          SITE_URL: https://hancrafted.github.io/content-library
