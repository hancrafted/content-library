name: CI

# Lint, typecheck, the fast suite, a full static build and the post-build export test on every pull request, so a
# change that would break the Cloudflare Pages deploy fails before it merges. Three independent jobs run in parallel: each pays
# for its own `npm ci`, and the run takes as long as the slowest lane instead of the sum of all steps.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: preflight, archgate, lint, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: `archgate:full` diffs from the root commit.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The `archgate` npm package is a launcher: its first call downloads a ~67 MB binary into ~/.archgate/bin.
      # Keyed on the launcher's version, so a bump fetches the matching binary once.
      - uses: actions/cache@v6
        with:
          path: ~/.archgate/bin
          key: archgate-${{ runner.os }}-${{ hashFiles('node_modules/archgate/package.json') }}
      - run: npm run preflight
      - run: npm run archgate:full
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run knip
      # The new-episode sample sits under a dot-folder, which the default corpus never walks.
      - run: npm run check:docs

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: tests/docs/episode-staging.test.ts reads this repo's own `git log`.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  export:
    name: build, post-build tests
    runs-on: ubuntu-latest
    env:
      # Build as the Cloudflare Pages deploy does, from the domain root, so a base-path or origin bug fails here, not at deploy.
      NEXT_PUBLIC_BASE_PATH: ''
      SITE_URL: https://hancrafted.net
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # FE-005: every page URL the app derives landed in out/. Needs the build above.
      - run: npm run test:build
