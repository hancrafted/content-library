      - diagnosing-bugs
      - implement
      - tdd
  verify:
    model: opus
    skills:
      - code-review
      - improve-codebase-architecture
      - pr
  evolve:
    model: sonnet
    skills:
      - improve-codebase-architecture
      - retro
      - writing-for-agents
