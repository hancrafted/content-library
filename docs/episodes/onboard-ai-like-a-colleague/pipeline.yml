# The per-run pipeline of onboard-ai-like-a-colleague, tailored from the
# new-episode template. Every change from the template and its reason is in
# run-log.md under customize-pipeline.
#
# Schema (checked by src/lib/episode-pipeline.pure.ts in `npm run verify`):
#   status    draft | approved
#   jobs      run once every job in `needs` is done; independent jobs may run in parallel
#     intent    optional; the job's task as a prompt, for a job no reference describes
#     needs     job ids this job waits for
#     foreach   optional; `<file>#<heading>` fans the job out once per list item
#     before    what runs before the implementor writes: `mh-query`, required when a job
#               writes markdown, has the implementor run `npx mh query <path>` on every
#               .md output and follow its intents; the reviewer runs it as its baseline
#     outputs   full repo paths in the staging folder docs/episodes/<slug>/; a job reading
#               one must need its writer; a rule must govern every .md one
#     checks    cheapest first; names and commands in SKILL.md's job-loop check table
#     retries   reviewer failures sent back before this branch of the pipeline stops
#     gate      optional; `human` stops the run until Han approves the output
#     agents    run in order; a reviewer is fresh: it did not write the output
#       type        implementor | reviewer
#       skills      skill names under .agents/skills/
#       references  files the agent reads: `references/` and `assets/` sit in this
#                   skill's folder, anything else is a repo path
#       rubric      reviewers only: `<file>#<heading>` holding the pass/fail lines
#       agent       optional; the Claude Code agent type to spawn, general-purpose when omitted
#       model       the model it runs on, or inherit; SKILL.md's job loop says where it applies
#       session     optional; subagent (default) or orchestrator, by SKILL.md's job loop
status: draft
jobs:
  - id: brief-grill
    needs: []
    before: [mh-query]
    outputs: [docs/episodes/onboard-ai-like-a-colleague/brief.md]
    checks: [mh, vitest]
    retries: 0
    gate: human
    agents:
      - type: implementor
        skills: [brief-grill, grilling, handoff]
        references: [references/brief-grill.md]
        model: inherit
        session: orchestrator

  - id: customize-pipeline
    needs: [brief-grill]
    outputs: [docs/episodes/onboard-ai-like-a-colleague/pipeline.yml]
    checks: [vitest]
    retries: 0
    gate: human
    agents:
      - type: implementor
        skills: []
        references:
          [references/customize-pipeline.md, assets/pipeline.yml, docs/episodes/onboard-ai-like-a-colleague/brief.md]
        model: inherit
        session: orchestrator

  # Matches each research question against the llm-wiki index and records in
  # the run log which questions remain unanswered.
  - id: retrieval
    needs: [customize-pipeline]
    before: [mh-query]
    outputs: [docs/episodes/onboard-ai-like-a-colleague/run-log.md]
    checks: [mh]
    retries: 1
    agents:
      - type: implementor
        skills: []
        references:
          - references/retrieval.md
          - docs/episodes/onboard-ai-like-a-colleague/brief.md
          - docs/research/ai-onboarding-freelancer.md
          - docs/research/ai-amnesia-mechanics.md
        model: inherit

  - id: write-research
    needs: [retrieval]
    foreach: docs/episodes/onboard-ai-like-a-colleague/brief.md#research-questions
    before: [mh-query]
    outputs: [docs/episodes/onboard-ai-like-a-colleague/research/*/research.md]
    checks: [mh, vitest]
    retries: 1
    agents:
      - type: implementor
        skills: [research]
        references:
          - references/write-research.md
          - docs/episodes/onboard-ai-like-a-colleague/brief.md
          - docs/episodes/onboard-ai-like-a-colleague/run-log.md
          - docs/research/ai-onboarding-freelancer.md
          - docs/research/ai-amnesia-mechanics.md
        model: sonnet
      - type: reviewer
        skills: []
        references: [references/write-research.md]
        rubric: references/write-research.md#rubric
        model: opus

  # Folds the earlier Episode's research into this run's: once every research
  # job has passed, the two files it replaces go.
  - id: retire-prior-research
    intent: >-
      Every write-research job of this run has passed, and its research files carry
      the Findings of docs/research/ai-onboarding-freelancer.md and
      docs/research/ai-amnesia-mechanics.md that this Episode needs. Delete
      both files. Repoint the two files that cite them,
      src/components/episodes/amnesiac-freelancer/amnesiac-freelancer.ts and
      docs/research/amnesiac-freelancer-script.md, to the research files of
      this run that now hold those Findings. Remove both paths from every
      references list in this pipeline.yml, this job's included, so the
      pipeline check still finds every file it names.
    needs: [write-research]
    outputs: []
    checks: [mh, verify]
    retries: 1
    agents:
      - type: implementor
        skills: []
        references:
          - docs/research/ai-onboarding-freelancer.md
          - docs/research/ai-amnesia-mechanics.md
          - docs/research/amnesiac-freelancer-script.md
          - src/components/episodes/amnesiac-freelancer/amnesiac-freelancer.ts
          - docs/episodes/onboard-ai-like-a-colleague/research/*/research.md
        model: sonnet

  - id: write-dossier
    needs: [write-research]
    before: [mh-query]
    outputs: [docs/episodes/onboard-ai-like-a-colleague/dossier.md]
    checks: [mh, vitest]
    retries: 1
    agents:
      - type: implementor
        skills: []
        references:
          - references/write-dossier.md
          - docs/episodes/onboard-ai-like-a-colleague/brief.md
          - docs/episodes/onboard-ai-like-a-colleague/research/*/research.md
          - src/components/episodes/amnesiac-freelancer/amnesiac-freelancer.ts
          - docs/research/amnesiac-freelancer-script.md
        model: inherit
      - type: reviewer
        skills: []
        references: [references/write-dossier.md, docs/episodes/onboard-ai-like-a-colleague/brief.md]
        rubric: references/write-dossier.md#rubric
        model: opus

  - id: write-manuscript
    needs: [write-dossier]
    before: [mh-query]
    outputs: [docs/episodes/onboard-ai-like-a-colleague/manuscript.md]
    checks: [mh, vitest]
    retries: 1
    gate: human
    agents:
      - type: implementor
        skills: []
        references:
          - references/write-manuscript.md
          - docs/episodes/onboard-ai-like-a-colleague/brief.md
          - docs/episodes/onboard-ai-like-a-colleague/dossier.md
          - src/components/episodes/amnesiac-freelancer/amnesiac-freelancer.ts
          - docs/research/amnesiac-freelancer-script.md
        model: inherit
      - type: reviewer
        skills: []
        references: [references/write-manuscript.md, docs/episodes/onboard-ai-like-a-colleague/brief.md]
        rubric: references/write-manuscript.md#rubric
        model: opus

  # Writes no staging file: its output is a spec issue with one sub-issue per Section.
  - id: write-spec
    needs: [write-manuscript]
    outputs: []
    checks: []
    retries: 1
    agents:
      - type: implementor
        skills: [to-spec, to-tickets]
        references:
          [
            references/write-spec.md,
            docs/episodes/onboard-ai-like-a-colleague/brief.md,
            docs/episodes/onboard-ai-like-a-colleague/dossier.md,
            docs/episodes/onboard-ai-like-a-colleague/manuscript.md,
          ]
        model: inherit
      - type: reviewer
        skills: []
        references:
          [
            references/write-spec.md,
            docs/episodes/onboard-ai-like-a-colleague/dossier.md,
            docs/episodes/onboard-ai-like-a-colleague/manuscript.md,
          ]
        rubric: references/write-spec.md#rubric
        model: opus

  # Writes the Episode under src/, outside the staging folder.
  - id: implement-episode
    needs: [write-spec]
    outputs: []
    checks: [verify, build, test:build, visual-check]
    retries: 1
    agents:
      - type: implementor
        skills: [implement-spec, visual-check]
        references:
          [
            references/implement-episode.md,
            docs/episodes/onboard-ai-like-a-colleague/dossier.md,
            docs/episodes/onboard-ai-like-a-colleague/manuscript.md,
          ]
        model: opus
        session: orchestrator
      - type: reviewer
        skills: [code-review, visual-check]
        references:
          [
            references/implement-episode.md,
            docs/episodes/onboard-ai-like-a-colleague/dossier.md,
            docs/episodes/onboard-ai-like-a-colleague/manuscript.md,
          ]
        rubric: references/implement-episode.md#rubric
        model: opus
        session: orchestrator

  - id: open-pr
    needs: [implement-episode]
    outputs: []
    checks: []
    retries: 1
    agents:
      - type: implementor
        skills: [pr]
        references: [references/open-pr.md, docs/episodes/onboard-ai-like-a-colleague/run-log.md]
        model: sonnet
