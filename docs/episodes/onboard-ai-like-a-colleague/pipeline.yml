# The per-run pipeline of onboard-ai-like-a-colleague, tailored from the
# new-episode template. Every change from the template and its reason is in
# run-log.md under customize-pipeline.
#
# Schema (checked by src/lib/episode-pipeline.pure.ts in `npm run verify`):
#   status    draft | approved
#   template  per-run only: the feat/89-new-episode commit the pipeline was tailored
#             from; the template is not merged into the Episode branch again until
#             open-pr is done
#   jobs      run once every job in `needs` is done; independent jobs may run in parallel
#     intent    optional; the job's task as a prompt, for a job no reference describes
#     needs     job ids this job waits for; a blocked one blocks this job too
#     wants     optional; job ids this job waits for, passed or blocked: a blocked
#               one does not block it, and its implementor learns which blocked
#     isolation optional; `worktree`: the job's agents and checks work in their own
#               worktree on episode/<slug>--<job id>, merged back only on a pass.
#               Required on a job that may run beside another or has foreach,
#               unless all its agents run in the orchestrator session
#     foreach   template only; `<file>#<heading>`: customize-pipeline writes one job per list item
#     before    what runs before the implementor writes: `mh-query`, required when a job
#               writes markdown, has the implementor run `npx mh query <path>` on every
#               .md output and follow its intents; the reviewer runs it as its baseline
#     outputs   full repo paths in the staging folder docs/episodes/<slug>/; a job reading
#               one must need or want its writer; a rule must govern every .md one
#     checks    cheapest first; names and commands in SKILL.md's job-loop check table
#     retries   reviewer failures sent back before this branch of the pipeline stops
#     gate      optional; `human` stops the run until Han approves the output
#     agents    run in order; a reviewer is fresh: it did not write the output
#       type        implementor | reviewer
#       skills      skill names under .agents/skills/
#       references  files the agent reads: `references/` and `assets/` sit in this
#                   skill's folder, anything else is a repo path
#       rubric      reviewers only: `<file>#<heading>` holding the pass/fail lines
#       agent       optional; the Claude Code agent type to spawn, general-purpose when omitted
#       model       the model it runs on, or inherit; SKILL.md's job loop says where it applies
#       session     optional; subagent (default) or orchestrator, by SKILL.md's job loop
status: approved
template: 5b77640
jobs:
  - id: brief-grill
    needs: []
    before: [mh-query]
    outputs: [docs/episodes/onboard-ai-like-a-colleague/brief.md]
    checks: [mh, vitest]
    retries: 0
    gate: human
    agents:
      - type: implementor
        skills: [brief-grill, grilling, handoff]
        references: [references/brief-grill.md]
        model: inherit
        session: orchestrator

  # An information architect's call, before the pipeline names any research file.
  - id: categorize-research
    intent: >-
      Name one research folder per research question of the Brief, in its
      order, as `<category>-<####>__<question-slug>` by GLOSSARY.md's Research
      categories: pick the category each question belongs to, or, when none
      fits, add a new category there with its meaning. Number each folder with
      the next free number of its category, counting every research folder in
      docs/episodes/*/research/ and docs/llm-wiki/research/. Write the
      question's subject, not the Episode, in 20-40 characters of kebab case.
      Return the names, each beside its question, and any category you added
      with why no existing one fits.
    needs: [brief-grill]
    outputs: []
    checks: [mh]
    retries: 1
    agents:
      - type: implementor
        skills: [domain-modeling]
        references: [GLOSSARY.md, docs/episodes/onboard-ai-like-a-colleague/brief.md]
        model: opus

  - id: customize-pipeline
    needs: [categorize-research]
    outputs: [docs/episodes/onboard-ai-like-a-colleague/pipeline.yml]
    checks: [vitest]
    retries: 0
    gate: human
    agents:
      - type: implementor
        skills: []
        references:
          [references/customize-pipeline.md, assets/pipeline.yml, docs/episodes/onboard-ai-like-a-colleague/brief.md]
        model: inherit
        session: orchestrator

  # Matches each research question against the llm-wiki index and records in
  # the run log which questions remain unanswered.
  - id: retrieval
    needs: [customize-pipeline]
    before: [mh-query]
    outputs: [docs/episodes/onboard-ai-like-a-colleague/run-log.md]
    checks: [mh]
    retries: 1
    agents:
      - type: implementor
        skills: []
        references:
          - references/retrieval.md
          - docs/episodes/onboard-ai-like-a-colleague/brief.md
        model: inherit

  - id: write-research-ai-as-onboarding-a-colleague
    intent: >-
      Answer research question 1 of the Brief: Why do others frame working with AI
      as onboarding a colleague? Collect sources proposing a similar model (Matt
      Pocock confirmed; a consultant said the same in a company workshop), to show
      it's an established lens.
    needs: [retrieval]
    isolation: worktree
    before: [mh-query]
    outputs: [docs/episodes/onboard-ai-like-a-colleague/research/AIE-0001__ai-as-onboarding-a-colleague/research.md]
    checks: [mh, vitest]
    retries: 1
    agents:
      - type: implementor
        skills: [research]
        references:
          - references/write-research.md
          - docs/episodes/onboard-ai-like-a-colleague/brief.md
          - docs/episodes/onboard-ai-like-a-colleague/run-log.md
        model: sonnet
      - type: reviewer
        skills: []
        references: [references/write-research.md]
        rubric: references/write-research.md#rubric
        model: opus

  - id: write-research-individual-ai-productivity-gap
    intent: >-
      Answer research question 2 of the Brief: Why do individuals fail to reach
      the promised AI productivity boost?
    needs: [retrieval]
    isolation: worktree
    before: [mh-query]
    outputs: [docs/episodes/onboard-ai-like-a-colleague/research/AIE-0002__individual-ai-productivity-gap/research.md]
    checks: [mh, vitest]
    retries: 1
    agents:
      - type: implementor
        skills: [research]
        references:
          - references/write-research.md
          - docs/episodes/onboard-ai-like-a-colleague/brief.md
          - docs/episodes/onboard-ai-like-a-colleague/run-log.md
        model: sonnet
      - type: reviewer
        skills: []
        references: [references/write-research.md]
        rubric: references/write-research.md#rubric
        model: opus

  - id: write-research-organizational-ai-productivity-gap
    intent: >-
      Answer research question 3 of the Brief: Why do organizations fail to reach
      the promised AI productivity boost?
    needs: [retrieval]
    isolation: worktree
    before: [mh-query]
    outputs:
      [docs/episodes/onboard-ai-like-a-colleague/research/AIE-0003__organizational-ai-productivity-gap/research.md]
    checks: [mh, vitest]
    retries: 1
    agents:
      - type: implementor
        skills: [research]
        references:
          - references/write-research.md
          - docs/episodes/onboard-ai-like-a-colleague/brief.md
          - docs/episodes/onboard-ai-like-a-colleague/run-log.md
        model: sonnet
      - type: reviewer
        skills: []
        references: [references/write-research.md]
        rubric: references/write-research.md#rubric
        model: opus

  - id: write-research-context-and-brief-improve-ai-output
    intent: >-
      Answer research question 4 of the Brief: Why does richer context and a
      clearer brief measurably improve AI output?
    needs: [retrieval]
    isolation: worktree
    before: [mh-query]
    outputs:
      [docs/episodes/onboard-ai-like-a-colleague/research/AIE-0004__context-and-brief-improve-ai-output/research.md]
    checks: [mh, vitest]
    retries: 1
    agents:
      - type: implementor
        skills: [research]
        references:
          - references/write-research.md
          - docs/episodes/onboard-ai-like-a-colleague/brief.md
          - docs/episodes/onboard-ai-like-a-colleague/run-log.md
        model: sonnet
      - type: reviewer
        skills: []
        references: [references/write-research.md]
        rubric: references/write-research.md#rubric
        model: opus

  - id: write-research-risks-of-unchecked-ai-output
    intent: >-
      Answer research question 5 of the Brief: Why does unchecked AI work carry
      real risk?
    needs: [retrieval]
    isolation: worktree
    before: [mh-query]
    outputs: [docs/episodes/onboard-ai-like-a-colleague/research/AIE-0005__risks-of-unchecked-ai-output/research.md]
    checks: [mh, vitest]
    retries: 1
    agents:
      - type: implementor
        skills: [research]
        references:
          - references/write-research.md
          - docs/episodes/onboard-ai-like-a-colleague/brief.md
          - docs/episodes/onboard-ai-like-a-colleague/run-log.md
        model: sonnet
      - type: reviewer
        skills: []
        references: [references/write-research.md]
        rubric: references/write-research.md#rubric
        model: opus

  - id: write-research-ai-delegation-as-management-skill
    intent: >-
      Answer research question 6 of the Brief: Why is effective AI delegation a
      staff-level management discipline, and how does that reconcile with findings
      that AI boosts novices more on simple tasks? The claim is not that seniors
      have these skills; the task demands management discipline, which merely
      correlates with experience.
    needs: [retrieval]
    isolation: worktree
    before: [mh-query]
    outputs:
      [docs/episodes/onboard-ai-like-a-colleague/research/AIE-0006__ai-delegation-as-management-skill/research.md]
    checks: [mh, vitest]
    retries: 1
    agents:
      - type: implementor
        skills: [research]
        references:
          - references/write-research.md
          - docs/episodes/onboard-ai-like-a-colleague/brief.md
          - docs/episodes/onboard-ai-like-a-colleague/run-log.md
        model: sonnet
      - type: reviewer
        skills: []
        references: [references/write-research.md]
        rubric: references/write-research.md#rubric
        model: opus

  # Folds the earlier Episode's research into this run's: once the three
  # research jobs that read it have passed, the two files it replaces go.
  - id: retire-prior-research
    intent: >-
      The research jobs it needs have passed, and their research files carry
      the Findings of docs/research/ai-onboarding-freelancer.md and
      docs/research/ai-amnesia-mechanics.md that this Episode needs. Delete
      both files. Repoint the two files that cite them,
      src/components/episodes/amnesiac-freelancer/amnesiac-freelancer.ts and
      docs/research/amnesiac-freelancer-script.md, to the research files of
      this run that now hold those Findings. Remove both paths from every
      references list in this pipeline.yml, this job's included, so the
      pipeline check still finds every file it names.
    isolation: worktree
    needs:
      [
        write-research-ai-as-onboarding-a-colleague,
        write-research-context-and-brief-improve-ai-output,
        write-research-risks-of-unchecked-ai-output,
      ]
    outputs: []
    checks: [mh, verify]
    retries: 1
    agents:
      - type: implementor
        skills: []
        references:
          - docs/research/amnesiac-freelancer-script.md
          - src/components/episodes/amnesiac-freelancer/amnesiac-freelancer.ts
          - docs/episodes/onboard-ai-like-a-colleague/research/AIE-0001__ai-as-onboarding-a-colleague/research.md
          - docs/episodes/onboard-ai-like-a-colleague/research/AIE-0004__context-and-brief-improve-ai-output/research.md
          - docs/episodes/onboard-ai-like-a-colleague/research/AIE-0005__risks-of-unchecked-ai-output/research.md
        model: sonnet

  # Wants the research rather than needing it: a blocked question leaves a
  # gap the Dossier works around. Wants retire-prior-research too, so the
  # files it repoints are settled before the Dossier reads them.
  - id: write-dossier
    needs: [retrieval]
    wants:
      [
        write-research-ai-as-onboarding-a-colleague,
        write-research-individual-ai-productivity-gap,
        write-research-organizational-ai-productivity-gap,
        write-research-context-and-brief-improve-ai-output,
        write-research-risks-of-unchecked-ai-output,
        write-research-ai-delegation-as-management-skill,
        retire-prior-research,
      ]
    before: [mh-query]
    outputs: [docs/episodes/onboard-ai-like-a-colleague/dossier.md]
    checks: [mh, vitest]
    retries: 1
    agents:
      - type: implementor
        skills: []
        references:
          - references/write-dossier.md
          - docs/episodes/onboard-ai-like-a-colleague/brief.md
          - docs/episodes/onboard-ai-like-a-colleague/research/AIE-0001__ai-as-onboarding-a-colleague/research.md
          - docs/episodes/onboard-ai-like-a-colleague/research/AIE-0002__individual-ai-productivity-gap/research.md
          - docs/episodes/onboard-ai-like-a-colleague/research/AIE-0003__organizational-ai-productivity-gap/research.md
          - docs/episodes/onboard-ai-like-a-colleague/research/AIE-0004__context-and-brief-improve-ai-output/research.md
          - docs/episodes/onboard-ai-like-a-colleague/research/AIE-0005__risks-of-unchecked-ai-output/research.md
          - docs/episodes/onboard-ai-like-a-colleague/research/AIE-0006__ai-delegation-as-management-skill/research.md
          - src/components/episodes/amnesiac-freelancer/amnesiac-freelancer.ts
          - docs/research/amnesiac-freelancer-script.md
        model: inherit
      - type: reviewer
        skills: []
        references: [references/write-dossier.md, docs/episodes/onboard-ai-like-a-colleague/brief.md]
        rubric: references/write-dossier.md#rubric
        model: opus

  - id: write-manuscript
    needs: [write-dossier]
    before: [mh-query]
    outputs: [docs/episodes/onboard-ai-like-a-colleague/manuscript.md]
    checks: [mh, vitest]
    retries: 1
    gate: human
    agents:
      - type: implementor
        skills: []
        references:
          - references/write-manuscript.md
          - docs/episodes/onboard-ai-like-a-colleague/brief.md
          - docs/episodes/onboard-ai-like-a-colleague/dossier.md
          - src/components/episodes/amnesiac-freelancer/amnesiac-freelancer.ts
          - docs/research/amnesiac-freelancer-script.md
        model: inherit
      - type: reviewer
        skills: []
        references: [references/write-manuscript.md, docs/episodes/onboard-ai-like-a-colleague/brief.md]
        rubric: references/write-manuscript.md#rubric
        model: opus

  # Writes no staging file: its output is a spec issue with one sub-issue per Section.
  - id: write-spec
    needs: [write-manuscript]
    outputs: []
    checks: []
    retries: 1
    agents:
      - type: implementor
        skills: [to-spec, to-tickets]
        references:
          [
            references/write-spec.md,
            docs/episodes/onboard-ai-like-a-colleague/brief.md,
            docs/episodes/onboard-ai-like-a-colleague/dossier.md,
            docs/episodes/onboard-ai-like-a-colleague/manuscript.md,
          ]
        model: inherit
      - type: reviewer
        skills: []
        references:
          [
            references/write-spec.md,
            docs/episodes/onboard-ai-like-a-colleague/dossier.md,
            docs/episodes/onboard-ai-like-a-colleague/manuscript.md,
          ]
        rubric: references/write-spec.md#rubric
        model: opus

  # Writes the Episode under src/, outside the staging folder.
  - id: implement-episode
    needs: [write-spec]
    outputs: []
    checks: [verify, build, test:build, visual-check]
    retries: 1
    agents:
      - type: implementor
        skills: [implement-spec, visual-check]
        references:
          [
            references/implement-episode.md,
            docs/episodes/onboard-ai-like-a-colleague/dossier.md,
            docs/episodes/onboard-ai-like-a-colleague/manuscript.md,
          ]
        model: opus
        session: orchestrator
      - type: reviewer
        skills: [code-review, visual-check]
        references:
          [
            references/implement-episode.md,
            docs/episodes/onboard-ai-like-a-colleague/dossier.md,
            docs/episodes/onboard-ai-like-a-colleague/manuscript.md,
          ]
        rubric: references/implement-episode.md#rubric
        model: opus
        session: orchestrator

  - id: open-pr
    needs: [implement-episode]
    outputs: []
    checks: []
    retries: 1
    agents:
      - type: implementor
        skills: [pr]
        references: [references/open-pr.md, docs/episodes/onboard-ai-like-a-colleague/run-log.md]
        model: sonnet
