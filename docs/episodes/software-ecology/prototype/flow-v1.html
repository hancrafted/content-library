    c.beginPath(); c.rect(-1.4, -7, 2.8, 14);
    c.fillStyle = C.card; c.fill();
    if (enc === 'tone' && q !== Q.GOOD) { c.fillStyle = C.smudge; c.globalAlpha = q === Q.AVG ? 0.35 : 0.8; c.fill(); c.globalAlpha = 1; }
    c.lineWidth = 0.8; c.strokeStyle = ai ? C.ai : q === Q.GOOD ? C.ink : C.dull; c.stroke();
    c.restore();
  }

  function draw() {
    if (!measure()) return;
    const c = ctx;
    c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, canvas.width, canvas.height);
    c.setTransform(DPR * K, 0, 0, DPR * K, DPR * OX, DPR * OY);
    for (const d of M.docs) {
      const off = d.rev ? -4 : 0;
      drawDoc(c, d.x, d.y + off, d.rev ? -0.35 : d.tilt * 0.3, 1.1, d.q, d.ai, 1);
    }
    for (const n of M.nodes.values()) {
      if (n.kind !== 'role') continue;
      const vx = n.def.x + VALVE_DX, y = n.def.y;
      const sv = M.servers[n.server], b = sv && sv.busy && sv.busy.node === n ? sv.busy : null;
      n.queue.forEach((d, i) => drawSliver(c, vx - (i + 1) * QGAP - 4, y, d.q, d.ai));
      if (b) drawDoc(c, vx - 2, y, 0, 1.1, b.doc.q, b.doc.ai, 1);
    }
    for (const d of M.drops) drawDoc(c, d.x, d.y, d.rot, 1, d.q, d.ai, Math.max(0, d.life) * 0.85);
    const sink = [...M.nodes.values()].find((n) => n.kind === 'sink').def;
    for (const d of M.drips) drawDoc(c, sink.x + 36, sink.y + 30 + (1 - d.life) * 34, 0, 0.8, d.q, d.ai, Math.max(0, d.life));
  }

  // ---------- Per-frame DOM sync (cheap; text at 4 Hz) ----------
  function syncNodes() {
    for (const [id, g] of nodeEls) {
      const n = M.nodes.get(id), d = dials(n);
      const leaking = M.t - n.lastLeak < 1.5;
      const pressure = d.on && (n.press >= 0.5 || leaking);
      g.classList.toggle('is-pressure', pressure);
      g.classList.toggle('is-hot', d.on && (n.press >= 0.85 || leaking));
      g.classList.toggle('is-ai', d.ai);
      g.classList.toggle('is-off', S.isolate && !d.on);
      g.classList.toggle('is-selected', S.selected === id && !S.isolate);
      g.setAttribute('aria-label', S.isolate ? `${n.title}: ${d.on ? 'on' : 'off'}, press to switch` : `${n.title}: open card`);
      if (S.isolate) g.setAttribute('aria-pressed', String(d.on)); else g.removeAttribute('aria-pressed');
      $('[data-q]', g).textContent = String(n.queue.length + (isServing(n) ? 1 : 0));
    }
    stage.classList.toggle('is-isolating', S.isolate);
  }
  function spin(dt) {
    M.spin += dt;
    for (const im of impellers) {
      const n = M.nodes.get(im.node);
      if (!dials(n).ai) continue;
      im.a = ((im.a || 0) + dt * 360 * 1.4) % 360;
      im.g.setAttribute('transform', `rotate(${im.a.toFixed(1)} ${im.cx} ${im.cy})`);
    }
  }

  // ---------- Status, legend, card, tap ----------
  const isBalanced = () => S.reality === 0 && S.ai === 'off' && !S.isolate && Object.values(S.over).every((o) => Object.keys(o).length === 0);
  function renderStatus() {
    const el = $('#status');
    if (isBalanced()) { el.className = 'status status--calm'; el.textContent = 'A simplified organization in balance: every handoff is good and nothing piles up. Reality is messier.'; return; }
    el.className = 'status';
    const rs = roles();
    const backed = rs.filter((n) => dials(n).on && n.press >= 0.6).length;
    const lost = Math.round(perWeek(rs.reduce((a, n) => a + n.rate.leak, 0)));
    const back = Math.round(perWeek(rs.reduce((a, n) => a + n.rate.bounce, 0)));
    const parts = [];
    if (S.isolate) parts.push(`<b>Isolation:</b> ${rs.filter((n) => dials(n).on).length} of ${rs.length} roles on; off roles pass work through untouched. Click a role to switch it.`);
    parts.push(`<b>${backed}</b> ${backed === 1 ? 'role' : 'roles'} backed up`, `<b>${lost}</b> handoffs lost a week`);
    if (back) parts.push(`<b>${back}</b> sent back a week`);
    el.innerHTML = parts.join(' · ');
  }

  function iconCanvas(q, ai = false, e = enc) {
    const cv = document.createElement('canvas');
    const dpr = window.devicePixelRatio || 1;
    cv.width = 16 * dpr; cv.height = 20 * dpr; cv.className = 'docicon'; cv.setAttribute('aria-hidden', 'true');
    const c = cv.getContext('2d'); c.scale(dpr, dpr); drawDoc(c, 8, 10, 0, 1.2, q, ai, 1, e);
    return cv;
  }
  function renderLegend() {
    const el = $('#legend'); el.innerHTML = '';
    const item = (cv, text) => { const s = document.createElement('span'); s.className = 'legend__item'; s.append(cv, text); el.append(s); };
    item(iconCanvas(Q.GOOD), 'good'); item(iconCanvas(Q.AVG), 'average'); item(iconCanvas(Q.BAD), 'bad'); item(iconCanvas(Q.GOOD, true), 'written with AI');
    const hint = document.createElement('span'); hint.textContent = 'Hover a role or pipe for detail'; el.append(hint);
  }

  let cardTimer = 0;
  function renderCard() {
    const el = $('#card');
    const n = S.selected && M.nodes.get(S.selected);
    if (!n) { el.className = 'card card--empty'; el.innerHTML = `<p>${S.isolate ? 'Isolation is on: click roles to switch them on or off.' : 'Click a role to open its card: its two dials, its AI switch and what is stuck there.'}</p>`; return; }
    const d = dials(n);
    el.className = 'card';
    el.innerHTML = `<header class="card__head">
        <svg viewBox="0 0 48 48" aria-hidden="true">${glyphG(n.def.role === 'qa' ? 'qa' : n.def.role, 24, 24, 21)}</svg>
        <div><h2 class="card__title text-body">${esc(n.title)}</h2><p class="text-caption muted">${esc(n.job)}</p></div>
        <span class="chip" data-r="chip" style="margin-left:auto"></span>
        <button type="button" class="icon-btn" data-r="close" aria-label="Close card"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.5" /></svg></button>
      </header>
      <div class="card__grid">
        <div class="dial">
          <div class="dial__row"><label for="d-eff">Efficiency <span class="muted">· output</span></label><b data-r="eff">${d.eff} %</b></div>
          <input type="range" class="range" id="d-eff" min="20" max="100" step="5" value="${d.eff}" />
          <p class="dial__help" data-r="effhelp"></p>
        </div>
        <div class="dial">
          <div class="dial__row"><label for="d-effv">Effectiveness <span class="muted">· outcome</span></label><b data-r="effv">${d.effv} %</b></div>
          <input type="range" class="range" id="d-effv" min="20" max="100" step="5" value="${d.effv}" />
          <p class="dial__help">Chance a handoff leaves this role good. Garbage in stays garbage out.</p>
        </div>
      </div>
      <div class="card__grid">
        <div class="readouts">
          <div class="readout"><span class="readout__n" data-r="wait">0</span><span class="readout__l">waiting</span></div>
          <div class="readout"><span class="readout__n" data-r="done">0</span><span class="readout__l">done a week</span></div>
          <div class="readout"><span class="readout__n" data-r="leak">0</span><span class="readout__l" data-r="leakl">lost a week</span></div>
        </div>
        <div class="mix"><span class="text-caption muted">What it hands on</span><div class="mix__bar" data-r="bar"><i class="mix__good"></i><i class="mix__avg"></i><i class="mix__bad"></i></div><div class="mix__keys" data-r="keys"></div></div>
      </div>
      <hr class="sep" />
      <div class="card__grid">
        <button type="button" role="switch" class="switch" data-r="ai" aria-checked="${d.ai}" ${d.on ? '' : 'disabled'}><span class="switch__track" aria-hidden="true"></span><span><b class="text-body">AI at this role</b><br /><span class="text-caption muted">${AI_SPEED}× faster, ${n.role.vol}× the handoffs, same quality</span></span></button>
        <div><p class="text-caption muted" style="margin-bottom:6px">Where AI helps here</p><ul class="ai-uses ${d.ai ? '' : 'ai-uses--off'}" data-r="uses">${n.role.ai.map((a) => `<li>${esc(a)}</li>`).join('')}</ul></div>
      </div>`;
    const r = (k) => $(`[data-r="${k}"]`, el);
    r('close').addEventListener('click', () => { S.selected = null; renderCard(); syncNodes(); nodeEls.get(n.id)?.focus(); });
    const setOver = (k, v) => { (S.over[n.id] ||= {})[k] = v; changed(false); };
    $('#d-eff', el).addEventListener('input', (ev) => { setOver('eff', Number(ev.target.value)); r('eff').textContent = `${ev.target.value} %`; });
    $('#d-effv', el).addEventListener('input', (ev) => { setOver('effv', Number(ev.target.value)); r('effv').textContent = `${ev.target.value} %`; });
    r('ai').addEventListener('click', () => { const on = !dials(n).ai; setOver('ai', on); r('ai').setAttribute('aria-checked', String(on)); r('uses').classList.toggle('ai-uses--off', !on); });
    updateCard();
  }
  function updateCard() {
    const el = $('#card'); const n = S.selected && M.nodes.get(S.selected);
    if (!n || el.classList.contains('card--empty')) return;
    const r = (k) => $(`[data-r="${k}"]`, el), d = dials(n);
    const wait = n.queue.length + (isServing(n) ? 1 : 0), leak = Math.round(perWeek(n.rate.leak)), back = Math.round(perWeek(n.rate.bounce));
    r('wait').textContent = `${wait}/${n.buffer}`; r('wait').classList.toggle('is-warn', wait / n.buffer >= 0.85);
    r('done').textContent = Math.round(perWeek(n.rate.done));
    r('leak').textContent = back ? `${leak} · ${back}` : leak; r('leak').classList.toggle('is-warn', leak > 0);
    r('leakl').textContent = back ? 'lost · sent back a week' : 'lost a week';
    const capW = perWeek(n.cap * (d.eff / 100) * (d.ai ? AI_SPEED : 1)) / (n.def.person ? 2 : 1);
    r('effhelp').textContent = `Can finish about ${Math.round(capW)} a week${n.def.person ? ' (one person, shared with their other role)' : ''}; ${Math.round(perWeek(n.inflow))} arrive in balance.`;
    const out = n.rate.out, tot = out[0] + out[1] + out[2] || 1;
    const [b, a, g] = out.map((x) => x / tot);
    const bar = $$('i', r('bar')); bar[0].style.width = `${g * 100}%`; bar[1].style.width = `${a * 100}%`; bar[2].style.width = `${b * 100}%`;
    const keys = r('keys'); keys.innerHTML = '';
    for (const [q, v, l] of [[Q.GOOD, g, 'good'], [Q.AVG, a, 'average'], [Q.BAD, b, 'bad']]) { const s = document.createElement('span'); s.append(iconCanvas(q)); s.insertAdjacentHTML('beforeend', `<b>${Math.round(v * 100)} %</b> ${l}`); keys.append(s); }
    const chip = r('chip');
    const leaking = M.t - n.lastLeak < 1.5;
    const [txt, cls] = !d.on ? ['Off', ''] : leaking ? ['Leaking', 'chip--warn'] : n.press >= 0.6 ? ['Backed up', 'chip--warn'] : d.ai ? ['AI on · keeping up', 'chip--ai'] : n.press < 0.12 && perWeek(n.rate.done) < perWeek(n.inflow) * 0.6 ? ['Starved', ''] : ['Keeping up', ''];
    chip.textContent = txt; chip.className = `chip ${cls}`;
  }

  // Which swing comes out: good enough at the tap, the swing; else the panel of the weakest role.
  function renderTap() {
    const el = $('#tap');
    const tot = M.tap[0] + M.tap[1] + M.tap[2] || 1e-9;
    const g = M.tap[2] / tot, a = M.tap[1] / tot, b = M.tap[0] / tot;
    const n = Math.round(perWeek(M.tapRate));
    let panel = PANELS[9], cap = 'The tire swing the customer asked for';
    if (g < 0.75) {
      const rs = roles().filter((r) => dials(r).on);
      const worst = rs.reduce((w, r) => (!w || dials(r).effv < dials(w).effv ? r : w), null);
      const byRole = S.uc.panels ? PANELS.find((p) => p.node === worst?.id) : null;
      panel = byRole || PANELS[3]; cap = `A wrong swing: ${panel.cap.charAt(0).toLowerCase()}${panel.cap.slice(1)}`;
    }
    el.innerHTML = `<p class="eyebrow text-caption">At the tap</p>
      <p class="tap-panel__n">${n} handoffs a week</p>
      <svg viewBox="0 0 160 110" class="art" role="img" aria-label="${esc(cap)}">${panelArt(panel)}</svg>
      <p class="tap-panel__cap">${esc(cap)}</p>
      <div class="tap-mix" aria-hidden="true"><i class="g" style="width:${g * 100}%"></i><i class="a" style="width:${a * 100}%"></i></div>
      <p class="tap-keys"><span>${Math.round(g * 100)} % good</span><span>${Math.round(a * 100)} % average</span><span>${Math.round(b * 100)} % bad</span></p>
      <p class="text-caption" style="opacity:.8">Three good handoffs in four bring out the swing the customer asked for.</p>`;
  }

  // ---------- Steps, use cases, swing and roles views ----------
  const THUMB = {
    swing: Array.from({ length: 10 }, (_, i) => {
      const x = 6 + (i % 5) * 30, y = 6 + Math.floor(i / 5) * 28, t = i === 9;
      return `<rect x="${x}" y="${y}" width="26" height="24" rx="3" fill="var(--card)" stroke="${t ? 'var(--primary)' : 'var(--border)'}" /><path d="M${x + 5} ${y + 21} V${y + 5} H${x + 22} M${x + 15} ${y + 5} V${y + 13}" fill="none" stroke="var(--muted-foreground)" stroke-width="1.2" /><ellipse cx="${x + 15}" cy="${y + 15}" rx="3.5" ry="1.6" fill="none" stroke="${t ? 'var(--primary)' : 'var(--muted-foreground)'}" stroke-width="1.4" />`;
    }).join(''),
    roles: Array.from({ length: 8 }, (_, i) => { const x = 20 + (i % 4) * 38, y = 18 + Math.floor(i / 4) * 26; return `<circle cx="${x}" cy="${y}" r="9" fill="var(--card)" stroke="var(--border)" stroke-width="1.2" /><circle cx="${x}" cy="${y}" r="2.5" fill="var(--muted-foreground)" />`; }).join(''),
    pipeline: `<path d="M6 32 H154" fill="none" stroke="var(--border)" stroke-width="10" stroke-linecap="round" /><path d="M6 32 H154" fill="none" stroke="var(--card)" stroke-width="7" stroke-linecap="round" />${[34, 80, 126].map((x) => `<circle cx="${x}" cy="16" r="5" fill="var(--card)" stroke="var(--muted-foreground)" stroke-width="1" />`).join('')}${[18, 52, 66, 98, 112, 140].map((x) => `<rect x="${x}" y="29" width="5" height="6" rx="1" fill="var(--card)" stroke="var(--foreground)" stroke-width=".8" />`).join('')}`,
  };
  const STEPS = [
    { id: 'swing', label: '1 · Swing', sub: 'Ten cartoon panels' },
    { id: 'roles', label: '2 · Roles', sub: 'Who does the work' },
    { id: 'pipeline', label: '3 · Pipeline', sub: 'Work flowing through' },
  ];
  function renderSteps() {
    $('#steps').innerHTML = STEPS.map((s) => {
      const dis = s.id === 'swing' && !S.uc.panels;
      return `<button type="button" class="step" data-step="${s.id}" aria-pressed="${S.step === s.id}" ${dis ? 'aria-disabled="true" title="Only the tire swing has cartoon panels"' : ''}>
        <svg viewBox="0 0 160 62" aria-hidden="true">${THUMB[s.id]}</svg><span class="step__label">${s.label}</span><span class="step__sub text-caption muted">${s.sub}</span></button>`;
    }).join('');
    for (const b of $$('[data-step]')) b.addEventListener('click', () => { if (b.getAttribute('aria-disabled') === 'true') return; S.step = b.dataset.step; applyStep(); });
  }
  function applyStep() {
    for (const b of $$('[data-step]')) b.setAttribute('aria-pressed', String(b.dataset.step === S.step));
    const panel = S.step === 'pipeline' ? 'graph' : S.step;
    for (const p of $$('[data-panel]')) p.hidden = p.dataset.panel !== panel;
    if (panel === 'graph') { measure(); draw(); start(); }
  }
  function renderViews() {
    $('#panels').innerHTML = PANELS.map((p) => `<li class="${p.target ? 'is-target' : ''}"><svg viewBox="0 0 160 110" role="img" aria-label="${esc(p.cap)}">${panelArt(p)}</svg><p class="text-caption" style="font-weight:600">${esc(p.cap)}</p><span class="tag ${p.target ? 'tag--primary' : ''}">${esc(p.role)}</span></li>`).join('');
    $('#roles-lede').textContent = `${S.uc.name}: the customer stands at both ends, the intake on the left and the tap on the right. ${roles().length} roles sit between.`;
    $('#roles').innerHTML = roles().map((n) => {
      const p = S.uc.panels ? PANELS.find((x) => x.node === n.id) : null;
      return `<li><svg viewBox="0 0 52 52" aria-hidden="true">${glyphG(n.def.role === 'qa' ? 'qa' : n.def.role, 26, 26, 23)}</svg><div><p class="text-body" style="font-weight:600">${esc(n.title)}</p><p class="text-caption muted">${esc(n.job)}</p></div>${p ? `<p class="roles__cap text-caption muted">${esc(p.cap)}</p>` : ''}</li>`;
    }).join('');
  }
  function renderUseCases() {
    const sel = $('#usecase');
    sel.innerHTML = USE_CASES.map((u) => `<option value="${u.id}">${esc(u.name)}</option>`).join('');
    sel.value = S.uc.id;
    sel.addEventListener('change', () => {
      S.uc = USE_CASES.find((u) => u.id === sel.value); S.over = {}; S.selected = null;
      if (S.step === 'swing' && !S.uc.panels) S.step = 'roles';
      boot();
    });
  }
  function renderEnc() {
    $('#enc').innerHTML = ENCODINGS.map((e) => `<button type="button" data-enc="${e.id}" aria-pressed="${enc === e.id}">${e.key} · ${e.name}${e.id === 'tone' ? ' (recommended)' : ''}</button>`).join('');
    for (const b of $$('[data-enc]')) {
      b.prepend(iconCanvas(Q.GOOD, false, b.dataset.enc), iconCanvas(Q.AVG, false, b.dataset.enc), iconCanvas(Q.BAD, false, b.dataset.enc));
      b.addEventListener('click', () => { enc = b.dataset.enc; renderEnc(); renderLegend(); renderCard(); draw(); });
    }
    $('#enc-why').textContent = ENCODINGS.find((e) => e.id === enc).why;
  }

  // ---------- Controls ----------
  function syncControls() {
    $('#reality').value = S.reality;
    $('#reality').setAttribute('aria-valuetext', S.reality === 0 ? 'Ideal' : `Messy ${S.reality} %`);
    for (const b of $$('[data-ai]')) b.setAttribute('aria-pressed', String(b.dataset.ai === S.ai));
    $('#isolate').setAttribute('aria-pressed', String(S.isolate));
  }
  function wireControls() {
    $('#reality').addEventListener('input', (e) => {
      S.reality = Number(e.target.value);
      for (const o of Object.values(S.over)) { delete o.eff; delete o.effv; } // the slider sets every role
      changed();
    });
    for (const b of $$('[data-ai]')) b.addEventListener('click', () => { S.ai = b.dataset.ai; for (const o of Object.values(S.over)) delete o.ai; changed(); });
    $('#isolate').addEventListener('click', () => {
      S.isolate = !S.isolate;
      for (const o of Object.values(S.over)) delete o.on;
      changed();
    });
    $('#reset').addEventListener('click', () => { S.reality = 0; S.ai = 'off'; S.isolate = false; S.over = {}; S.selected = null; boot(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.selected) { const id = S.selected; S.selected = null; renderCard(); syncNodes(); nodeEls.get(id)?.focus(); } });
    const tb = $('#theme');
    const setTheme = (dark) => { document.documentElement.classList.toggle('dark', dark); tb.setAttribute('aria-pressed', String(dark)); tb.textContent = dark ? 'Light' : 'Dark'; readColors(); renderLegend(); renderEnc(); draw(); };
    tb.addEventListener('click', () => setTheme(!document.documentElement.classList.contains('dark')));
    if (matchMedia('(prefers-color-scheme: dark)').matches) setTheme(true);
  }

  // A control changed: live in motion; under reduced motion, re-run from the seed so the still frame is the steady state.
  function changed(full = true) {
    syncControls();
    if (reduce.matches) { M = build(S.uc); warm(60); }
    syncNodes(); renderStatus();
    if (full) renderCard();
    draw(); start();
  }
  function warm(seconds) { for (let i = 0, n = Math.round(seconds / DT); i < n; i++) step(DT); }

  // ---------- Loop: fixed-step simulation, 60 fps paint, paused off-screen ----------
  const reduce = matchMedia('(prefers-reduced-motion: reduce)');
  let running = false, last = 0, acc = 0, slow = 0, visible = true;
  function frame(now) {
    const dt = last ? Math.min(0.1, (now - last) / 1000) : DT; last = now;
    acc += dt;
    while (acc >= DT) { step(DT); acc -= DT; }
    spin(dt); draw();
    slow += dt;
    if (slow > 0.25) { slow = 0; syncNodes(); updateCard(); renderStatus(); renderTap(); if (hoverNode) nodeHover(hoverNode, true); }
    if (visible && !reduce.matches && S.step === 'pipeline' && !document.hidden) requestAnimationFrame(frame); else { running = false; last = 0; }
  }
  function start() {
    if (reduce.matches || S.step !== 'pipeline') { draw(); renderTap(); syncNodes(); return; }
    if (running || !visible) return;
    running = true; requestAnimationFrame(frame);
  }
  const io = new IntersectionObserver((es) => { visible = es[0].isIntersecting; start(); });
  new ResizeObserver(() => { draw(); }).observe(stage);
  document.addEventListener('visibilitychange', start);
  reduce.addEventListener('change', start);

  function boot() {
    M = build(S.uc);
    $('#usecase-sub').textContent = S.uc.sub;
    renderStage(); renderSteps(); renderViews(); syncControls();
    warm(60);
    syncNodes(); renderStatus(); renderCard(); renderTap(); renderLegend();
    applyStep(); draw(); start();
  }

  readColors();
  renderUseCases(); wireControls(); renderEnc();
  boot();
  io.observe(stage);
  window.__eco = { S, get M() { return M; }, dials, perWeek,
    probe(ucId, reality, ai, secs = 90) {
      const keep = { uc: S.uc, reality: S.reality, ai: S.ai, over: S.over, isolate: S.isolate }, keepM = M;
      Object.assign(S, { uc: USE_CASES.find((u) => u.id === ucId), reality, ai, over: {}, isolate: false });
      M = build(S.uc); warm(secs);
      const rs = roles();
      const out = { tap: +perWeek(M.tapRate).toFixed(1), good: Math.round((M.tap[2] / (M.tap[0] + M.tap[1] + M.tap[2])) * 100), docs: M.docs.length,
        lost: +perWeek(rs.reduce((a, n) => a + n.rate.leak, 0)).toFixed(1), back: +perWeek(rs.reduce((a, n) => a + n.rate.bounce, 0)).toFixed(1),
        hot: rs.filter((n) => n.press >= 0.6).map((n) => n.id + ':' + n.queue.length + '/' + n.buffer).join(' ') };
      Object.assign(S, keep); M = keepM; return out;
    } };
})();

</script>
</body>
</html>
