# Gatekeeper lead: one tech lead writes every spec and reviews every change (schema software-ecology-factory/5).
id: gate
layout: { width: 1520, height: 700, top: 0 }
mechanics: { rework: 0.4, churn: 1.2 }
# Without Support, bug and support requests go to Operations.
customer: { at: [90, 370], rate: 8, mix: { sales: 30, pm: 50, ops: 20 }, good: { pm: 0.2 }, bad: {}, releases: [ops] }
company: service
sources:                   # Product company (Model): own tickets a week
  - { id: roadmap, at: pm, rate: 2 }
  - { id: leads, at: sales, rate: 1 }
  - { id: debt, at: e2, rate: 1 }
bottleneck: lrev           # the lead: one person, two work centers
roles:                     # AI profile overrides for this use case
  eng: { aiSize: 1.5 }     # an AI-made pull request takes the lead half as long again to review
centers:
  - { id: sales, role: sales, at: [400, 160], realistic: [88, 96], spawns: [{ to: pm, n: 1 }] }
  - { id: pm, role: pm, at: [400, 370], realistic: [88, 94], spawns: [{ to: lspec, n: 1 }] }
  - { id: lspec, role: lead, at: [710, 370], person: lead, realistic: [76, 93], spawns: [{ choose: [{ to: e1, w: 1 }, { to: e2, w: 1 }, { to: e3, w: 1 }] }] }
  - { id: e1, role: eng, at: [1020, 160], realistic: [94, 91], spawns: [{ to: lrev, n: 1 }] }
  - { id: e2, role: eng, at: [1020, 370], realistic: [94, 91], spawns: [{ to: lrev, n: 1 }] }
  - { id: e3, role: eng, at: [1020, 580], realistic: [94, 91], spawns: [{ to: lrev, n: 1 }] }
  - { id: lrev, role: lead, at: [1330, 370], person: lead, inspection: true, stampUnderPressure: 0.8, realistic: [76, 98], spawns: [{ to: ops, n: 1 }] }
  - { id: ops, role: ops, at: [1330, 160], realistic: [89, 98], spawns: [{ to: customer, n: 1 }] }
routes:
  customer-sales: { xm: 215 }
  sales-pm: { out: bottom, in: top }
  lspec-e1: { xm: 865 }
  lspec-e3: { xm: 865 }
  e1-lrev: { xm: 1175 }
  e3-lrev: { xm: 1175 }
  lrev-ops: { out: top, in: bottom }
  ops-customer: { out: top, in: top, via: [[1366, 36], [90, 36]] }
  customer-ops: { out: bottom, via: [[90, 668], [1485, 668], [1485, 160]] }
presets:
  - { id: roles, view: roles }
  - { id: ideal, view: factory, check: { run: 12, expect: { customer.output: "0.95–1.05", customer.headroom: "1.35–1.5", lrev.weeksWaiting: "<0.2" } } }
  - { id: realistic, view: factory, reality: 100, customer: { mix: { sales: 25, pm: 45, ops: 30 }, bad: { ops: 0.6 } }, check: { run: 12, expect: { customer.output: "0.85–1.15", customer.sat: ">0.85", customer.headroom: "1.05–1.2", lrev.weeksWaiting: "<1" } } }
  - { id: speed-up, view: factory, reality: 100, customer: { mix: { sales: 25, pm: 45, ops: 30 }, bad: { ops: 0.6 } }, dials: { e2: { efficiency: 200 } }, check: { run: 16, expect: { customer.output: "0.85–1.15", e2.weeksWaiting: "<0.2", customer.headroom: "1.05–1.2" } } }
  - { id: ai-unbalanced, view: factory, reality: 100, ai: [e1, e2, e3], dials: { e1: { aiExtra: 2 }, e2: { aiExtra: 2 }, e3: { aiExtra: 2 } }, customer: { mix: { sales: 25, pm: 45, ops: 30 }, bad: { ops: 0.6 } }, check: { run: 16, expect: { customer.output: "0.35–0.75", lrev.weeksWaiting: ">3", customer.headroom: "<0.7" } } }
