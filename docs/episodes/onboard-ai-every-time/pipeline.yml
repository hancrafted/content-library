      references/write-research.md. Cite docs/llm-wiki/research/AIE/AIE-0001__ai-as-onboarding-a-colleague/research.md as a Source: it answers a neighbouring question, not this one.
    before: [mh-query]
    outputs: [docs/episodes/onboard-ai-every-time/research/ORG-0001__tacit-knowledge-onboarding-transfer/research.md]
    checks: [mh, vitest, sources]
    retries: 2
    agents:
      - type: implementor
        skills: [research, writing-for-agents]
        references:
          - references/write-research.md
          - docs/episodes/onboard-ai-every-time/brief.md
          - docs/episodes/onboard-ai-every-time/research-plan.md
          - docs/llm-wiki/research/AIE/AIE-0001__ai-as-onboarding-a-colleague/research.md
        model: sonnet
      - type: reviewer
        skills: []
        references: [references/write-research.md]
        rubric: references/write-research.md#rubric
        model: opus

