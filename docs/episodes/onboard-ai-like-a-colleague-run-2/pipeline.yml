  - id: write-research-ai-delegation-as-management-discipline
    intent: >-
      Why is effective AI delegation a staff-level management discipline, and how does that reconcile with findings that AI boosts novices more on simple tasks? The claim is not that seniors have these skills; the task demands management discipline, which merely correlates with experience.
    needs: [retrieval]
    isolation: worktree
    before: [mh-query]
    outputs:
      [
        docs/episodes/onboard-ai-like-a-colleague-run-2/research/AIE-0012__ai-delegation-as-management-discipline/research.md,
      ]
    checks: [mh, vitest]
    retries: 2
    agents:
      - type: implementor
        skills: [research]
        references:
          [
            references/write-research.md,
            docs/episodes/onboard-ai-like-a-colleague-run-2/brief.md,
            docs/episodes/onboard-ai-like-a-colleague-run-2/run-log.md,
          ]
        model: sonnet
      - type: reviewer
        skills: []
        references: [references/write-research.md]
        rubric: references/write-research.md#rubric
        model: opus

  # Wants the research rather than needing it: a blocked question leaves a
  # gap the Dossier works around, instead of blocking the Episode.
  - id: write-dossier
    needs: [retrieval]
    wants:
      - write-research-ai-as-onboarding-a-colleague
      - write-research-individual-ai-productivity-gap
      - write-research-organizational-ai-productivity-gap
      - write-research-context-and-brief-improve-ai-output
      - write-research-risks-of-unchecked-ai-output
      - write-research-ai-delegation-as-management-discipline
    before: [mh-query]
    outputs: [docs/episodes/onboard-ai-like-a-colleague-run-2/dossier.md]
    checks: [mh, vitest]
    retries: 2
    agents:
      - type: implementor
        skills: []
        references:
          - references/write-dossier.md
          - docs/episodes/onboard-ai-like-a-colleague-run-2/brief.md
          - docs/episodes/onboard-ai-like-a-colleague-run-2/research/AIE-0007__ai-as-onboarding-a-colleague/research.md
          - docs/episodes/onboard-ai-like-a-colleague-run-2/research/AIE-0008__individual-ai-productivity-gap/research.md
          - docs/episodes/onboard-ai-like-a-colleague-run-2/research/AIE-0009__organizational-ai-productivity-gap/research.md
          - docs/episodes/onboard-ai-like-a-colleague-run-2/research/AIE-0010__context-and-brief-improve-ai-output/research.md
          - docs/episodes/onboard-ai-like-a-colleague-run-2/research/AIE-0011__risks-of-unchecked-ai-output/research.md
          - docs/episodes/onboard-ai-like-a-colleague-run-2/research/AIE-0012__ai-delegation-as-management-discipline/research.md
          - docs/llm-wiki/index.md
        model: inherit
      - type: reviewer
        skills: []
        references: [references/write-dossier.md, docs/episodes/onboard-ai-like-a-colleague-run-2/brief.md]
        rubric: references/write-dossier.md#rubric
        model: opus

  # Rewrites the Voice script lines of dossier.md and nothing else; the staging
  # test checks that against write-dossier's commit, so no schema key says it.
  # Han reads and edits the whole Dossier at this gate.
  - id: write-voice-script
    needs: [write-dossier]
    before: [mh-query]
    outputs: [docs/episodes/onboard-ai-like-a-colleague-run-2/dossier.md]
    checks: [mh, vitest]
    retries: 2
    gate: human
    agents:
      - type: implementor
        skills: []
        references:
          - references/write-voice-script.md
          - docs/episodes/onboard-ai-like-a-colleague-run-2/brief.md
          - docs/episodes/onboard-ai-like-a-colleague-run-2/dossier.md
        model: inherit
      - type: reviewer
        skills: []
        references:
          - references/write-voice-script.md
          - docs/episodes/onboard-ai-like-a-colleague-run-2/brief.md
        rubric: references/write-voice-script.md#rubric
        model: opus

  # Writes no staging file: its output is a spec issue with one sub-issue per Section.
  - id: write-spec
    needs: [write-voice-script]
    outputs: []
    checks: []
    retries: 2
    agents:
      - type: implementor
        skills: [to-spec, to-tickets]
        references:
          [
            references/write-spec.md,
            docs/episodes/onboard-ai-like-a-colleague-run-2/brief.md,
            docs/episodes/onboard-ai-like-a-colleague-run-2/dossier.md,
          ]
        model: inherit
      - type: reviewer
        skills: []
        references: [references/write-spec.md, docs/episodes/onboard-ai-like-a-colleague-run-2/dossier.md]
        rubric: references/write-spec.md#rubric
        model: opus

  # Writes no staging file: its output is the spec issue's visual language and a
  # design answer in every ticket body. The implementor runs in the orchestrator's
  # session, because it spawns the designers (ui-ux-pro-max:slides). The gate is a label, not a
  # status: Han relabels each ticket from needs-triage to ready-for-agent.
  - id: write-design-spec
    needs: [write-spec]
    outputs: []
    checks: []
    retries: 2
    gate: human
    agents:
      - type: implementor
        skills: [ui-ux-pro-max:slides]
        references:
          - references/write-design-spec.md
          - GLOSSARY.md
          - docs/episodes/onboard-ai-like-a-colleague-run-2/brief.md
          - docs/episodes/onboard-ai-like-a-colleague-run-2/dossier.md
          - docs/design/slide-library.md
          - docs/design/design-guide.md
          - docs/design/design-system.md
        model: opus
        session: orchestrator
      - type: reviewer
        skills: []
        references:
          - references/write-design-spec.md
          - GLOSSARY.md
          - docs/episodes/onboard-ai-like-a-colleague-run-2/brief.md
          - docs/episodes/onboard-ai-like-a-colleague-run-2/dossier.md
          - docs/design/slide-library.md
          - docs/design/design-guide.md
        rubric: references/write-design-spec.md#rubric
        model: opus

  # Writes the Episode under src/, outside the staging folder.
  - id: implement-episode
    needs: [write-design-spec]
    outputs: []
    checks: [verify, build, test:build, visual-check]
    retries: 2
    agents:
      - type: implementor
        skills: [implement-spec, visual-check]
        references: [references/implement-episode.md, docs/episodes/onboard-ai-like-a-colleague-run-2/dossier.md]
        model: opus
        session: orchestrator
      - type: reviewer
        skills: [code-review, visual-check]
        references: [references/implement-episode.md, docs/episodes/onboard-ai-like-a-colleague-run-2/dossier.md]
        rubric: references/implement-episode.md#rubric
        model: opus
        session: orchestrator

  - id: open-pr
    needs: [implement-episode]
    outputs: []
    checks: []
    retries: 0
    agents:
      - type: implementor
        skills: [pr]
        references: [references/open-pr.md, docs/episodes/onboard-ai-like-a-colleague-run-2/run-log.md]
        model: sonnet
