          - GLOSSARY.md
          - docs/episodes/never-too-early-sales-run-2/brief.md
          - docs/episodes/never-too-early-sales-run-2/dossier.md
          - docs/design/slide-library.md
          - docs/design/design-guide.md
          - docs/episodes/never-too-early-sales-run-2/reference/source-deck/design-reference.md
        rubric: references/write-design-spec.md#rubric
        model: opus

  # Writes the Episode under src/, outside the staging folder.
  - id: implement-episode
