    needs: [write-dossier]
    before: [mh-query]
    outputs: [docs/episodes/never-too-early-sales-run-2/dossier.md]
    checks: [mh, vitest]
    retries: 2
    gate: human
    agents:
      - type: implementor
        skills: []
