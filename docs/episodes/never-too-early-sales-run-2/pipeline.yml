        rubric: references/write-spec.md#rubric
        model: opus

  # Writes no staging file: its output is the spec issue's visual language and a
  # design answer in every ticket body. The implementor runs in the orchestrator's
  # session, because it spawns the designers (ui-ux-pro-max:slides). The gate is a label, not a
  # status: Han relabels each ticket from needs-triage to ready-for-agent.
  - id: write-design-spec
    needs: [write-spec]
    outputs: []
    checks: []
    retries: 2
    gate: human
    agents:
      - type: implementor
        skills: [ui-ux-pro-max:slides]
        references:
          - references/write-design-spec.md
