    outputs: []
    checks: [verify, build, test:build, impeccable, visual-check]
    retries: 2
    agents:
      # `ticket` is the agent and skills of each ticket subagent implement-spec spawns.
      - type: implementor
        skills: [implement-spec]
        ticket:
          agent: archgate:developer
          skills: [tdd, visual-check, vercel-react-best-practices, web-design-guidelines, commit]
        references:
          - references/implement-episode.md
          - references/skill-overrides.md
          - docs/episodes/never-too-early-sales-run-2/dossier.md
          - docs/episodes/never-too-early-sales-run-2/reference/source-deck/design-reference.md
