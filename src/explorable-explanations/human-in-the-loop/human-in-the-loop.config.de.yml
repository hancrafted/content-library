  stepCheck: 'Ergebnis prüfen (optional)'
  stepCheckInfo: 'Prüfe das Ergebnis in einer neuen Unterhaltung. Fällt es durch, füge das Feedback in die Unterhaltung des vorherigen Schritts ein und aktualisiere das Ergebnis. Wiederhole das, bis alle Prüfungen bestehen.'
  copyExplanation: 'Erklär-Prompt kopieren'
  copyExplanationTip: 'Füge diesen Prompt in einen Chat ein: Die KI erklärt den Prompt, warum er so gebaut ist und was du verbessern kannst, und bietet dann an, dich durch die Übung zu führen.'
  explainWrapper: "Du bist mein Coach für Prompt Engineering, und ich lerne, Projekte mit KI zu planen. Unten steht der Prompt eines Schritts aus einer angeleiteten Übung. Führe ihn nicht aus: Erkläre ihn mir und begleite mich dann durch die Übung.\n\nPrompt:\n\"\"\"\n{prompt}\n\"\"\"\n\nIn einfachen Worten, kurz und konkret, mit Zitat der Zeilen, die du meinst:\n1. Was dieser Schritt tut und warum er für das ganze Projekt wichtig ist.\n2. Wofür jeder Teil des Prompts da ist.\n3. Welche Techniken er nutzt (Rolle, Kontext, Abgrenzung, Schritte, Ausgabeformat) und warum sie helfen.\n4. Wo er schwach ist und wie ich ihn an mein eigenes Projekt anpassen könnte.\nBiete mir danach an, mich durch die Übung zu führen: Schlag drei Fragen vor, die ich dir als Nächstes stellen könnte, etwa \"Erklär mir, was wir gerade gemacht haben\", \"Warum ist dieser Schritt wichtig?\" und \"Was wäre bei meinem eigenen Projekt anders?\", und warte auf meine Antwort."
