  stepContext: 'Kontext angeben'
  stepContextInfo: 'Der Prompt unten braucht Ergebnisse früherer Aufgaben oder zusätzliche Eingaben. Sie werden hier eingetragen, wenn du das Ergebnis in einem früheren Schritt eingefügt hast. Jedes Feld enthält schon ein Beispiel oder dein früheres Ergebnis; ersetze es gern durch deinen eigenen Text.'
