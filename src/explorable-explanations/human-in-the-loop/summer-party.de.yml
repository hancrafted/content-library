            Vier Kacheln: die Kennzahlen aus der Notiz.
            ## Ziel
            Das Ziel in einem oder zwei Sätzen.
            ## Der Plan
            Eine Zeile pro Epic, das Epic in der Vertiefung markiert, mit dem Grund, warum es zuerst kommt.
            ## Epic im Detail
            Die Bedürfnisse, dann die Akzeptanzkriterien jeweils mit farbigem Status, die Tickets mit recherchiert oder als Nächstes und die Ergebnisse als Karten oder Tabelle.
            ## Was es kostet
            Die Kostentabelle, mit der bekannten Summe hervorgehoben und dem, was sie vom Budget übrig lässt.
            ## Risiken und offene Entscheidungen
            Höchstens drei, in hervorgehobenen Kästen.
            ## Quellen
            Jeder Link aus der Notiz, klein, ganz unten.
