              techniques: [out-of-scope]
              text: 'Suche nicht und wähle keinen Anbieter, keinen genauen Tag und keinen Preis: Je ein frischer Chat pro Ticket findet das im nächsten Schritt. Die anderen Epics des Plans warten.'
