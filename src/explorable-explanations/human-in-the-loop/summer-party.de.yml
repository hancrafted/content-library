                /grilling Befrage mich zu dem Epic, das in diesem Plan unter Vertiefung genannt ist, in Runden, höchstens drei Fragen pro Runde und höchstens {{limit.questions}} insgesamt, jede mit einer empfohlenen Antwort, so formuliert, dass mein "ja" sie annimmt, und nur zu Entscheidungen, die dieses Epic ändern, jede so konkret geklärt, dass sie für eine Websuche taugt (eine genannte Stadt, eine Zahl, ein Zeitraum); eine Wahl, die erst Fakten braucht, zum Beispiel ein Anbieter oder ein genauer Tag, wird ein Ticket. Wenn ich "fertig" schreibe, schreibe seine Anforderungen: Bedürfnisse N1 … als User Stories, Akzeptanzkriterien A1 (N1) …, die sich mit Ja oder Nein abhaken lassen, und höchstens {{limit.tickets}} Tickets als H3 unter Tickets, das wichtigste zuerst, jedes eine Frage, die ein frischer Chat mit Websuche allein beantworten kann, die nach Fakten fragt, nach denen kein anderes Ticket fragt, mit einer Zeile darunter.

