                - Rahmenbedingungen enthält die Zahlen aus dem Plan, die dieses Epic einhalten muss, und Entscheidungen enthält, was ich in diesem Interview entschieden habe.
                - Unter Tickets stehen höchstens {{limit.tickets}} H3, jedes mit einer Zeile darunter; keines braucht die Antwort eines anderen Tickets, und keine zwei fragen nach denselben Fakten.
                - Alles stammt aus dem Plan oder meinen Antworten.
                Ein zweiter Chat prüft das Ergebnis anhand dieser Punkte.
            - heading: Nicht im Umfang
