          techniques: [delimiters, research, done-looks-like]
          example: &note_example |
            # Sommerfest 2027
            ## Ziel
            Alle fünf Standorte für einen Tag und einen Abend im nächsten Sommer zusammenbringen, damit sich Kolleginnen und Kollegen, die sonst in Calls zusammenarbeiten, persönlich treffen.
            ## Kennzahlen
            - 200 Gäste von 5 Standorten
            - Riverside Hall fasst 250, davon 600 m² überdacht
            - Etwa 38.000 € bisher bekannt von 60.000 €
            ## Epics
            - Ort und Termin: ein Ort für 200 mit Regenschutz, an einem Freitag, der allen Standorten passt (Vertiefung)
            - Anreise und Übernachtung: 200 Menschen hinbringen und je eine Hotelnacht
            - Essen und Getränke: Catering für 200, einschließlich besonderer Ernährungswünsche
            - Programm: ein Nachmittag, der die Standorte mischt, und Musik am Abend
            ## Epic im Detail
            Ort und Termin, weil Anreise, Essen und Programm alle davon abhängen, wo und wann. Entschieden: Das Fest findet in Lyon statt.
            ## Bedürfnisse
            - N1. Als Kollegin oder Kollege aus jedem Standort möchte ich am Tag dort sein, damit mich das keinen zusätzlichen Urlaubstag kostet.
            - N2. Als Organisatorin möchte ich Platz für 200 draußen und überdacht, damit Regen den Abend nicht absagt.
            - N3. Als Elternteil möchte ich einen Termin vor den Schulferien, damit ich kommen kann.
            - N4. Als Finanzabteilung möchte ich das ganze Fest im Budget.
            ## Akzeptanzkriterien
            - A1 (N1). Jeder Standort mit dem Zug in höchstens 4½ Stunden: nicht erfüllt, Leeds, Leipzig und Linz brauchen länger.
            - A2 (N2). Platz für 200 unter Dach: erfüllt von Riverside Hall.
            - A3 (N3). Vor den Schulferien jedes Standorts: noch nicht geprüft.
            - A4 (N4). Unter 60.000 €: offen, der Preis des Orts ist auf Anfrage.
            ## Tickets
            - Orte in die engere Wahl nehmen: recherchiert
            - Anreise von jedem Standort: recherchiert
            - Den Freitag wählen: als Nächstes
            ## Ergebnisse
            | Punkt | Wert | Quelle |
            |---|---|---|
            | Riverside Hall | 250 stehend, 600 m² überdacht, Preis auf Anfrage | Website der Riverside Hall |
            | Harbour Loft | 220 stehend, alles drinnen, Preis auf Anfrage | Website des Harbour Loft |
            | Garden Court | Innenhof für 120, ab 4.500 € | Website des Garden Court |
            | Leeds nach Lyon | 5 h 40 mit dem Zug, ab 89 € einfache Fahrt | Bahnbetreiber |
            | Lissabon nach Lyon | 2 h 15 mit dem Flugzeug, ab 65 € einfache Fahrt | Fluggesellschaft |
            ## Kosten
            | Punkt | Summe | Wie wir darauf kamen | Quelle |
            |---|---|---|---|
            | Anreise, hin und zurück, 40 pro Standort | etwa 12.500 € | günstigste gefundene Preise, verdoppelt, mal 40 | Recherche-Ergebnisse |
            | Hotel, eine Nacht, 200 Zimmer | etwa 20.000 € | 100 € pro Nacht | Hotelpreisseite |
            | Essen für 200 | ab 6.000 € | ab 30 € pro Person | Website des Caterers |
            | Veranstaltungsort | auf Anfrage | | Website der Riverside Hall |
            | Bisher bekannt | etwa 38.500 € | lässt etwa 21.500 € von 60.000 € übrig | |
            ## Risiken und offene Entscheidungen
            - Der Preis des Orts: Bei der Riverside Hall ein Angebot einholen, bevor Lyon feststeht.
            - Drei Standorte brauchen über 4½ Stunden: am Vortag anreisen oder fliegen.
            - Der Termin: Das dritte Ticket muss noch Schulferien und große Veranstaltungen prüfen.
            ## Quellen
            - Website der Riverside Hall: https://example.com/riverside-hall/events
            - Website des Harbour Loft: https://example.com/harbour-loft
            - Website des Garden Court: https://example.com/garden-court/private-hire
            - Bahnbetreiber, Leeds nach Lyon: https://example.com/rail/leeds-lyon
            - Fluggesellschaft, Lissabon nach Lyon: https://example.com/air/lis-lys
            - Hotelpreisseite: https://example.com/hotels/lyon
            - Website des Caterers: https://example.com/caterer/lyon
          goodLooksLike:
