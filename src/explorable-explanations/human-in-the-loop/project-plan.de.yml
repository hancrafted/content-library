  task: |
    # <Die Aufgabe>
    ## Ziel
    ## Zielgruppe
    ## Rahmen
    ## Fertig heißt
  scope: |
    # <Die Aufgabe>
    ## Fragen und Antworten
    ## Offene Entscheidungen
  plan: |
    # <Titel des Plans>
    ## Ziel
    ## Epics
    ### <Titel des Epics>
    ## Offene Entscheidungen
  grill: |
    # <Das Epic>
    ## Fragen und Antworten
    ## Offene Entscheidungen
  spec: |
    # <Das Epic>
    ## Ziel
    ## Anforderungen
    ## Nicht dabei
    ## Abhängigkeiten
  requirements: |
