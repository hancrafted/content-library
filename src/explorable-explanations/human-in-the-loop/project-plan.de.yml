                Das ist eine Runde von mehreren. Arbeite nur an dem Epic unten.

                ```markdown
                {{item}}
                ```

                Die Fragen und Antworten dieses Epics:

                ```markdown
                {{grill}}
                ```

                Der ganze Plan, damit du Abhängigkeiten zu anderen Epics nennen kannst:

                ```markdown
                {{plan}}
                ```
            - heading: Schritte
              purpose: steps
              text: |
                1. Ziel: ein Satz dazu, was dieses Epic erreicht.
                2. Anforderungen: die Muss-Punkte aus den Antworten, eine kurze Zeile je Punkt, sodass sich jeder mit Ja oder Nein abhaken lässt. Füge keine hinzu, die nicht gesagt wurden.
                3. Nicht dabei: was die anderen Epics übernehmen.
                4. Abhängigkeiten: was dieses Epic von einem anderen braucht, oder was ein anderes von ihm braucht.
            - heading: Übungslauf
