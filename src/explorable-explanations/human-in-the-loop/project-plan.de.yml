            label: Dein Plan
            sample: *plan_example
          - id: grill
            mode: single
            label: Das Befragungsergebnis dieses Epics
            sample: *grill_1_example
        details:
          why: Die Antworten werden zu einer kurzen Liste von Anforderungen, die sich jeweils mit Ja oder Nein abhaken lassen. Die Spezifikation nennt auch, wovon das Epic abhängt, damit die nächste Stufe sieht, wie die Teile zusammenpassen.
          techniques: [delimiters, fresh-context, separate-verification]
          example:
            - &spec_1_example |
              # Termin und Ort
              ## Ziel
              Einen Tag im nächsten Sommer und einen Ort festlegen, den 200 Menschen erreichen.
              ## Anforderungen
              - Ein Tag, drinnen mit Außenbereich
              - Höchstens eine Stunde vom Flughafen
