              - Anreise und Unterkunft hängen von Termin und Ort ab
            - &spec_2_example |
              # Anreise und Unterkunft
              ## Ziel
              200 Menschen von 5 Standorten zum Ort und zurück bringen, mit einer Übernachtung.
              ## Anforderungen
              - Die Firma bucht die Reise zentral
              - Zug bis 6 Stunden, darüber Flugzeug
              - Eine Nacht im Hotel, ein Einzelzimmer für Führungskräfte und Menschen mit gesundheitlichem Bedarf
              - Keine Kinder
              ## Nicht dabei
              - Termin und Ort sowie das Programm
              ## Abhängigkeiten
              - Braucht Ort und Termin aus Termin und Ort
          goodLooksLike:
            - Jede Anforderung ist kurz und lässt sich mit Ja oder Nein abhaken.
            - In der Spezifikation steht nichts, was die Antworten nicht sagten.
            - Abhängigkeiten nennen die anderen Epics, nicht Aufgaben.
        instructions: 'Öffne für jedes Epic einen neuen Chat und füge den Prompt mit diesem Epic ein. Prüfe, dass sich jede Anforderung mit Ja oder Nein abhaken ließe, und kopiere dann das Ergebnis.'
        do:
          simple:
            - heading: Deine Rolle
              purpose: role
