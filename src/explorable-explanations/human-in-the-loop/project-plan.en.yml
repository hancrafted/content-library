          techniques: [delimiters, separate-verification]
          example: &combined_example |
            # Summer party results
            ## Results
            - Venue request: ready to send, for 200 guests, one day, at most one hour from an airport
            - Dates: two candidates, the third week of June and the first week of July
            - Travel rules: central booking, train up to 6 hours, plane above
            - Hotel request: ready to send, one night for 200 guests
            ## Numbers
            | Item | Value |
            |---|---|
            | Guests | 200 |
            | Days | 1 |
            | Nights | 1 |
