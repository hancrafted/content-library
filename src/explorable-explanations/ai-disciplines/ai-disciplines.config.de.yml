presets:
  timeline:
    autoplay: false
    lit: null
  recap:
    autoplay: false
    lit: workflows
words:
  comparable: Vergleichbar mit
  definition: Definition
  flip: 'Klicken: Definition'
  source: Quelle
  newTab: öffnet in neuem Tab
  playAll: Alle abspielen
  disciplines:
    prompting:
      year: 2022–23
      name: Prompting
      line: Ihr schreibt, die KI antwortet. Der Einstieg.
      scale: einer Aufgabe
      interface: Chat
      interfaceHint: 'ein Gespräch: Sie schreiben, es antwortet, Nachricht für Nachricht'
      definition: Prompting heißt, dem Modell wirksame Anweisungen zu schreiben, damit es verlässlich liefert, was ihr braucht.
      sourceLabel: OpenAI, Prompt-Engineering-Leitfaden
      sourceUrl: https://developers.openai.com/api/docs/guides/prompt-engineering
    agents:
      year: 2024–25
      name: Agenten
      line: Die KI nutzt Werkzeuge und arbeitet in einer Schleife.
      scale: einer Fachkraft
      interface: Harness
      interfaceHint: 'die Software drumherum: Rechte, Werkzeuge, eine Schleife bis zum Ziel'
      definition: Ein Agent ist ein Sprachmodell, das Werkzeuge in einer Schleife nutzt und selbst entscheidet, wie es ein Ziel erreicht.
      sourceLabel: Anthropic, Building effective agents (2024)
      sourceUrl: https://www.anthropic.com/engineering/building-effective-agents
    workflows:
      year: 2024–25
      name: Workflows
      line: Mehrere Agenten, Schritt für Schritt nach Plan.
      scale: einem Team
      interface: Ablaufplan
      interfaceHint: ein Graph aus Agenten, mit dem Menschen in oder an der Schleife
      definition: Ein Workflow verkettet Modell- und Werkzeugschritte nach einem vorher festgelegten Ablauf.
      sourceLabel: Anthropic, Building effective agents (2024)
      sourceUrl: https://www.anthropic.com/engineering/building-effective-agents
    factory:
      year: 2026 → · entsteht
      name: Factory?
      line: Anfragen rein, Ergebnis raus. Wie es innen aussieht, ist offen.
      scale: einer Organisation
      interface: End-to-End
      interfaceHint: Kundenanfragen rein, Magie passiert, Ergebnisse raus, 24/7/365
      definition: 'Eine Factory macht aus Anforderungen Software, als Blackbox: Agenten arbeiten die ganze Strecke ab, kein Mensch schreibt oder prüft jeden Schritt.'
      sourceLabel: Shapiro, The Five Levels (2026)
      sourceUrl: https://www.danshapiro.com/blog/2026/01/the-five-levels-from-spicy-autocomplete-to-the-software-factory/
  scenes:
    prompt: Fasse diesen Bericht in 3 Punkten zusammen.
    answer: 'Gern: 1. … 2. … 3. …'
    agentPrompt: Plane die Messe-Anreise fürs Team.
    tool1: Web öffnen
    tool2: Flüge suchen
    agentAnswer: Drei Optionen, günstigste zuerst.
    loop: Schleife
    loopDone: fertig
    agent: Agent
    factory: Eine Fabrik mit Fragezeichen, Anfragen gehen hinein, Ergebnisse kommen heraus
  llm:
    kicker: Das Fundament, unter jeder Stufe
    name: Large Language Model (LLM)
    before: Es sagt
    token: Token
    after: für Token voraus, welches Wortstück am wahrscheinlichsten als Nächstes folgt, gelernt aus riesigen Mengen Trainingstext. ChatGPT, Copilot, Claude.
    tokenGloss: 'Ein Token ist ein Wortstück, etwa „Fach“ + „kraft“. Modelle lesen und schreiben Text in Tokens.'
    definition: Ein großes Sprachmodell ist ein KI-Modell, mit riesigen Textmengen trainiert, das Text Token für Token fortsetzt und sich allein durch Text anweisen lässt.
    sourceLabel: Brown et al. 2020, „Language Models are Few-Shot Learners“
    sourceUrl: https://arxiv.org/abs/2005.14165
    tokens: [Neue, Tech, nik, bringt, neue, Dis, zi, plinen]
