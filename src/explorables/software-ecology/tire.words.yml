name: Tire swing
sub: Seven roles as most software firms run them, and one Customer. Requests go to Sales, Product management or Support; Operations releases back to the Customer.
belts:
  customer-sales: { label: new customer }
  customer-pm: { label: feature or change request }
  customer-support: { label: bug or support ticket }
  sales-pm: { label: deal + promised scope, back: what did we promise? }
  sales-ba: { label: requirements, back: what did you mean? }
  pm-ba: { label: brief, back: open questions }
  ba-eng: { label: spec, back: clarification }
  support-eng: { label: bug report, back: cannot reproduce }
  support-customer: { label: answer }
  eng-qa: { label: pull request, back: changes requested }
  qa-ops: { label: tested change, back: does not deploy }
  ops-customer: { label: release }
customer: { title: Customer, job: Sends requests and receives releases and answers }
