# Die Spalte Modell im Einstellungs-Popover: die Einstellungen der ganzen Fabrik, jede mit einem Tooltip, was sie bewirkt.
model:
  reality: Realitätsnähe
  ideal: Ideal
  realistic: Realistisch
  realityText: 'Realistisch {n} %'
  ai: KI
  off: Aus
  everywhere: Überall
  company: Unternehmen
  service: Dienstleister
  product: Produktunternehmen
  aiq: Qualitätseffekt der KI
  worse: Schlechter
  same: Gleich
  better: Besser
  note: 'Rate, Anfragemix und Folgewahrscheinlichkeiten des Kunden stehen auf seiner Karte: klickt links auf den Kunden.'
  reset: Auf Standard zurücksetzen
  tips:
    reality: 'Von Ideal zu Realistisch: senkt Effizienz und Effektivität jedes Arbeitsplatzes auf seine realistischen Werte. Mehr schlechte Dokumente gehen hinaus, werden zurückgeschickt oder vervielfachen sich; der Engpass läuft nahe 90 % ausgelastet.'
    ai: 'Wo KI arbeitet: diese Arbeitsplätze laufen schneller (2,5×, solange ein Dashboard nichts anderes sagt) und schreiben vielleicht zusätzliche Aufgaben; KI-Dokumente brauchen am nächsten Arbeitsplatz etwas länger zum Lesen. Beschleunigung und Zusatzaufgaben stellt Ihr pro Arbeitsplatz in seinem Dashboard ein.'
    company: 'Dienstleister: nur der Kunde fragt Arbeit an. Produktunternehmen: das Produktmanagement schreibt zusätzlich Roadmap-Punkte, der Vertrieb bringt Leads und die Entwicklung schreibt Tickets zu technischen Schulden. Sie teilen dieselben Rückstände; jeder Arbeitsplatz wird neu bemessen, damit Ideal bei 70 % Auslastung bleibt.'
    aiq: 'Was KI mit der Chance macht, dass ein Dokument gut hinausgeht: Schlechter senkt sie um 15 Punkte, Besser hebt sie um 15. Gleich lässt sie.'
    reset: 'Zurück zu dem, was die Anwendungsfall-Datei für diesen Zustand festlegt: Einstellungen, Tempo und Anzeige.'
# Die Spalte Anzeige im Einstellungs-Popover: wie die Fabrik gezeichnet wird.
display:
  beltMotion: Bandbewegung
  beltMotionNote: Die Lamellen der Bänder bewegen sich. Aus ist ruhiger; die Dokumente wandern trotzdem.
  pile: Stau hinter dem Regal
  pileTip: 'Wie sich Dokumente hinter einem vollen Regal stauen. Fahrt über einen Stil, um ihn zu sehen.'
  piles:
    heap:
      name: Kippender Haufen
      note: Dokumente fallen am Bandende auf einen Haufen und kommen schräg zur Ruhe
    stack:
      name: Schiefer Stapel
      note: ein Blattstapel wächst am Bandende in die Höhe, neigt sich und schwankt ein wenig
    drift:
      name: Verwehung
      note: Dokumente verstreuen sich um das Bandende und zittern, wie eine Schneewehe an einer Wand
# Das Dashboard eines Arbeitsplatzes: ein Monitor, die Regler in den Einstellungen verstaut.
dash:
  own:
    title: Eigene Arbeit
    tip: 'Tickets, die diese Abteilung sich selbst schreibt, nicht für einen Kunden: eine Roadmap, Leads, technische Schulden. Sie reihen sich in dieselbe Warteschlange ein wie Kundenanfragen, wer zuerst kommt, wird zuerst bearbeitet. Nur ein Produktunternehmen hat sie; ein Dienstleister schaltet sie alle ab.'
    help: 'Über {name}'
    rate: Tickets pro Woche
    rateTip: 'Wie viele eigene Tickets diese Abteilung pro Woche schreibt, 0 bis 50. 0 schaltet sie ab. Der Wert der Datei ist der Startwert; „Auf Standard zurücksetzen“ stellt ihn wieder her.'
    perWeek: '{n} pro Woche'
    arrivals: Eintreffen
    arrivalsTip: 'Gleichmäßig: ein Ticket alle 1/Rate einer Woche, im festen Takt. Zufällig: im Schnitt gleich viele, aber mal gehäuft, mal dünn, wie echte Tickets.'
    steady: Gleichmäßig
    random: Zufällig
    emit: Aufgabe auslösen
    emitTip: Legt jetzt ein eigenes Ticket in den Rückstau dieses Arbeitsplatzes
  help: Diagramme erklären
  close: Schließen
  closeTip: Schließen (Esc)
  ai: KI
  aiTip: KI beschleunigt diesen Arbeitsplatz (2,5×, solange Ihr es unten nicht ändert) und lässt ihn vielleicht Zusatzaufgaben schreiben; KI-Dokumente brauchen am nächsten Arbeitsplatz etwas länger zum Lesen. Ihren Qualitätseffekt stellt Ihr im Modell ein.
  lightTip: 'Grün: kommt hinterher. Gelb: eine Woche Arbeit oder mehr wartet, viel Arbeit kommt zurück, schlechte Arbeit geht ungelesen durch, oder er wartet meist auf Arbeit. Rot: zwei Wochen Arbeit oder mehr warten, oder er ist blockiert.'
  status: 'Status {level}: {signals}'
  levels:
    red: rot
    amber: gelb
    green: grün
  signals:
    backing: 'Blockiert: fertige Arbeit kommt nicht weg, der nächste Arbeitsplatz ist voll'
    bottleneck: 'Engpass: {n} Wochen Arbeit warten'
    overloaded: 'Ausgelastet: {n} Wochen Arbeit warten'
    rework: 'Viel Nacharbeit: {n} % seiner Arbeit kommen zurück'
    unread: 'Ungelesen durchgewinkt: schlechte Arbeit geht ungeprüft durch'
    starved: 'Leerlauf: wartet meist auf Arbeit'
    ok: Kommt hinterher
  grows: 'Sein Rückstand wächst um etwa {n} Aufträge pro Woche. Hebt seine Effizienz oder schickt ihm weniger.'
  clearsWeek: In diesem Tempo ist sein Rückstand in etwa einer Woche abgebaut. Mehr Effizienz baut ihn schneller ab.
  clearsWeeks: 'In diesem Tempo ist sein Rückstand in etwa {n} Wochen abgebaut. Mehr Effizienz baut ihn schneller ab.'
  trends:
    out:
      title: Ausstoß
      unit: pro Woche
      help: Erledigte Aufträge pro Woche. Die gestrichelte Linie ist Ideal.
    good:
      title: Ergebnis
      unit: '% gut'
      help: Anteil dessen, was er weitergibt, der gut ist. Die gestrichelte Linie ist 100 %.
    wait:
      title: Wartet
      unit: Wochen Arbeit
      help: 'Wochen Arbeit, die warten: der Rückstand geteilt durch das, was dieser Arbeitsplatz in einer Woche schafft. Gelb ab einer Woche, rot ab zwei.'
  settings: Einstellungen
  withAi: '{set} → {eff} mit KI'
  rows:
    eff:
      label: Effizienz
      sub: · Ausstoß
      help: 'Effizienz ist Ausstoß: wie schnell dieser Arbeitsplatz ein Dokument fertigstellt, 10 % bis 1000 %. Schneller hilft nur, wenn Arbeit auf ihn wartet; dann wandert der Engpass weiter.'
    effv:
      label: Effektivität
      sub: · Ergebnis
      help: 'Effektivität ist Ergebnis: die Chance, dass ein Dokument gut hinausgeht, unter den Bedingungen hier (Zeit, Werkzeuge, klarer Input).'
    fan:
      label: Weitergegebene Aufgaben pro Aufgabe
      sub: ''
      help: 'Weitergegebene Aufgaben pro Aufgabe: jedes Dokument ist eine Aufgabe, also sind das die Aufgaben, die eine erledigte Aufgabe weiter unten erzeugt. Mehr Aufgaben heißt mehr Arbeit am nächsten Arbeitsplatz.'
    aiSpeed:
