      help: 'Zusatzaufgaben pro Aufgabe mit KI: 1× gibt weiter, was er ohnehin weitergäbe; 2× gibt doppelt so viele Aufgaben weiter (mehr Pull Requests, mehr Dokumente) an den nächsten Arbeitsplatz.'
  flows: Wie es fließt
  flowsSub: für Warteschlangen-Interessierte
