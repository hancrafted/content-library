                First answer with the numbered fixes and your questions, as a plain list. After my answer, answer with two code blocks and nothing between them. First the whole new page in one block that starts with ```html. Then a note in one block that starts with ```markdown, using exactly the headings of this template, in this order. Below the blocks, write exactly: "Save the first block as quiz.html and open it in your browser." If your answer breaks off, I will start a new chat and paste this prompt again.

                {{template}}
          technical:
            - heading: Task
              purpose: task
              text: |
                I played `.scratch/task/quiz.html`; my notes are below. Turn every note into fixes numbered F1, F2 … each one sentence saying what changes, and ask at most three questions, with a recommendation each, about notes too vague to fix; then wait for my answer. After it, apply every agreed fix to `quiz.html`, F1 first, and nothing else; take any new wording or quote from the passages in `build-note.md`, character for character with its P number, and keep it one file. Write my notes character for character and what you did to `.scratch/task/quiz-note.md` and open the quiz in my browser.

                ```text
                {{notes}}
                ```
            - heading: Out of scope
              purpose: scope
              text: *out_of_scope_playtest
            - heading: Practice run
              purpose: scope
              only: demo
