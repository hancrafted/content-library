              text: |
                /writing-for-agents Schreibe einen Skill namens `source-to-quiz` nach `.agents/skills/source-to-quiz/SKILL.md`, mit einer Kopie in `.claude/skills/source-to-quiz/`. Lerne aus `grill-plan.md`, `spec.md`, `fixes.md` und `quiz-note.md` in `.scratch/<quiz-slug>/`: Der Skill macht aus jeder URL und jedem PDF in einem Rutsch ein Quiz wie dieses, und jede Korrektur wird zu einer Lehre. Seine Schritte zitieren Passagen immer wörtlich, befragen in einer Runde und warten und enden mit einem Durchklicken des Quiz als Spieler; Optionen sind Knöpfe, beim Laden gemischt. Gib ihm Front Matter mit `name` und einer `description`, die den Auslöser nennt. Lass alles weg, was nur für diese Quelle gilt.
            - heading: Voller Durchlauf
