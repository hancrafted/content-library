                {{quiz}}
                ```
            - heading: Schritte
              purpose: steps
              techniques: [meta-prompting]
              text: |
                1. Schreibe einen Skill, dem ein anderer Chat folgt, um aus jeder Quelle in einem Rutsch ein Quiz wie dieses zu machen.
                2. Schreibe unter Wann einsetzen einen Satz, der den Auslöser nennt: eine Quelle und der Wunsch nach einem Quiz.
                3. Schreibe unter Schritte diese nummerierten Schritte, in dieser Reihenfolge, und ergänze bei jedem, was dieser Durchlauf gelehrt hat: (1) die ganze Quelle lesen und Passagen wörtlich zitieren, nummeriert P1, P2; (2) mich in einer Runde von höchstens fünf Fragen zu den Kategorien des Plans befragen, jede mit einer empfohlenen Antwort, dann auf meine Antworten warten; (3) die Lernziele schreiben, jedes mit seinen Passagen; (4) die Fragen pro Ziel schreiben, jede mit einer Begründung und einer zitierten Passage; (5) das HTML bauen.
                4. Schreibe unter Die Quiz-Datei, was jedes Quiz haben muss, aus der Spezifikation und den Korrekturen genommen, und immer dies: eine Datei, die sich per Doppelklick öffnet, Optionen als Knöpfe, bei jedem Laden gemischt, ein Zitat nach jeder Antwort und ein Durchgang durch den Code als Spieler (Start, Antwort, Weiter, Ende, Wiederholung), bevor die Datei übergeben wird.
                5. Schreibe unter Fertig heißt Zeilen, die ein Leser prüfen kann. Mach unter Lehren aus meinem ersten Quiz aus jeder Korrektur eine allgemeine Lehre.
                6. Schreibe jede Zeile als das, was zu tun ist, in den wenigsten Worten, die es noch sagen. Prüfe jede Zeile: Gilt sie auch für ein Quiz über ein Kochrezept? Wenn nicht, streich sie oder mach sie allgemein.
            - heading: Woran du siehst, dass du fertig bist
              purpose: task
              text: |
                - Die Schritte führen von einer Quelle zu einem fertigen Quiz, ohne die Dateien dieses Durchlaufs zu brauchen.
                - Jede Korrektur taucht als Lehre oder unter Die Quiz-Datei auf.
                - Er enthält nichts, was nur für diese eine Quelle gilt.
            - heading: Nicht im Umfang
              purpose: scope
              text: &out_of_scope_skill 'Mach jetzt kein Quiz: Der nächste Chat probiert den Skill an einer neuen Quelle aus.'
            - heading: Übungslauf
              purpose: scope
              only: demo
              techniques: [simplest-first]
              text: *practice
            - heading: Format
              purpose: template
              text: *format
          technical:
