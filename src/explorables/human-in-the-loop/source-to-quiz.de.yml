        details:
          why: Ein Skill bewahrt, was du gelernt hast, damit das nächste Quiz dort beginnt, wo dieses endete. Deine Spezifikation wird zu seinen Regeln, deine Korrekturen werden zu seinen Lehren, und der nächste Chat macht nicht dieselben Fehler.
          techniques: [meta-prompting]
          example: &skill_example |
            # Von der Quelle zum Quiz
            ## Wann einsetzen
            Wenn dir jemand eine Webseite oder ein PDF gibt und ein Quiz will, um es zu lernen.
            ## Schritte
            1. Lies die Quelle vollständig und zitiere 15 Passagen, jede Zeichen für Zeichen kopiert, nummeriert P1 bis P15.
            2. Wähle drei Lernziele aus ihren Hauptabschnitten, jedes etwas, das der Spieler danach kann, mit den Passagen, auf denen es beruht.
            3. Schreibe vier Fragen pro Ziel, von leicht bis schwer, jede mit einer Begründung und einer zitierten Passage.
            4. Baue quiz.html so, wie es Die Quiz-Datei sagt.
            5. Geh es als Spieler durch (Start, Antwort, Weiter, Ende, Wiederholung), repariere, was kaputtgeht, und sag dann: "Speichere das als quiz.html und öffne es in deinem Browser."
            ## Die Quiz-Datei
            - Eine Datei mit ihrem CSS und JavaScript darin; eine CDN-Bibliothek ist erlaubt.
            - Jeder Text des Quiz steht in einem JSON-Datenblock aus Strings in doppelten Anführungszeichen, korrekt maskiert.
            - Optionen sind Knöpfe, bei jedem Laden gemischt.
            - Punkte mit Serienbonus, ein Fortschrittsbalken, Feedback mit dem Zitat nach jeder Antwort, Sterne pro Ziel, eine Wiederholung der verpassten Fragen.
            - Antwortknöpfe mindestens 48 Pixel hoch; hell oder dunkel, wie das Gerät eingestellt ist.
            ## Fertig heißt
            - Jede Antwort zitiert eine Passage der Quelle.
            - Das Quiz öffnet sich per Doppelklick und funktioniert auf dem Handy.
            ## Lehren aus meinem ersten Quiz
            - Mische die Optionen: Die richtige Antwort landete immer wieder auf B.
            - Mach die Knöpfe hoch genug für einen Daumen.
          goodLooksLike:
            - Die Schritte führen von einer Quelle zu einem fertigen Quiz, ohne die Dateien dieses Durchlaufs zu brauchen.
            - Jede Regel der Spezifikation taucht in den Schritten oder unter Die Quiz-Datei auf.
            - Jede Korrektur deines Durchlaufs taucht als Lehre oder unter Die Quiz-Datei auf.
            - Er enthält nichts, was nur für diese eine Quelle gilt.
        instructions: 'Öffne einen neuen Chat, füge den Prompt mit deiner Spezifikation und deiner Quiz-Notiz in den Feldern ein und kopiere den Skill. Speichere ihn als SKILL.md.'
