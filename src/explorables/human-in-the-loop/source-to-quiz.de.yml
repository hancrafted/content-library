              only: demo
              techniques: [simplest-first]
              text: *practice_grill
            - heading: Fragen
              purpose: steps
              text: &grill_options 'Nummeriere die Fragen Q1, Q2, … über alle Runden. Jede Frage bietet 2 oder 3 wirklich verschiedene Alternativen, nummeriert 1, 2, 3, je eine Zeile, dann "etwas anderes", und deine Empfehlung, die eine davon nennt; gib die Alternativen auch dort, wo der Skill eine offene Frage stellen würde. Ich antworte wie "Q1:2 Q2:1" oder "ja" für alle deine Empfehlungen.'
