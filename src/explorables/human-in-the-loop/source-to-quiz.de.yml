            - heading: Schritte
              purpose: steps
              techniques: [meta-prompting]
              text: |
                1. Schreibe einen Skill, dem ein anderer Chat folgt, um aus jeder Quelle in einem Rutsch ein Quiz zu machen, das die Spezifikation erfüllt, ohne mich etwas zu fragen.
                2. Schreibe unter Wann einsetzen einen Satz, der den Auslöser nennt: eine Quelle und der Wunsch nach einem Quiz.
                3. Schreibe unter Schritte diese nummerierten Schritte, in dieser Reihenfolge, mit den Regeln der Spezifikation in jedem: (1) die ganze Quelle lesen und Passagen zitieren, nummeriert P1, P2, jede Zeichen für Zeichen kopiert als ein zusammenhängendes Stück, nie gekürzt oder zusammengefügt; (2) die Lernziele wählen, jedes mit seinen Passagen; (3) die Fragen pro Ziel schreiben, jede mit einer Begründung und einer zitierten Passage; (4) das HTML bauen; (5) es als Spieler durchgehen (Start, Antwort, Weiter, Ende, Wiederholung) und reparieren, was kaputtgeht, bevor es übergeben wird.
                4. Schreibe unter Die Quiz-Datei, was jedes Quiz haben muss, aus der Spezifikation und den Korrekturen genommen, und immer dies: eine Datei, die sich per Doppelklick öffnet, jeder Text des Quiz in einem JSON-Datenblock aus Strings in doppelten Anführungszeichen, korrekt maskiert, Optionen als Knöpfe, bei jedem Laden gemischt, ein Zitat nach jeder Antwort.
                5. Schreibe unter Fertig heißt Zeilen, die ein Leser prüfen kann. Mach unter Lehren aus meinem ersten Quiz aus jeder Korrektur eine allgemeine Lehre.
                6. Schreibe jede Zeile als das, was zu tun ist, in den wenigsten Worten, die es noch sagen. Prüfe jede Zeile: Gilt sie auch für ein Quiz über ein Kochrezept? Wenn nicht, streich sie oder mach sie allgemein.
