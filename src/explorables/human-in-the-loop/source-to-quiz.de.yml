                ```
            - heading: Schritte
              purpose: steps
              techniques: [cite-sources, allow-unknown, few-shot]
              text: |
                1. Schreibe {{limit.questions}} Fragen, die dieses Lernziel prüfen, als H3, nummeriert Q1, Q2 und so weiter, in den Arten, die die Spezifikation nennt.
                2. Liste unter jeder die Optionen als "- A) …" auf, markiere die eine richtige Antwort mit "(richtig)" und mach die falschen glaubwürdig. Halte die Optionen etwa gleich lang und formuliere die richtige in deinen eigenen Worten, nie in denen des Zitats, damit das Zitat die Antwort erklärt, statt sie zu verraten.
