                Schreibe die Spezifikation nach `.scratch/task/spec.md`, aus den Entscheidungen dieses Grills und nicht aus dem Rest des Gesprächs. Nimm immer Punkte, einen Fortschrittsbalken, einen Endbildschirm, Feedback mit der Begründung und der Zeichen für Zeichen kopierten Passage und eine HTML-Datei auf, die sich per Doppelklick öffnet, mit jeder Antwortoption als Knopf. Beende jede Zeile mit ihrer Herkunft: (Ziel) für Zweck, (Q3) für eine Antwort, (Mindestumfang) für einen Punkt oben; schreibe "offen: <was>", wo eine Antwort fehlt, und erfinde keine Zahlen. Schreibe nur spec.md, in der Vorlage unten statt in den eigenen Abschnitten des Skills.
