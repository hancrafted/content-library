          techniques: [cite-sources, allow-unknown, delimiters]
          example: &build_example |
            # Quiz: Was agentische Workflows von Menschen und Organisationen verlangen
            ## Quelle
            Episodenseite auf hancrafted.net, vollständig gelesen: https://hancrafted.net/de/episodes/what-agentic-workflows-require/
            ## Passagen
            P1. "Ein Agent ist ein Sprachmodell, das Werkzeuge in einer Schleife nutzt und selbst entscheidet, wie es ein Ziel erreicht." (Was ein Agent ist)
            P2. "Drei Stufen menschlicher Aufsicht, gewählt pro Aufgabe: Derselbe Workflow hält einen Menschen bei einer Aufgabe in der Schleife, bei einer anderen an der Schleife und bei einer dritten außerhalb." (In, an oder außerhalb der Schleife)
            P3. "Rückwärtsdenken beginnt beim Ziel und zerlegt es in das, was vorher wahr sein muss, bis es dort ankommt, wo Du heute stehst." (Vom Ziel aus rückwärts planen)
            P4. "Vereinbare, was eine Aufgabe erhält und liefert, nicht wie sie innen erledigt wird." (Verträge an den Nahtstellen)
            P5. "Verifikation prüft ein Ergebnis gegen seinen Vertrag; Validierung prüft es gegen das Ziel." (Das Ergebnis prüfen)
            P6. "Conways Gesetz: Was Menschen entwerfen, bildet ab, wer mit wem spricht, und ein Workflow, den Menschen für sich selbst zeichnen, ist auch ein Entwurf." (Die Organigramm-Falle)
            ## Was es kann
            - 6 Fragen in 3 Lernzielen, Optionen bei jedem Laden gemischt
            - Punkte mit Serienbonus, ein Fortschrittsbalken, Sterne pro Ziel, eine Wiederholung der verpassten Fragen
            - Jede Antwort mit ihrer zitierten Passage erklärt
            ## Bekannte Lücken
            - Der beste Punktestand geht verloren, wenn der Browser den Speicher blockiert
