          example:
            - &questions_1_example |
              # Anforderungen präzise und genau schreiben
              ## Fragen
              ### Q1. Wann ist ein Dokument präzise?
              - A) Wenn es lang ist und jedes Detail abdeckt
              - B) Wenn jemand anderes es ohne Rückfrage an dich umsetzen könnte (richtig)
              - C) Wenn das Ergebnis das eigentliche Problem löst
              - D) Wenn es die richtigen Fachbegriffe verwendet
              Warum: Präzision lässt nichts zu raten; das eigentliche Problem zu lösen ist Genauigkeit.
              Zitat: "Ein Dokument ist präzise, wenn jemand anderes es umsetzen könnte, ohne Dir eine einzige Frage zu stellen." (P1)
              ### Q2. Ein enger Pfeil-Cluster weit weg vom Bullseye ist …
              - A) Präzise und genau
              - B) Genau, nicht präzise
              - C) Präzise, nicht genau (richtig)
              - D) Keins von beiden
              Warum: Dicht beieinander ist präzise; neben dem Bullseye verfehlt, was beabsichtigt war.
              Zitat: "Präzision heißt, die Pfeile landen dicht beieinander, Genauigkeit heißt, sie landen im Bullseye." (P2)
              ### Q3. Wo kann KI nur raten, es sei denn, sie fragt dich?
              - A) Beim Bauen
              - B) Beim Festlegen (richtig)
              - C) Bei beidem gleich
              - D) Bei keinem von beiden
              Warum: Was gebaut werden soll, steckt in deinem Kopf.
              Zitat: "Beim Festlegen kann sie nur raten, was in Deinem Kopf ist, es sei denn, sie fragt." (P3)
              ## Nicht gefunden
              Nichts.
            - &questions_2_example |
              # Context Rot erkennen und die passende Aufräumaktion wählen
              ## Fragen
              ### Q1. Alte und neue Anweisungsblätter hängen nebeneinander. Welche Art von Context Rot ist das?
              - A) Poisoning
              - B) Distraction
              - C) Confusion
              - D) Clash (richtig)
              Warum: Zwei Quellen, die sich widersprechen, sind ein Clash.
              Zitat: "Die Namen dafür sind Poisoning, Distraction, Confusion und Clash." (P5)
              ### Q2. Auf der Werkbank liegt ein Ordner mit jedem Modell, aber du baust eins. Welche Aufräumaktion passt?
              - A) Gegenprüfen
              - B) Verdichten (richtig)
              - C) Auswählen
              - D) Ausmisten
              Warum: Was für den Auftrag zu viel ist, wird zu einer kurzen Zusammenfassung verdichtet.
              Zitat: "Verdichten: den Ordner durch eine einseitige Zusammenfassung ersetzen." (P6)
              ### Q3. Wahr oder falsch: Noch ein Dokument "zur Sicherheit" macht das Ergebnis sicherer.
              - A) Wahr
              - B) Falsch (richtig)
              Warum: Eine vollere Werkbank kann eine schlechtere sein.
              Zitat: "Mehr ist nicht sicherer. Eine vollere Werkbank kann eine schlechtere Werkbank sein." (P7)
              ## Nicht gefunden
              Nichts.
