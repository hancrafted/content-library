        details:
          why: Die Spezifikation ist geteilter Kontext. Sie enthält nur, was entschieden wurde, ohne die Fragen und Entwürfe auf dem Weg dorthin, damit jeder spätere Chat sauber startet.
          techniques: [fresh-context, cite-sources]
          example: &spec_example |
            # Quiz-Spezifikation: Vom geteilten Verständnis zum geteilten Kontext
            ## Lernende
            Workshop-Teilnehmende, die gerade die Episode gesehen haben und in der Pause auf dem Handy spielen.
            ## Quests
            ### Anforderungen präzise und genau schreiben
            Präzision von Genauigkeit unterscheiden und sagen, wo KI nur raten kann. Passagen P1 bis P4.
            ### Context Rot erkennen und die passende Aufräumaktion wählen
            Die vier Arten von Context Rot und die Aufräumaktion für jede nennen. Passagen P5 bis P8.
            ### Meta-Prompting und den frischen Chat nutzen
            Sagen, was Meta-Prompting ist und was in den frischen Chat gehört. Passagen P9 bis P12.
            ## Fragen
            Multiple Choice mit vier Optionen, wahr oder falsch, wo ein Mythos entlarvt wird. Jede Antwort wird mit einer zitierten Passage erklärt.
            ## Spielmechanik
            - Punkte mit Serienbonus.
            - Ein Serienzähler, ein Fortschrittsbalken und Sterne pro Lernziel auf dem Endbildschirm.
            - Eine Wiederholung der verpassten Fragen; der beste Punktestand bleibt im Browser gespeichert.
            ## Gestaltung
            Eine Seite, die sich per Doppelklick öffnet, auf dem Handy lesbar, hell oder dunkel, wie das Gerät eingestellt ist.
            ## Nicht im Umfang
            - Konten, eine Bestenliste, Ton.
