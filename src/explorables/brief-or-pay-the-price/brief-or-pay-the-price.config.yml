    definitions:
      price:
        title: 'PRICE · five traits of a brilliant freelancer with amnesia'
        heads:
          freelancer: 'The freelancer'
          middle: 'Five traits'
          ai: 'AI'
        close:
          lead: 'Amnesia:'
          text: 'after each conversation, they forget everything, so you have to onboard them again, and every job starts from zero.'
        rows:
          probabilistic:
            name: 'Probabilistic'
            gloss: ''
            short: 'Outcome changes every time'
            freelancer: 'Give the same brief to a new freelancer, and get a different plan.'
            ai: 'Give the same prompt in a new chat, and get a different answer.'
          relentless:
            name: 'Relentless'
            gloss: ''
            short: 'High output, unknown quality'
            freelancer: 'Hand over the job, and they work day and night, producing stacks of polished pages, whether they’re right or not.'
            ai: 'Send the prompt, and it produces pages in seconds, as many as you ask for, whether they’re right or not.'
          informed:
            name: 'Informed'
            gloss: ''
            short: 'Knowledgeable, but not about you'
            freelancer: 'Ask a freelancer who knows every trade, and get expert answers, blind to your company and culture.'
            ai: 'Ask AI, trained on more text than anyone could read, and get the likeliest answer, blind to your company and culture.'
          confident:
            name: 'Confident'
            gloss: ''
            short: 'Fills the gap without question'
            freelancer: 'Give a vague request, and they start without asking, fill the gaps with their own assumptions, and sell it to you as right.'
            ai: 'Give a vague prompt, and it starts without asking, fills the gaps with the most common answers, and replies with full confidence.'
          every-word-billed:
            name: 'Every word billed'
            gloss: ''
            short: 'The bill grows every turn'
            freelancer: 'They bill every word they read and write, so one more question means paying to reread the whole file, their own pages included.'
            ai: 'It charges for every word it reads and writes, so one more message means paying for the whole chat again, its own answers included.'
      brief:
        title: 'BRIEF · five moves to brief a freelancer with amnesia'
        heads:
          freelancer: 'The freelancer'
          middle: 'Five moves'
          ai: 'AI'
        close:
          lead: 'The brief:'
          text: 'written once, handed over every time.'
        rows:
          break-it-down:
            name: 'Break it down'
            gloss: ''
            short: 'Small pieces, small risk'
            freelancer: 'Hand the freelancer one piece of the job, not the whole project.'
            ai: 'Give AI one piece per prompt, not the whole project.'
          requirements-first:
            name: 'Requirements first'
            gloss: ''
            short: 'Good is defined first'
            freelancer: 'Tell them what a finished piece looks like before they start.'
            ai: 'Write down what good looks like before the first prompt.'
          interview-yourself-with-ai:
            name: 'Interview yourself with AI'
            gloss: ''
            short: 'Your context comes out first'
            freelancer: 'Let them interview you first, so your unwritten rules come out.'
            ai: 'Ask AI to ask you its questions before it answers.'
          evaluate-each-step:
            name: 'Evaluate each step'
            gloss: ''
            short: 'Caught early, not late'
            freelancer: 'Check each piece against the brief when it lands.'
            ai: 'Check each answer against the requirements before the next step.'
          fresh-start-for-each-piece:
            name: 'Fresh start for each piece'
            gloss: ''
            short: 'Every piece starts clean'
            freelancer: 'Brief them fresh for each piece, with only what that piece needs.'
            ai: 'Open a new chat for each piece, with only what it needs.'
      brace:
        title: 'BRACE · five requirements for a team of agents'
        heads:
          freelancer: 'A freelancer team'
          middle: 'Five requirements'
          ai: 'AI agents'
        close:
          lead: 'Systems thinking:'
          text: 'the plan, not their memory, holds the team together.'
        rows:
          backwards-from-the-goal:
            name: 'Backwards from the goal'
            gloss: ''
            short: 'Every step serves the goal'
            freelancer: 'Start from the delivery date and plan each hand-over back from it.'
            ai: 'Start from the goal and plan each step back from it.'
          resolve-dependencies-early:
            name: 'Resolve dependencies early'
            gloss: ''
            short: 'Parallel, not waiting'
            freelancer: 'Settle the big decisions first, so every freelancer can work without waiting.'
            ai: 'Resolve decisions and dependencies early, so agents run in parallel.'
          autonomy-through-intent:
            name: 'Autonomy through intent'
            gloss: ''
            short: 'Intent fixed, the how is theirs'
            freelancer: 'Give each freelancer the goal and the why, not a script.'
            ai: 'Give each agent the intent, and let it find the how.'
          contracts-at-the-seams:
            name: 'Contracts at the seams'
            gloss: ''
            short: 'Clear in, clear out'
            freelancer: 'Each hand-over has a written spec: what you get, what you deliver, how it is checked.'
            ai: 'Each seam has a contract: what a step receives, delivers, and how it is checked.'
          engineer-trust:
            name: 'Engineer trust'
            gloss: ''
            short: 'Trust is built, not assumed'
            freelancer: 'Check each delivery against its spec, and tighten the checks after every project.'
            ai: 'Review each result against its contract, and harden the checks after every run.'
