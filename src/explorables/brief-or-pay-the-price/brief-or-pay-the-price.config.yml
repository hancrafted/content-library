# The brief-or-pay-the-price Explorable. The top level is structure: which definitions exist and the rows of each.
# Every string sits under `i18n`, keyed by id, in both locales; the loader refuses a file whose locales differ.
# German keeps each trait's English name and adds a gloss (`gloss`); English leaves the gloss empty.
# Authoring guide: docs/features/explorables/brief-or-pay-the-price-scenarios.md.
definitions:
  price:
    acronym: PRICE
    wipe: true
    rows:
      - { id: probabilistic, letter: P, beatMilliseconds: 2600 }
      - { id: relentless, letter: R, beatMilliseconds: 3600 }
      - { id: informed, letter: I, beatMilliseconds: 3600 }
      - { id: confident, letter: C, beatMilliseconds: 2900 }
      - { id: every-word-billed, letter: E, beatMilliseconds: 9900 }
  brief:
    acronym: BRIEF
    rows:
      - { id: break-it-down, letter: B, beatMilliseconds: 2600 }
      - { id: requirements-first, letter: R, beatMilliseconds: 2400 }
      - { id: interview-yourself-with-ai, letter: I, beatMilliseconds: 2600 }
      - { id: evaluate-each-step, letter: E, beatMilliseconds: 2400 }
      - { id: fresh-start-for-each-piece, letter: F, beatMilliseconds: 2600 }
  brace:
    acronym: BRACE
    rows:
      - { id: backwards-from-the-goal, letter: B, beatMilliseconds: 2800 }
      - { id: resolve-dependencies-early, letter: R, beatMilliseconds: 2400 }
      - { id: autonomy-through-intent, letter: A, beatMilliseconds: 2800 }
      - { id: contracts-at-the-seams, letter: C, beatMilliseconds: 2600 }
      - { id: engineer-trust, letter: E, beatMilliseconds: 3000 }
# The counters table: the traits each move counters, and the source its evidence line cites.
matrix:
  break-it-down: { counters: [relentless, every-word-billed], source: 'Zhou et al., Least-to-Most Prompting' }
