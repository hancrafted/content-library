  interview-yourself-with-ai: { counters: [confident, informed], source: 'Vijayvargiya et al., Ambig-SWE' }
  evaluate-each-step: { counters: [relentless, probabilistic], source: 'Lightman et al., Let’s Verify Step by Step' }
  fresh-start-for-each-piece:
    counters: [every-word-billed, relentless, probabilistic]
    source: 'Laban et al., LLMs Get Lost In Multi-Turn Conversation'
