        }
      implement-br:
        {
          freelancer: 'Ein Teil pro Freelancer, in einer Stunde prüfbar.',
          ai: 'Ein Ticket pro Subagent, in einer Sitzung reviewbar.',
        }
      implement-be:
        { freelancer: 'Kleine Teile, kleine Rechnungen.', ai: Ein kleines Ticket liest und schreibt wenige Tokens. }
      implement-fr:
        {
          freelancer: 'Ein leerer Schreibtisch pro Freelancer, nur mit seinem Briefing.',
          ai: Ein frischer Worktree und ein frischer Kontext pro Ticket.,
        }
      implement-fe:
        {
          freelancer: Niemand liest zum Start die ganze Projektakte.,
          ai: Kein Subagent zahlt für den langen Chat des Orchestrators.,
        }
      verify-er:
