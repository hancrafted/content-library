# The context window cornerstone's config: numbers, Presets and English words. context-preset.config.de.yml holds the
# German words and story under the same keys; the build picks the pair from the URL's locale. The chat itself is
# summer-party.jsonl (summer-party.de.jsonl), a Claude Code session log; docs/features/context-window.md says which
# fields it reads. Token counts follow the cornerstone fact-check and are illustrative.

# The starting instructions, as Claude Code's /context splits them. The log never holds them.
start:
  id: m1
  sysprompt: 6500
  systools: 16500
  mcp: 1400
  skills: 9700
# Each memory file's size; the log holds only its path.
memory: 2000

# Window sizes. The autocompact buffer is 16.5K on 200K (Claude Code's /context), 33K on 1M.
windows:
  200k: { tokens: 200000, buffer: 16500 }
  1m: { tokens: 1000000, buffer: 33000 }

# Smart-zone lines. Words for each line are under words.lines.
lines:
  matt: { tokens: 80000, short: 80K }
  matt-1m: { tokens: 150000, short: 150K }
  han: { tokens: 300000, short: 300K }

# Chats: a log cut at a step, or a list of blocks for a static mini bar.
chats:
  summer-party: { log: summer-party, steps: 21 }
  summer-compact: { log: summer-party }
  fresh: { blocks: [[memory, 2000], [user, 1900]] }
  planner: { blocks: [[memory, 2000], [user, 6200], [assistant, 3000]] }
  w-venues: { blocks: [[user, 900], [tool_use, 1300], [tool_result, 15000], [assistant, 460]] }
  w-catering: { blocks: [[user, 700], [tool_use, 200], [tool_result, 55000], [assistant, 940]] }
  w-invites: { blocks: [[user, 800], [assistant, 1200]] }

# What the log does not hold about a step: a message the AI may fill itself, the steps it repeats, a big jump.
notes:
  m3: { mayFill: true }
  m6: { refs: [m5] }
  m8: { big: true }
  m11: { big: true }
  m12: { refs: [m5] }
  m14: { big: true }
  m18: { refs: [m5] }
  m24: { refs: [m5] }
  m26: { big: true }
  m27: { big: true }

# The Brief's attention split at the end of the summer party (Slide 5's strip, Slide 4's panel): start 20, the
# middle 50 over 15 messages, the newest 30.
attention:
  summer-party:
    21:
      {
        m1: 15,
        m2: 4,
        m3: 1,
        m4: 2,
        m5: 10,
        m6: 3,
        m7: 2,
        m8: 4,
        m9: 2,
        m10: 2,
        m11: 6,
        m12: 4,
        m13: 2,
        m14: 4,
        m15: 2,
        m16: 1,
        m17: 3,
        m18: 3,
        m22: 6,
        m23: 9,
        m24: 15,
      }

# One Preset per Slide state of the Spec's picked Options. Omitted fields take the defaults below.
defaults:
  step: 21
  mode: explain
  depth: simple
  pinned: null
  show: { chat: true, timeline: true, context: true, panel: false }
  controls: [show, depth, mode, collapse, meter]
  controlsHidden: false
  timelineLocked: false
  meterHidden: false
  download: true
  upload: false
  windows: [{ size: 200k, lines: [matt] }]
  motion: rise

presets:
  slide-3:
    chat: summer-party
    step: 9
    pinned: m3
    controls: [show]
    windows: [{ size: 200k, lines: [] }]
  slide-4:
    chat: summer-party
    mode: attention
    show: { chat: true, timeline: true, context: true, panel: true }
    controls: [show, depth, mode]
    windows: [{ size: 200k, lines: [] }]
  slide-5:
    chat: summer-party
    mode: attention
    controls: []
    controlsHidden: true
    windows: [{ size: 200k, lines: [matt] }, { size: 1m, lines: [matt-1m] }]
  slide-6:
    chat: summer-party
    depth: technical
    show: { chat: false, timeline: false, context: true, panel: false }
    controls: []
    controlsHidden: true
    timelineLocked: true
  slide-7:
    chat: summer-party
    depth: technical
    pinned: 'scat:start'
    show: { chat: true, timeline: true, context: true, panel: true }
  slide-8:
    chat: summer-party
    step: 12
    depth: technical
    pinned: m11
    show: { chat: false, timeline: true, context: true, panel: true }
  slide-9-before:
    chat: summer-compact
    step: 23
    pinned: m26
    meterHidden: true
    controls: []
    controlsHidden: true
    timelineLocked: true
    show: { chat: false, timeline: false, context: true, panel: false }
    windows: [{ size: 200k, lines: [] }]
  slide-9-chat:
    chat: summer-compact
    step: 24
    meterHidden: true
    controls: []
    controlsHidden: true
    timelineLocked: true
    show: { chat: true, timeline: false, context: false, panel: false }
    windows: [{ size: 200k, lines: [] }]
  slide-9-after:
    chat: summer-compact
    step: 24
    pinned: m27
    meterHidden: true
    controls: []
    controlsHidden: true
    timelineLocked: true
    show: { chat: false, timeline: false, context: true, panel: false }
    windows: [{ size: 200k, lines: [] }]

# Static mini bars: a chat at a step (its last step when omitted), labelled by a key of words.mini.labels.
minis:
  slide-10-old:
    window: { size: 200k, lines: [matt] }
    bars: [{ label: old, chat: summer-party, step: 21 }]
  slide-10-fresh:
    window: { size: 200k, lines: [matt] }
    bars: [{ label: fresh, chat: fresh }]
  slide-11-before:
    window: { size: 200k, lines: [matt] }
    bars: [{ label: summer, chat: summer-party, step: 21 }]
  slide-11-after:
    window: { size: 200k, lines: [matt] }
    bars:
      - { label: planner, chat: planner }
      - { label: venues, chat: w-venues, discarded: true }
      - { label: catering, chat: w-catering }
      - { label: invites, chat: w-invites }

