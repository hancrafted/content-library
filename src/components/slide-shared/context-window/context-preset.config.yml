# The words that explain each step of the summer party. Inline `code` and **bold** are the only markup.
story:
  m1:
    event: Starting instructions loaded
    label: Starting instructions, hidden
    labelTechnical: System prompt · tools · MCP · skills
    term: starting instructions, never shown in the terminal · 34.1k
    simple: 'Before you type anything, the app hands the AI hidden instructions: who it is, how to answer, which tools it may use. They sit at the very top and travel with every message.'
    technical: System prompt 6.5k, built-in tool schemas 16.5k (`Read`, `Grep`, `Bash`, `WebSearch`, `WebFetch` …), one MCP server 1.4k, skill descriptions 9.7k. Resent with every request; a cached prefix is cheaper but still counts and still takes attention.
  m2:
    event: Memory loaded
    act: Recalled memory **CLAUDE.md**
    label: Memory loaded
    labelTechnical: Memory files · `CLAUDE.md`
    term: CLAUDE.md and memory loaded · 2k
    simple: Notes the app keeps for this project, added quietly before your first message.
    technical: '`CLAUDE.md` and memory files, loaded after the system prompt. 2k tokens.'
  m3:
    event: You set the budget
    simple: 'Your first message. It holds the one hard limit: 40,000 euro.'
    technical: User turn, 20 tokens. Never referred to again, so its share of attention shrinks as the chat grows.
  m4:
    event: The AI asks two questions
    simple: "The AI's reply joins the context too, so the next request carries it along."
    technical: "Assistant turn, 18 tokens. Every request resends the whole context: request 2's input is request 1's input plus this reply plus your next message."
  m5:
    event: You mention 12 vegetarian guests
    simple: A small detail that keeps coming back. Every time the chat repeats it, it is fresh again.
    technical: User turn, 18 tokens. Repeated in steps 6, 12, 18 and 21, so a recent copy is always near the end.
  m6:
    event: The AI notes the vegetarians
    simple: The AI repeats the detail back.
    technical: Assistant turn, 13 tokens. Repeats step 5.
  m7:
    event: You ask for three venues
    simple: One short, innocent question.
    technical: User turn, 7 tokens. It makes the AI call tools.
  m8:
    event: Web search read 10 pages
    label: Searched the web · 10 pages · 1 retry
    labelTechnical: '`WebSearch` ×2 → `WebFetch` ×10 · 16.3k'
    out: Fetched 10 pages · 15k of extracts
    simple: To answer one short question, the AI searched twice and opened ten pages. Each page is boiled down to an extract, but ten extracts still add up, and you never see them in the chat.
    technical: '`WebSearch` returns titles and URLs. `WebFetch` turns a page into Markdown and has a small model extract what the prompt asks for; only that extract comes back as a `tool_result`:'
    pre: "WebSearch × 2 → 3,000 tokens\nWebFetch × 10 → 12,000 tokens (extracts)"
  m9:
    event: The AI answers in three lines
    simple: Three lines in the chat. Sixteen thousand tokens behind them.
    technical: Assistant turn, 18 tokens, written from the tool results above.
  m10:
    event: You point at the catering offers
    simple: A short message. The file is not in it yet, but the app adds a hidden note that you opened it.
    technical: User turn, 15 tokens, and a system reminder from the IDE that the file is open, 28 tokens.
  m11:
    event: The AI read catering-offers.pdf
    label: Read catering-offers.pdf · 20 pages
    labelTechnical: '`Glob` `**/*catering*.pdf` → `Read` pages 1–20 · 55k'
    out: Read 20 pages · 55k
    simple: To find the right offer, the AI read the whole file, every page of it, as text and as pictures of the pages.
    technical: '`Glob` finds the file; `Read` takes PDFs over 10 pages in ranges of at most 20, as page text plus page images, about 2,700 tokens a page:'
    pre: Read("offers/catering-offers.pdf", pages="1-20") → 55,000 tokens
  m12:
    event: The AI picks a caterer
    simple: The vegetarian detail comes back again.
    technical: Assistant turn, 15 tokens. Repeats step 5.
  m13:
    event: You ask for hotels
    simple: Another short question.
    technical: User turn, 13 tokens.
  m14:
    event: Web search read 12 pages
    label: Searched the web · 12 pages
    labelTechnical: '`WebSearch` → `WebFetch` ×12 · 17.5k'
    out: Fetched 12 pages · 14.5k of extracts
    simple: Twelve more pages, boiled down and kept.
    technical: 'One `WebSearch`, then twelve `WebFetch` extracts:'
    pre: "WebSearch → 1,500 tokens\nWebFetch × 12 → 14,500 tokens"
  m15:
    event: The AI finds two hotels
    simple: A short answer again.
    technical: Assistant turn, 16 tokens.
  m16:
    event: You mention the guest list
    simple: Another short message.
    technical: User turn, 8 tokens.
  m17:
    event: The AI opened guests.xlsx
    label: Opened guests.xlsx · 40 rows
    labelTechnical: '`Bash` `python3 … pandas` · 2k'
    out: 40 rows · 1.8k
    simple: 'The guest list. Forty rows are small: a spreadsheet is cheap until it is big.'
    technical: '`Read` refuses .xlsx, so the AI prints the sheet with a script:'
    pre: Bash("python3 -c 'import pandas as pd; print(pd.read_excel(\"guests.xlsx\").to_csv())'") → 1,800 tokens
  m18:
    event: The AI sums up the guests
    simple: The vegetarians, once more.
    technical: Assistant turn, 12 tokens. Repeats step 5.
  m22:
    event: You ask for the full plan
    simple: The question that needs everything, including the budget from step 3.
    technical: User turn, 9 tokens.
  m23:
    event: The AI added up the costs
    label: Added up the costs
    labelTechnical: '`Bash` `python3 budget.py` · 670'
    out: Total 52,300 · 350 tokens
    simple: The AI ran a small calculation. The numbers are right; the budget is not in it.
    technical: '`Bash("python3 budget.py")`: the sum is correct, but the 40,000 limit from step 3 never made it into the script.'
  m24:
    event: "The AI's plan: 52,300 euro"
    simple: The vegetarians made it. The 40,000 euro budget did not.
    technical: Assistant turn, 30 tokens. The budget from step 3 is still in the context, but it got little attention among many similar numbers from the offers and searches (distractors, Chroma 2025), so the plan is 12,300 euro over it.
  m25:
    event: You flag the budget, ask for the contract
    simple: You notice the plan is over budget, and ask for one more thing.
    technical: User turn, 14 tokens.
  m26:
    event: The AI read the contract
    label: Read venue-contract.pdf · 21 pages
    labelTechnical: '`Read` `venue-contract.pdf` pages 1–21 · 57.1k'
    out: Read 21 pages · 57k
    simple: 'The contract, all twenty-one pages. The window is now nearly full: the fill reaches the space kept free for summaries.'
    technical: '`Read("venue-contract.pdf", pages="1-21")`, 57,000 tokens. The fill passes the autocompact threshold (window minus buffer), so the next step compacts.'
  m27:
    event: Conversation compacted
    label: Conversation compacted
    labelTechnical: Conversation compacted
    simple: The app quietly replaced the whole conversation with a summary. You did not see it happen; the chat looks the same, but the AI now only has the summary.
    technical: 'Autocompact: a model call writes a structured summary and it replaces every message, tool call and tool result. The system prompt, tools, MCP, skills and memory files are loaded again. Recently read files come back only if under 5k tokens each; both PDFs come back as paths.'
    kept:
      - 'The goal: a summer party for 40, end of June, in Lisbon'
      - 'The budget: 40,000 euro, and that the last plan was 12,300 over'
      - 12 vegetarian guests, 15 travelling
      - Venue Estrela pavilion, caterer Sabor Verde, hotels Lumen and Casa do Rio
      - 'Contract: music until 23:00, 30% deposit'
    dropped:
      - Every message word for word
      - The 22 web page extracts
      - The text of the catering offers and the contract (paths kept)
      - The exact prices in the offers
  m28:
    event: The AI answers from the summary
    simple: The answer comes from the summary, not from the contract itself.
    technical: Assistant turn, 16 tokens. The contract text is gone; the summary holds its two key terms.
  m29:
    event: You ask for the plan again
    simple: You do not repeat the budget. It survived in the summary.
    technical: User turn, 8 tokens.
  m30:
    event: The AI added up the costs, with the limit
    label: Added up the costs
    labelTechnical: '`Bash` `python3 budget.py --limit 40000` · 670'
    out: Total 40,000 · 350 tokens
    simple: This time the budget is in the calculation.
    technical: '`Bash("python3 budget.py --limit 40000")`: the limit from the summary made it into the script.'
  m31:
    event: 'The plan fits: 40,000 euro'
    simple: 'Less detail, more focus: the summary put the budget back in front.'
    technical: Assistant turn, 32 tokens. After compaction the summary sits right after the starting instructions, where attention is strong, and the budget is in it.
