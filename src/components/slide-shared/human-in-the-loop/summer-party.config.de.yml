      run:
        todo: Füge das in einen neuen Chat ein, damit Deine Antworten zu einer Spezifikation und Tickets werden.
        prompt: |-
          Antworte auf Deutsch. Mach aus meinen Interview-Antworten eine Spezifikation. Interviewe mich nicht noch einmal; nutze, was hier steht.

          Das Handoff unten ist ein Beispiel. Ersetze es durch Dein eigenes Handoff, wenn Du eines hast.
          ```handoff
          kind: text
