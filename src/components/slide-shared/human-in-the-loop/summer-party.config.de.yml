    spec:
      title: Anforderungskarte
      description: Aus den Antworten wird eine Spezifikation mit einer kurzen Liste von Anforderungen, die Du abzeichnest, und die Arbeit wird in senkrechte Scheiben geschnitten, die für sich erledigt werden können.
      run:
        todo: Öffne einen neuen Chat, füge den Prompt ein und lies Spec und Tickets. Verlange Änderungen, bis Du die Anforderungen freigeben kannst.
        prompt: |-
          Antworte auf Deutsch.

          ## Deine Rolle
          Du bist ein Spec-Autor. Du machst aus meinen Interview-Antworten eine klare Spezifikation und schneidest die Arbeit dann in Tickets. Du interviewst mich nicht noch einmal: Du fasst zusammen, was unten steht.

          ## Kontext
          Ich muss das nächste Sommerfest meiner Firma planen: 200 Mitarbeitende an fünf Standorten in Europa.
          Das ist das Ergebnis des vorigen Schritts. Wenn Du ein eigenes Ergebnis aus diesem Schritt hast, ersetze den Block darunter damit.

          ```handoff
          kind: text
          text: |-
            Start: etwa 150 Euro pro Kopf, zwei Rollstuhlfahrer, ein paar Vegetarier.
            F1 Format: ein Ort, an den alle reisen (A), oder fünf lokale Feiern (B). Empfohlen A, es geht darum, dass sich die Büros treffen. Meine Antwort: A.
            F2 Kapazität: eine lange Tafel für 200 gleichzeitig (A) oder wechselnde Tische mit Platz für etwa 140 (B). Empfohlen A, zu den Reden sitzen alle. Meine Antwort: A, eine lange Tafel. Den Restaurantvergleich habe ich vorher erbeten.
            F3 Wo und wann: Frankfurt, von allen fünf Büros gut erreichbar (A), oder Lissabon (B). Empfohlen A, ein zentraler Ort hält die Anreise kurz. Meine Antwort: A, Frankfurt, Ende Juni.
            F4 Die, die ich vergessen hatte, das Feedback vom letzten Jahr: zuerst lesen (A) oder neu anfangen (B). Empfohlen A, es zeigt, was zu vermeiden ist. Meine Antwort: A. Es war zu laut zum Reden, und viele sind früh gegangen.
            F5 Ruhe: ein separater ruhiger Raum (A) oder eine Halle für alles (B). Empfohlen A, so kann man reden, ohne zu schreien. Meine Antwort: A.
          ```

          ## So arbeitest Du
          Teil 1, die Spec. Schreibe sie im Chat mit genau diesen sieben Überschriften, in dieser Reihenfolge:
          1. **Problem Statement** (Problem): das Problem aus Sicht der Menschen, die es haben.
          2. **Solution** (Lösung): die Lösung aus derselben Sicht, in wenigen Sätzen.
          3. **User Stories**: eine nummerierte Liste mit mindestens 8, jede als "Als <wer> möchte ich <was>, damit <Nutzen>", die alle Aspekte meiner Antworten abdeckt.
          4. **Decisions** (Entscheidungen): die getroffenen Entscheidungen, je eine Zeile, ohne Markennamen oder Termine, die ich nicht genannt habe.
          5. **How we will know it worked** (Woran wir merken, dass es klappt): die Prüfungen, die zeigen, dass das Ziel erreicht ist, je eine Zeile, über Beobachtbares und nicht über das Wie.
          6. **Out of Scope** (Nicht Teil davon): was wir jetzt nicht tun.
          7. **Further Notes** (Weitere Hinweise): offene Punkte, Annahmen und Risiken.

          Teil 2, die Tickets. Schneide die Arbeit in Tracer-Bullet-Tickets: dünne vertikale Scheiben. Regeln:
          - Jede Scheibe zieht einen schmalen, aber VOLLSTÄNDIGEN Weg von Anfang bis Ende. Sie ist nicht nur eine Schicht der Arbeit.
          - Eine fertige Scheibe lässt sich für sich zeigen oder prüfen.
          - Jede Scheibe ist klein genug für eine Sitzung.
          - Jedes Ticket nennt seine blockierenden Kanten: die anderen Tickets, die fertig sein müssen, bevor es beginnen kann. Ein Ticket ohne Blocker kann sofort starten. Nenne nur Blocker, die es wirklich aufhalten.
          Zeige die Aufteilung als nummerierte Liste: Titel, blockiert durch, was es liefert. Warte nicht auf meine Freigabe; ich kann danach Änderungen verlangen, und Du gibst dann die zwei Blöcke erneut aus.

          ## Ausgabe
          Zuerst Spec und Tickets im Chat. Beende Deine Antwort dann mit genau zwei Codeblöcken, in dieser Reihenfolge und Form. Im Spec-Block ist das Ziel ein Satz, die Anforderungen sind die kurzen, prüfbaren Essenzen aus den Entscheidungen, und die Slices sind die Titel der Tickets in Kurzform. Ticket-IDs sind kurze Wörter in Kleinbuchstaben, und jeder Eintrag in blockedBy ist eine ID aus demselben Block.
          ```handoff
          kind: spec
          goal: "<ein Satz>"
          requirements: ["<kurze, prüfbare Essenz>", "<noch eine>"]
          outOfScope: ["<was wir nicht tun>"]
          slices: ["<eine dünne vertikale Scheibe>", "<noch eine>"]
          ```
          ```handoff
          kind: tickets
          tickets:
            - { id: t1, title: "<Titel>", acceptance: ["<Kriterium>"], blockedBy: [] }
            - { id: t2, title: "<Titel>", acceptance: ["<Kriterium>"], blockedBy: [t1] }
          ```
      command: |-
        /to-spec Antworte auf Deutsch. Mach aus diesen Interview-Antworten eine Spec und interviewe mich nicht noch einmal. Start: etwa 150 Euro pro Kopf, zwei Rollstuhlfahrer, ein paar Vegetarier. F1 Format: ein Ort, an den alle reisen (A), oder fünf lokale Feiern (B). Empfohlen A, es geht darum, dass sich die Büros treffen. Meine Antwort: A. F2 Kapazität: eine lange Tafel für 200 gleichzeitig (A) oder wechselnde Tische mit Platz für etwa 140 (B). Empfohlen A, zu den Reden sitzen alle. Meine Antwort: A, eine lange Tafel. Den Restaurantvergleich habe ich vorher erbeten. F3 Wo und wann: Frankfurt, von allen fünf Büros gut erreichbar (A), oder Lissabon (B). Empfohlen A, ein zentraler Ort hält die Anreise kurz. Meine Antwort: A, Frankfurt, Ende Juni. F4 Die, die ich vergessen hatte, das Feedback vom letzten Jahr: zuerst lesen (A) oder neu anfangen (B). Empfohlen A, es zeigt, was zu vermeiden ist. Meine Antwort: A. Es war zu laut zum Reden, und viele sind früh gegangen. F5 Ruhe: ein separater ruhiger Raum (A) oder eine Halle für alles (B). Empfohlen A, so kann man reden, ohne zu schreien. Meine Antwort: A. Führe danach /to-tickets auf der Spec aus.
      exampleInput: |-
        ```handoff
        kind: text
