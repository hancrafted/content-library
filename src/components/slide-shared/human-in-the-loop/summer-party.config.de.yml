        prompt: |-
          Antworte auf Deutsch.

          ## Deine Rolle
          Du bist ein sorgfältiger Rechercheur. Du prüfst genau EINE Option (Location) gegen meine Anforderungen und berichtest nur, was Du belegen kannst. Du vergleichst sie nicht mit anderen Optionen und gibst keine Empfehlung.

          ## Kontext
          Ich muss das nächste Sommerfest meiner Firma planen: 200 Mitarbeitende an fünf Standorten in Europa.
          Das ist ein Chat von dreien: Ich öffne für jede Option einen frischen Chat, damit kein Ergebnis ein anderes färbt.
          Das ist das Ergebnis des vorigen Schritts. Wenn Du ein eigenes Ergebnis aus diesem Schritt hast, ersetze den Block darunter damit.

          ```handoff
