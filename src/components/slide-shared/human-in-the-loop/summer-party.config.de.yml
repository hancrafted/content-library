            Start: etwa 150 Euro pro Kopf, zwei Rollstuhlfahrer, ein paar Vegetarier.
            F1 Format: ein Ort, an den alle reisen (A), oder fünf lokale Feiern (B). Empfohlen A, es geht darum, dass sich die Büros treffen. Meine Antwort: A.
            F2 Kapazität: eine lange Tafel für 200 gleichzeitig (A) oder wechselnde Tische mit Platz für etwa 140 (B). Empfohlen A, zu den Reden sitzen alle. Meine Antwort: A, eine lange Tafel. Den Restaurantvergleich habe ich vorher erbeten.
            F3 Die, die ich vergessen hatte, das Feedback vom letzten Jahr: zuerst lesen (A) oder neu anfangen (B). Empfohlen A, es zeigt, was zu vermeiden ist. Meine Antwort: A. Es war zu laut zum Reden, und viele sind früh gegangen.
          ```

          Schreibe das Ziel in einem Satz, die Anforderungen als kurze, prüfbare Kernpunkte, was nicht dazugehört, und die Arbeit als dünne senkrechte Scheiben. Mach dann aus jeder Scheibe ein Ticket: ein schmales, aber vollständiges Stück, das für sich erledigt und geprüft werden kann, mit Akzeptanzkriterien und den Tickets, die vorher fertig sein müssen.
          Beende mit zwei Codeblöcken, genau so:
          ```handoff
          kind: spec
          goal: <ein Satz>
          requirements: [<kurzer Kernpunkt>, ...]
          outOfScope: [<was wir nicht tun>, ...]
          slices: [<eine Scheibe>, ...]
          ```
          ```handoff
          kind: tickets
          tickets:
            - { id: t1, title: <Titel>, acceptance: [<Kriterium>], blockedBy: [] }
          ```
      command: |-
        /to-spec [füge Deine Antworten hier ein]
        Führe danach /to-tickets auf der Spezifikation aus. Antworte auf Deutsch.
      exampleInput: |-
