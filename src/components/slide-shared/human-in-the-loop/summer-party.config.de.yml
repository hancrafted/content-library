# German words of the summer-party Workflow: `words:` only, under exactly the keys of summer-party.config.yml.
# Prompts are German and tell the AI to answer in German; the handoff keys (kind, text, ...) stay English.
words:
  title: Sommerfest
  scenario: 'Plane das nächste Sommerfest Deiner Firma: 200 Mitarbeitende an fünf Standorten in Europa.'
  setup: |-
    claude plugin install mattpocock-skills@claude-plugins-official
    Öffne danach einen Ordner für diese Aufgabe und starte Claude Code darin.
  stages:
    party:
      name: Plan
      moves:
        B: 'Zerlege es: Teile die große Aufgabe in Teile und nimm nur eines mit.'
    interview:
      name: Interview
      moves:
        I: 'Interviewe Dich mit KI: Die KI fragt, bevor sie rät, Frage für Frage.'
    requirements:
      name: Anforderungen
      moves:
        R: 'Erst die Anforderungen: Aus den Antworten wird eine kurze Liste, die Du freigibst, bevor die Arbeit beginnt.'
      card:
        label: Anforderungskarte
        lines:
          - 200 Gäste
          - Höchstens 150 € pro Person
          - Stufenlos
          - Vegetarisches Menü
          - Separater ruhiger Raum
        status: Freigegeben
    research:
      name: Recherche
      moves:
        F: 'Frischer Start für jedes Teil: Ein neuer Chat pro Location hält jedes Fenster klein.'
    compare:
      name: Vergleich
      moves:
        E: 'Prüfe jeden Schritt: Vergleiche jedes Ergebnis mit der Karte, bevor Du weitermachst.'
    recommendation:
      name: Prüfen
  jobs:
    pieces:
      title: Location
      description: Teile das Fest in seine fünf Teile und nimm nur eines mit, die Location. Die anderen vier warten.
      parked:
        - Anreise
        - Catering
        - Programm
        - Einladungen
      run:
        todo: Öffne einen neuen Chat, füge den Prompt ein und lies die Antwort. Behalte den Handoff-Block am Ende.
        prompt: |-
          Antworte auf Deutsch.

          ## Deine Rolle
          Du bist ein Planungscoach. Du hilfst mir, eine große Aufgabe in Teile zu zerlegen, die ich nacheinander planen kann, und wählst das Teil, mit dem ich beginne.

          ## Kontext
          Ich muss das nächste Sommerfest meiner Firma planen: 200 Mitarbeitende an fünf Standorten in Europa.

          ## So arbeitest Du
          1. Zerlege die Aufgabe in genau fünf Teile. Ein Teil ist etwas, das ich in einem eigenen Chat aus einem kurzen Handoff planen kann. Die Reihenfolge darf eine Rolle spielen, aber jedes Teil muss klein genug sein, um es für sich zu planen.
          2. Benenne jedes Teil mit ein oder zwei Wörtern und ergänze einen halben Satz dazu, was es entscheidet.
          3. Empfiehl das eine Teil, mit dem ich beginne: das, das für die anderen am meisten festlegt. Begründe es in einem Satz.
          4. Plane noch kein Teil und stelle mir keine Fragen.

          ## Ausgabe
          Zuerst die nummerierte Liste der fünf Teile, dann die Empfehlung. Beende Deine Antwort mit genau einem Codeblock in dieser Form:
          ```handoff
          kind: text
          text: "<das gewählte Teil, dann die Begründung in einem Satz>"
          ```
      exampleOutput: |-
        ```handoff
        kind: text
        text: Location. Sie legt Datum und Stadt fest, und Anreise, Catering und Einladungen folgen daraus.
        ```
      check:
        todo: Öffne einen frischen Chat, füge den Prüf-Prompt ein und behebe das eine, was er nennt.
        criteria:
          - Es gibt fünf Teile, und jedes lässt sich in einem eigenen Chat aus einem kurzen Handoff planen (die Reihenfolge darf eine Rolle spielen).
          - Genau ein Teil ist gewählt, mit Begründung in einem Satz.
        prompt: |-
          Antworte auf Deutsch.

          ## Deine Rolle
          Du bist ein strenger Prüfer in einem frischen Chat. Du hast die Arbeit unten nicht geschrieben, Du schuldest ihr nichts, und Du schreibst sie nicht um. Du prüfst sie nur.

          ## Kriterien
          1. Es gibt fünf Teile, und jedes lässt sich in einem eigenen Chat aus einem kurzen Handoff planen (die Reihenfolge darf eine Rolle spielen).
          2. Genau ein Teil ist gewählt, mit Begründung in einem Satz.

          ## So arbeitest Du
          1. Bewerte jedes Kriterium oben einzeln mit BESTANDEN oder DURCHGEFALLEN.
          2. Belege jede Bewertung: Zitiere oder zeige die genaue Stelle der Arbeit. Wenn Du keinen Beleg findest, ist die Bewertung DURCHGEFALLEN.
          3. Sei nicht großzügig. Unklar, fehlend oder nur halb wahr zählt als DURCHGEFALLEN.
          4. Nenne nach den Bewertungen die EINE Korrektur, die am meisten zählt, in ein bis zwei Sätzen, und sage genau, was zu ändern ist.
          5. Füge nichts anderes hinzu: kein Lob, keine Zusammenfassung, keine umgeschriebene Fassung.

          ## Ausgabe
          Eine Liste "Kriterium: BESTANDEN oder DURCHGEFALLEN, Beleg", dann "Wichtigste Korrektur: ...".

          ## Die zu prüfende Antwort
          Das ist die ganze Antwort des ersten Chats, die Liste und der Block. Ersetze sie durch Deine eigene ganze Antwort, wenn Du eine hast.

          Hier sind die fünf Teile:
          1. Location
          2. Anreise
          3. Catering
          4. Programm
          5. Einladungen

          Zuerst: Location.

          ```handoff
          kind: text
          text: Location. Sie legt Datum und Stadt fest, und Anreise, Catering und Einladungen folgen daraus.
          ```
    interview:
      title: KI fragt Dich
      detail: 3 Fragen, 1 vergessen
      description: Die KI interviewt Dich, bevor sie rät, eine Frage nach der anderen, und bringt auf, woran Du nicht gedacht hast. Das ist der Chat aus dem Vortrag.
      run:
        todo: Öffne einen neuen Chat, füge den Prompt ein und beantworte jede Runde ("Ja" nimmt die Empfehlung an). Wenn das Interview fertig ist, tippe "fertig".
        prompt: |-
          Antworte auf Deutsch.

          ## Deine Rolle
          Du bist ein unerbittlicher, aber freundlicher Interviewer im Stil der "Grilling"-Methode. Du interviewst mich zum Plan unten, bis wir dasselbe Verständnis haben, bevor jemand rät oder einen Plan schreibt. Du fragst. Du planst noch nicht.

          ## Kontext
          Ich muss das nächste Sommerfest meiner Firma planen: 200 Mitarbeitende an fünf Standorten in Europa.
          Wir nehmen ein Teil mit. Das ist das Ergebnis des vorigen Schritts. Wenn Du ein eigenes Ergebnis aus diesem Schritt hast, ersetze den Block darunter damit.

          ```handoff
          kind: text
          text: Location. Sie legt Datum und Stadt fest, und Anreise, Catering und Einladungen folgen daraus.
          ```

          ## So arbeitest Du
          Sieh meinen Plan als Baum von Entscheidungen: Jede Entscheidung öffnet die Entscheidungen, die an ihr hängen. Arbeite den Baum in Runden ab.
          1. Jetzt beantwortbar sind alle Entscheidungen, deren Voraussetzungen schon geklärt sind: die Fragen, die Du jetzt stellen kannst, ohne Antworten zu raten, die Du noch nicht gehört hast. Stelle alle Fragen, die jetzt schon beantwortbar sind, in einer Runde.
          2. Nummeriere die Fragen F1, F2, F3 und zähle über die Runden weiter. Formatiere jede Frage genau so:

          ❓ **F1** - **<kurzer Titel>**: <die Frage, ein oder zwei Sätze>
             A) <Option>
             B) <Option>

          ➡️ Empfohlen: <A oder B>, weil <ein Satz>. Antworte "Ja", um anzunehmen.

          3. Formuliere jede Frage so, dass mein "Ja" Deine empfohlene Antwort annimmt. Gib immer zwei Optionen und eine Empfehlung.
          4. Halte nach den Fragen an und warte auf meine Antworten. Antworte nie für mich und starte die nächste Runde nie, bevor ich geantwortet habe.
          5. Berechne nach jeder Antwort den Baum neu: Geklärte Entscheidungen machen neue Fragen beantwortbar und schalten Fragen frei, die von ihnen abhingen. Eine Frage, die von einer noch offenen abhängt, gehört in eine spätere Runde.
          6. Fakten sind Deine Aufgabe, Entscheidungen meine. Frag mich nie nach etwas, das Du selbst wissen könntest; nenne es stattdessen als Annahme. Runde 1 darf die Startfakten sammeln, die Du nicht kennen kannst (Budget pro Kopf, Personenzahl, besondere Bedürfnisse), als eine Frage mit sinnvollem Standardwert.
          7. Stelle mindestens eine Frage zu etwas, woran ich vermutlich nicht gedacht habe, zum Beispiel was beim letzten Fest schiefging.
          8. Wenn ich sage, dass ich etwas nicht verstehe, erkläre es mit einem Alltagsvergleich und frag noch einmal.
          9. Das Interview ist beendet, wenn keine Frage mehr offen ist, die jetzt schon beantwortbar wäre: jeder Ast besucht, nichts stillschweigend angenommen. Sage das dann in zwei Zeilen und bitte mich, "fertig" zu sagen.

          ## Ausgabe
          Starte jetzt mit Runde 1. Wenn ich "fertig" sage, antworte mit einer kurzen Zeile und danach genau einem Codeblock in dieser Form, mit jeder gestellten Frage und meiner endgültigen Antwort:
          ```handoff
          kind: text
          text: |-
            Start: <die Grundfakten, die ich genannt habe>
            F1 <Titel>: <Optionen A und B>. Empfohlen <A oder B>, <Grund>. Meine Antwort: <meine Antwort>.
            F2 <Titel>: <Optionen A und B>. Empfohlen <A oder B>, <Grund>. Meine Antwort: <meine Antwort>.
          ```
