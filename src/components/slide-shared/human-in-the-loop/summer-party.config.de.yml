            - Jede gegen die Anforderungen prüfen
            - Sie in eine Rangfolge bringen
          ```

          ## Die Option, die Du prüfst
          Hafenhalle
          (Dieser Name ist nur ein Beispiel. Ersetze ihn durch Deinen eigenen Kandidaten. Hast Du keinen, lass ihn stehen.)

          ## So arbeitest Du
          1. Wenn ich noch keinen echten Kandidaten habe (der Name oben ist nur ein Beispiel), nenne zuerst drei echte Locations in der Stadt aus dem Ziel der Spec, die zu den Anforderungen passen, und bitte mich, eine auszuwählen. Prüfe nur die, die ich wähle.
          2. Gehe die Anforderungen eine nach der anderen durch. Finde für jede den Fakt, der sie entscheidet.
