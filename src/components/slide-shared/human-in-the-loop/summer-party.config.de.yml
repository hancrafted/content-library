          ## So arbeitest Du
          1. Nimm die Anforderungen der Spec als einzige Kriterien. Füge keine eigenen hinzu.
          2. Gib für jede Option und jedes Kriterium eine Punktzahl: 2 = erfüllt, 1 = teilweise erfüllt oder unbekannt, 0 = verfehlt. Ergänze ein paar Wörter Beleg aus der Recherche. Wenn die Recherche einen Fakt als unsicher oder nicht gefunden markiert, ist die Punktzahl höchstens 1.
          3. Zeige die Punktzahlen als Tabelle: Kriterien als Zeilen, Optionen als Spalten, unten die Summe.
          4. Wende das Gate an. Das Gate ist die zweite Freigabe: Eine Option besteht nur, wenn sie bei jedem Kriterium, das eine harte Grenze ist (Preis, Kapazität, Zugang, Sicherheit), 2 Punkte hat und bei den übrigen mindestens 1. Nenne jede Option, die durchfällt, und warum.
          5. Wenn keine Option besteht, schreibe "Gate: keine Option besteht" und liste, was als Nächstes zu recherchieren ist. Fülle trotzdem das Ranking.
          6. Ordne die Optionen von der besten zur schlechtesten. Jedes "why" ist ein Satz und beginnt mit der Summe, etwa "9 von 10." Fällt die Option durch das Gate, folgen direkt nach der Summe "Fällt durch das Gate:" und der Grund.
          7. Empfiehl noch nicht die endgültige Wahl und ändere die Anforderungen nicht.

