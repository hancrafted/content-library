    spec:
      title: Requirements card
      description: The answers become a spec with a short list of requirements you sign off, and the work is cut into vertical slices that can be done on their own.
      run:
        todo: Open a new chat, paste the prompt and read the spec and tickets. Ask for changes until you can sign off the requirements.
        prompt: |-
          ## Your role
          You are a spec writer. You turn my interview answers into a clear specification and then cut the work into tickets. You do not interview me again: you synthesise what is written below.

          ## Context
          I have to plan my company's next summer party: 200 employees across five offices in Europe.
          This is the result of the previous step. If you have your own result from that step, replace the block below with it.

          ```handoff
          kind: text
          text: |-
            Start: about 150 euros each, two wheelchair users, some vegetarians.
            Q1 Format: one venue where everyone travels (A) or five local parties (B). Recommended A, the point is that the offices meet. My answer: A.
            Q2 Capacity: one long table for 200 at once (A) or tables that turn over, room for about 140 (B). Recommended A, everyone sits down for the speeches. My answer: A, one long table. I asked for the restaurant comparison first.
            Q3 Where and when: Frankfurt, easy to reach from all five offices (A), or Lisbon (B). Recommended A, one hub keeps travel short. My answer: A, Frankfurt, late June.
            Q4 The one I forgot, last year's feedback: read it first (A) or start fresh (B). Recommended A, it shows what to avoid. My answer: A. It was too loud to talk, and people left early.
            Q5 Quiet: a separate quiet room (A) or one hall for everything (B). Recommended A, people can talk without shouting. My answer: A.
          ```

          ## How to work
          Part 1, the spec. Write it in the chat with exactly these seven headings, in this order:
          1. **Problem Statement**: the problem, from the point of view of the people who have it.
          2. **Solution**: the solution, from the same point of view, in a few sentences.
          3. **User Stories**: a numbered list of at least 8, each "As a <who>, I want <what>, so that <benefit>", covering all the aspects my answers touched.
          4. **Decisions**: the decisions we made, one line each, without brand names or dates I did not give you.
          5. **How we will know it worked**: the checks that prove the goal is met, one line each, about what we can observe and not about how we did it.
          6. **Out of Scope**: what we will not do now.
          7. **Further Notes**: open points, assumptions and risks.

          Part 2, the tickets. Cut the work into tracer-bullet tickets: thin vertical slices. Rules:
          - Each slice cuts a narrow but COMPLETE path from start to finish. It is not one layer of the work.
          - A finished slice can be shown or checked on its own.
          - Each slice is small enough to do in one sitting.
          - Each ticket names its blocking edges: the other tickets that must be done before it can start. A ticket with no blockers can start right away. Only list a blocker that really gates it.
          Show the breakdown as a numbered list: title, blocked by, what it delivers. Do not wait for my approval; I can ask for changes afterwards and you then repeat the two blocks.

          ## Output
          Spec and tickets in the chat first. Then end your answer with exactly two fenced blocks, in this order and shape. In the spec block, the goal is one sentence, the requirements are the short checkable essentials from the Decisions, and the slices are the tickets' titles in short form. Ticket ids are short lower-case words, and every blockedBy entry is an id from the same block.
          ```handoff
          kind: spec
          goal: "<one sentence>"
          requirements: ["<short checkable essential>", "<another one>"]
          outOfScope: ["<what we will not do>"]
          slices: ["<one thin vertical slice>", "<another slice>"]
          ```
          ```handoff
          kind: tickets
          tickets:
            - { id: t1, title: "<title>", acceptance: ["<criterion>"], blockedBy: [] }
            - { id: t2, title: "<title>", acceptance: ["<criterion>"], blockedBy: [t1] }
          ```
