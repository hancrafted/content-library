    plan:
      title: Venue plan
      detail: by Friday
      description: The comparison becomes a one-page recommendation for your boss.
      run:
        todo: Paste this into a new chat to turn the ranking into a one-page recommendation.
        prompt: |-
          Write a one-page recommendation for my boss from this comparison.

