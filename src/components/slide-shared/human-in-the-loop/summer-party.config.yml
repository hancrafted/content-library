            - Step-free
            - Vegetarian menu
            - Quiet to talk
          outOfScope:
            - Travel to the venue
          slices:
            - Check one venue against the requirements
          ```

          Research:
          ```handoff
          kind: research
          subject: Harbour Hall
          summary: A converted warehouse with room for 220 and a step-free entrance. Quiet to talk only in the side hall.
          facts:
            - Fits 220 guests
            - About 140 euros per person with the standard menu
            - Step-free through the main entrance
            - Vegetarian menu on request
            - The main hall echoes; the side hall is quiet
