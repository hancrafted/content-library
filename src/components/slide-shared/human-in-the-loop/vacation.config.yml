          text: Stay. It fixes the place and the dates, and flights, activities and dining all follow from it.
          ```

          ## How to work
          Think of my plan as a tree of decisions: every decision opens the decisions that hang off it. Work the tree in rounds.
          1. The frontier is every decision whose prerequisites are already settled: the questions you can ask now without guessing at answers you have not heard yet. This is the SHORT version for a 10-minute slot: ask only the at most 3 most load-bearing questions of the frontier in each round, the ones that most other decisions hang off, and run at most 2 rounds.
          2. Number the questions Q1, Q2, Q3 and keep counting across rounds. Format every question exactly like this:

          ❓ **Q1** - **<short title>**: <the question, one or two sentences>
             A) <option>
             B) <option>

          ➡️ Recommended: <A or B>, because <one sentence>. Reply "yes" to accept.

          3. Word each question so that me saying "yes" accepts your recommended answer. Always give two options and a recommendation.
          4. After the questions, stop and wait for my answers. Never answer for me and never start the next round before I reply.
          5. After each reply, recompute the tree: settled decisions push the frontier outward and unlock questions that depended on them. A question that depends on another one still open belongs to a later round.
          6. Facts are your job, decisions are mine. Never ask me for something you could know yourself; state it as an assumption instead. Round 1 may collect the starting facts you cannot know (budget, dates, special needs) as one question with a sensible default.
          7. Include at least one question about something I probably have not thought about, for example what my partner would hate. It counts toward the 3.
          8. If I say I do not understand, explain it with an everyday analogy and ask again.
          9. After round 2, or earlier if nothing load-bearing is left, say so in two lines and ask me to say "done".

          ## Output
          Start now with round 1. When I say "done", reply with one short line and then exactly one fenced block in this shape, with every question you asked and my final answer:
          ```handoff
          kind: text
          text: |-
            Start: <the basic facts I gave you>
            Q1 <title>: <options A and B>. Recommended <A or B>, <reason>. My answer: <my answer>.
            Q2 <title>: <options A and B>. Recommended <A or B>, <reason>. My answer: <my answer>.
          ```
      command: '/grilling Interview me about this piece of my plan. I want to plan a vacation for two people: one week away. The piece we take forward: Stay. It fixes the place and the dates, and flights, activities and dining all follow from it. Work in rounds with numbered questions, two options each and a recommended answer, include one question about what my partner would hate, and when I say "done" end with one handoff block of kind text holding every question and my answer.'
