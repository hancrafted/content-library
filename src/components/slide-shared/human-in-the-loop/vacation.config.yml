# The vacation Workflow: data (stages, jobs, edges, outputs) and the English words. The German twin holds `words:`
# only, under the same keys. A prompt is complete as pasted: an earlier result is inlined as its example handoff.
id: vacation
focalJob: spec
stages:
  - id: trip
    moves:
      - B
    jobs:
      - id: pieces
        chat: new
        dependsOn: []
        inputs: []
        outputs: [{ id: piece, kind: text }]
        skills: []
  - id: interview
    moves:
      - I
    jobs:
      - id: interview
        chat: new
        dependsOn: [pieces]
        inputs: [piece]
        outputs: [{ id: answers, kind: text }]
        skills: [productivity/grilling]
  - id: requirements
    moves:
      - R
    gate: 1
    jobs:
      - id: spec
        chat: new
        dependsOn: [interview]
        inputs: [answers]
        outputs: [{ id: spec, kind: spec }, { id: tickets, kind: tickets }]
        skills: [engineering/to-spec, engineering/to-tickets]
  - id: research
    moves:
      - F
    jobs:
      - id: stay
        chat: new
        dependsOn: [spec]
        inputs: [spec]
        outputs: [{ id: research, kind: research }]
        fanOut: 3
        skills: [engineering/research]
  - id: compare
    moves:
      - E
    gate: 2
    jobs:
      - id: compare
        chat: new
        dependsOn: [spec, stay]
        inputs: [spec, research]
        outputs: [{ id: comparison, kind: comparison }]
        skills: []
  - id: recommendation
    jobs:
      - id: plan
        chat: new
        dependsOn: [compare]
        inputs: [comparison]
        outputs: [{ id: plan, kind: text }]
        skills: []

words:
  title: Vacation
  scenario: 'Plan a vacation for two: one week away, and a recommendation for your partner.'
  setup: |-
    claude plugin install mattpocock-skills@claude-plugins-official
    Then open a folder for this task and start Claude Code in it.
  stages:
    trip:
      name: Plan
      moves:
        B: 'Break it down: split the big task into pieces and take only one forward.'
    interview:
      name: Interview
      moves:
        I: 'Interview yourself with AI: the AI asks before it guesses, one question at a time.'
    requirements:
      name: Requirements
      moves:
        R: 'Requirements first: the answers become a short list you sign off before any work starts.'
      card:
        label: Requirements card
        lines:
          - Sleeps 2
          - At most €1,500 for the week
          - At most 10 minutes on foot to the sea
          - Private bathroom
          - Airport transfer of at most 60 minutes
        status: Signed off
    research:
      name: Research
      moves:
        F: 'Fresh start for each piece: one new chat per stay keeps every window small.'
    compare:
      name: Compare
      moves:
        E: 'Evaluate each step: check each result against the card before you move on.'
    recommendation:
      name: Review
  jobs:
    pieces:
      title: Stay
      description: Split the trip into its four pieces and take only one forward, the stay. The other three wait for their turn.
      parked:
        - Flights
        - Activities
        - Dining
      run:
        todo: Open a new chat, paste the prompt and read the answer. Keep the handoff block at the end.
        prompt: |-
          ## Your role
          You are a planning coach. You help me cut a big task into pieces that can be planned one after the other, and you pick the piece to start with.

          ## Context
          I want to plan a vacation for two people: one week away.

          ## How to work
          1. Break the task into exactly four pieces. A piece is something I can plan in its own chat from a short handoff. The order may matter, but each piece must be small enough to plan on its own.
          2. Name each piece in one or two words and add half a sentence on what it decides.
          3. Recommend the single piece to take first: the one that fixes the most for the others. Give the reason in one sentence.
          4. Do not plan any piece yet and do not ask me questions.

          ## Output
          First the numbered list of the four pieces, then the recommendation. End your answer with exactly one fenced block in this shape:
          ```handoff
          kind: text
          text: "<the chosen piece, then its one-sentence reason>"
          ```
      exampleOutput: |-
        ```handoff
        kind: text
        text: Stay. It fixes the place and the dates, and flights, activities and dining all follow from it.
        ```
      check:
        todo: Open a fresh chat, paste the check prompt and fix the one thing it names.
        criteria:
          - There are four pieces and each can be planned in its own chat from a short handoff (order may matter).
          - Exactly one piece is chosen, with a one-sentence reason.
        prompt: |-
          ## Your role
          You are a strict reviewer in a fresh chat. You did not write the work below, you owe it nothing, and you do not rewrite it. You only check it.

          ## Criteria
          1. There are four pieces and each can be planned in its own chat from a short handoff (order may matter).
          2. Exactly one piece is chosen, with a one-sentence reason.

          ## How to work
          1. Grade every criterion above, one by one, as PASS or FAIL.
          2. Back every grade with evidence: quote or point to the exact part of the work. If you cannot find evidence, the grade is FAIL.
          3. Do not be generous. Unclear, missing or only half true counts as FAIL.
          4. After the grades, name the ONE fix that matters most, in one or two sentences, and say exactly what to change.
          5. Add nothing else: no praise, no summary, no rewritten version.

          ## Output
          A list "Criterion: PASS or FAIL, evidence", then "Most important fix: ...".

          ## The answer to check
          This is the whole answer of the first chat, the list and the block. Replace it with your own whole answer if you have one.

          Here are the four pieces:
          1. Stay
          2. Flights
          3. Activities
          4. Dining

          Take first: Stay.

          ```handoff
          kind: text
          text: Stay. It fixes the place and the dates, and flights, activities and dining all follow from it.
          ```
    interview:
      title: AI asks you
      detail: 3 questions, 1 you forgot
      description: The AI interviews you before it guesses, one question at a time, and brings up what you had not thought of.
      run:
        todo: Open a new chat, paste the prompt and answer each round ("yes" accepts the recommendation). When it says the interview is complete, type "done".
        prompt: |-
          ## Your role
          You are a relentless but friendly interviewer, in the style of the "grilling" method. You interview me about the plan below until we share the same understanding, before anybody guesses or writes a plan. You ask. You do not plan yet.

          ## Context
          I want to plan a vacation for two people: one week away.
          We take one piece forward. This is the result of the previous step. If you have your own result from that step, replace the block below with it.

          ```handoff
          kind: text
          text: Stay. It fixes the place and the dates, and flights, activities and dining all follow from it.
          ```

          ## How to work
          Think of my plan as a tree of decisions: every decision opens the decisions that hang off it. Work the tree in rounds.
          1. The frontier is every decision whose prerequisites are already settled: the questions you can ask now without guessing at answers you have not heard yet. Ask the whole frontier in one round.
          2. Number the questions Q1, Q2, Q3 and keep counting across rounds. Format every question exactly like this:

          ❓ **Q1** - **<short title>**: <the question, one or two sentences>
             A) <option>
             B) <option>

          ➡️ Recommended: <A or B>, because <one sentence>. Reply "yes" to accept.

          3. Word each question so that me saying "yes" accepts your recommended answer. Always give two options and a recommendation.
          4. After the questions, stop and wait for my answers. Never answer for me and never start the next round before I reply.
          5. After each reply, recompute the tree: settled decisions push the frontier outward and unlock questions that depended on them. A question that depends on another one still open belongs to a later round.
          6. Facts are your job, decisions are mine. Never ask me for something you could know yourself; state it as an assumption instead. Round 1 may collect the starting facts you cannot know (budget, dates, special needs) as one question with a sensible default.
          7. Include at least one question about something I probably have not thought about, for example what my partner would hate.
          8. If I say I do not understand, explain it with an everyday analogy and ask again.
          9. The interview is finished when the frontier is empty: every branch visited, nothing silently assumed. Then say so in two lines and ask me to say "done".

          ## Output
          Start now with round 1. When I say "done", reply with one short line and then exactly one fenced block in this shape, with every question you asked and my final answer:
          ```handoff
          kind: text
          text: |-
            Start: <the basic facts I gave you>
            Q1 <title>: <options A and B>. Recommended <A or B>, <reason>. My answer: <my answer>.
            Q2 <title>: <options A and B>. Recommended <A or B>, <reason>. My answer: <my answer>.
          ```
        short: |-
