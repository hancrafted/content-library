              purpose: task
              techniques: [delimiters, fresh-context]
              text: |
                /grilling Du bist der Orchestrator. Nimm jedes H3 unter der Überschrift Epics des Plans unten als ein Epic und starte pro Epic einen Subagenten, jeden mit frischem Kontext und nur seinem eigenen Epic. Jeder Subagent stellt mir höchstens {{limit.questions}} nummerierte Fragen zu seinem Epic, mit zwei Optionen und einer empfohlenen Antwort für jede Wahl, und einer Frage zu etwas, woran ich wahrscheinlich nicht gedacht habe. Das ist ein Übungslauf: halte es kurz und kennzeichne jede erfundene Zahl als Annahme.

                ```markdown
                {{plan}}
                ```
            - heading: Format
              purpose: template
              text: |
                Jeder Subagent schreibt sein Ergebnis als Markdown-Datei, oder als rohes Markdown, wenn er keine Dateien anlegen kann, in dieser Vorlage.

                {{template}}
        review:
