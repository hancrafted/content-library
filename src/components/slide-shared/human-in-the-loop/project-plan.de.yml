            - Es gibt höchstens {{limit.questions}} Fragen, und jede Wahl kam mit zwei Optionen und einer Empfehlung.
            - Mindestens eine Frage betrifft etwas, das der Plan nicht sagte.
            - Keine Frage bleibt unbeantwortet, und alles, was geraten wurde, steht unter Annahmen.

