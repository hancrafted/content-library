          techniques: [fresh-context, separate-verification]
          example: &tickets_example |
            # Tickets für das Sommerfest
            ## Tickets
            ### Drei Orte in die engere Wahl nehmen
            Finde drei Orte mit Platz für 200 Personen, höchstens eine Stunde vom Flughafen und von mindestens drei Standorten mit dem Zug erreichbar, mit einem Preis für den Tag. Deckt A1 und A2 ab.
            ### Den Termin festlegen
            Nenne zwei Termine im nächsten Sommer, außerhalb der ersten zwei Augustwochen, und prüfe sie gegen die Feiertage der fünf Länder. Deckt A1 ab.
            ### Die Reise schätzen
            Schätze die Reisekosten je Standort zum ersten Ort, mit Zug oder Flugzeug. Deckt A3 ab.
            ### Die Hotelzimmer blocken
            Finde ein Hotel in der Nähe des ersten Orts mit Zimmern für 200 Personen für eine Nacht, und einen Preis. Deckt A4 ab.
            ### Das Budget schreiben
            Fasse Ort, Reise und Zimmer in einer Budgettabelle mit den Summen zusammen. Deckt A2, A3 und A4 ab.
          goodLooksLike:
            - Jedes Ticket liefert eine kleine Sache von Anfang bis Ende.
            - Jedes Ticket nennt die Anforderungen, die es abdeckt.
            - Zusammen decken die Tickets jede Anforderung ab, ohne Überschneidung.
        instructions: 'Öffne einen neuen Chat und füge den Prompt mit den aufgelösten Anforderungen ein. Kopiere die Tickets, die er schreibt: In der nächsten Stufe bekommt jedes Ticket seinen eigenen Chat.'
