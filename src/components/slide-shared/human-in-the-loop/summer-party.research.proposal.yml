# PROPOSAL for issue #281 (spec #279): the Research stage of summer-party in the new schema. Not loaded by anything.
# Types: workflow-schema.types.ts. Only this stage is written out; the Tickets stage before it is elided, so the
# `tickets` slot names an output that exists once the rest is converted. English only: one language per file.
id: summer-party
title: Summer party

scenario:
  summary: Plan your company's next summer party.
  facts:
    - 200 employees across five offices in Europe
    - An evening in late June in Frankfurt

purposes:
  role: Giving the AI a role makes it more likely to behave that way.
  context: What the AI cannot know unless you tell it.
  task: The one thing you want done.
  steps: The order to work in, so the AI does not skip or reorder.
  template: The exact shape of the answer, so the next chat can read it.
  scope: What is in and out, so the AI does not wander.

reviewer:
  sections:
    - heading: Your role
      purpose: role
      text: You are a strict reviewer in a fresh chat. You did not write the work below and you do not rewrite it. You only check it.
    - heading: What you are given
      purpose: context
      text: '{{inputs}}'
    - heading: General checks
      purpose: steps
      text: |
        1. The work follows the template below exactly: same front matter and the same H2 sections.
        2. Nothing is invented; every claim is backed by a named source.
        3. The work stays inside what it was asked for.
    - heading: Checks for this task
      purpose: task
      text: '{{checks}}'
    - heading: Template
      purpose: template
      text: '{{template}}'
    - heading: Report
      purpose: scope
      text: |
        Grade every check PASS or FAIL with evidence. Do not fix anything. Then write a short fix handoff the user pastes back into the chat that did the work.

templates:
  research: |
    ---
    kind: research
    ---
    # <What was researched>
    ## Fit against the requirements
    ## Cost
    ## Sources
    ## Open doubts
  tickets: |
    ---
    kind: tickets
    ---
    # <Title of the set>
    ## <Ticket title>

stages:
  - id: research
    title: Research
    learningGoal: Give each ticket its own fresh chat so every window stays small and no two chats do the same work.
    move: F
    tasks:
      - id: research
        title: Research one ticket
        output: research # fan-out: hands on research_1 … research_3
        template: research
        fanOut: 3
        slots:
          - id: tickets # the output of the Tickets stage
            mode: single
            label: Your tickets
            sample: |
              ---
              kind: tickets
              ---
              # Summer party tickets
              ## 1. Event hall
              Find one event hall that fits the party.
              - Must have: 200 guests, at most 150 euros per person, step-free, vegetarian menu, separate quiet room
              - Do not name a venue in advance
              ## 2. Hotel with a conference floor
              Find one hotel with a conference floor that fits the party.
              - Must have: 200 guests, at most 150 euros per person, step-free, vegetarian menu, separate quiet room
              - Do not name a venue in advance
              ## 3. Outdoor or garden venue
              Find one outdoor or garden venue that fits the party.
              - Must have: 200 guests, at most 150 euros per person, step-free, vegetarian menu, separate quiet room
              - Do not name a venue in advance
        do:
          simple:
            - heading: Your role
              purpose: role
              text: You are a careful researcher. You work on exactly one ticket and report only what you can back up. You do not compare with other work and you do not recommend.
            - heading: Your ticket
              purpose: context
              text: |
                This is chat {{n}}. Take ticket number {{n}} from the tickets below and work only on it. Other chats take the other tickets.

                {{tickets}}
            - heading: Steps
              purpose: steps
              text: |
                1. Find one real candidate that fits the ticket.
                2. Check it against every must-have in the ticket.
                3. Name the source of every fact and say where you are unsure.
            - heading: Scope
              purpose: scope
              text: Use primary sources. Do not research any other ticket.
            - heading: Format
              purpose: template
              text: |
                If you can create a file, write a markdown file. If not, answer in raw markdown in this template.

                {{template}}
          technical:
            - heading: Task
              purpose: task
              text: |
                /research the tickets below with one subagent per ticket, in parallel. Each subagent gets only its own ticket, checks one real candidate against every must-have, uses primary sources and names the source of every fact.

                {{tickets}}
            - heading: Format
              purpose: template
              text: |
                Each subagent writes its answer as a markdown file, or raw markdown if it cannot create files, in this template.

                {{template}}
        review:
          slots:
            - id: tickets
              mode: single
              label: Your tickets
            - id: research_result
              mode: single
              label: One chat's research result
              sample: |
                ---
                kind: research
                ---
                # Old Mill
                ## Fit against the requirements
                Holds 220 standing. Step-free through the courtyard entrance. Vegetarian menu on request. Quiet room: the loft.
                ## Cost
                140 euros per person with catering.
                ## Sources
                - Venue brochure, page 4
                ## Open doubts
                - Loft capacity not stated
          checks:
            - The result covers exactly one ticket and does not drift into another.
            - Every must-have in the ticket has a verdict with a source.
            - A price far below what the described offer usually costs is flagged as suspicious and sourced again.
            - Where a fact is not found, the doubt says so instead of a guess.
        details:
          why: One ticket per chat keeps the context small and the answer focused, and nothing colours the next chat.
          example: |
            ---
            kind: research
            ---
            # Old Mill
            ## Fit against the requirements
            Holds 220 standing. Step-free through the courtyard entrance. Vegetarian menu on request. Quiet room: the loft.
            ## Cost
            140 euros per person with catering.
            ## Sources
            - Venue brochure, page 4
            ## Open doubts
            - Loft capacity not stated
          goodLooksLike:
            - Each must-have has its own verdict and a named source.
            - What could not be found is written down as an open doubt.
