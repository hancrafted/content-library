          why: Ein Chat, der die Spezifikation und alle Ergebnisse sieht, ordnet sie nach Deinen Kriterien. Er braucht die Fakten jedes Ergebnisses, nicht die Chats, die sie erzeugt haben.
          techniques: [delimiters, cite-sources, separate-verification]
          example: &comparison_example |
            ---
            kind: comparison
            ---
            # Vergleich der Unterkünfte
            ## Kriterien
            - Schläft 2
            - Höchstens 1.500 Euro für die Woche
            - Höchstens 10 Minuten zu Fuß zum Meer
            - Eigenes Bad
            - Flughafentransfer von höchstens 60 Minuten
            ## Rangfolge
            1. Casa Blu: erfüllt jedes Kriterium bei etwa 1.400 Euro; das Meer ist 5 Minuten zu Fuß entfernt.
            2. Hotel Collina: etwa 1.300 Euro und eigenes Bad, aber 25 Minuten zu Fuß zum Meer liegen über dem Limit.
            3. Villa Mare: direkt am Strand, aber etwa 1.900 Euro liegen über dem Budget.
            ## Zweifel
            - Casa Blu: der Flughafentransfer ist nicht bestätigt.
            - Villa Mare: ob für zwei Gäste ein niedrigerer Preis möglich ist.
          goodLooksLike:
            - Die Kriterien sind die der Spezifikation, nicht mehr und nicht weniger.
            - Jeder Platz in der Rangfolge hat eine Begründung aus einem Ergebnis.
        instructions: 'Öffne einen frischen Chat und füge den Prompt mit deinen Recherche-Ergebnissen ein. Lies das Ranking und die Zweifel, die er schreibt.'
